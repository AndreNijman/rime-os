# Layer components for files no RPM owns.
#
# rpm-ostree's build-chunked-oci gives every RPM its own place in the layer
# plan, but everything Rime adds by hand (signed out-of-tree modules, the
# initramfs, the Nerd Font, the Rust tools, the Shell, Rime's daemons, the rpmdb
# itself) lands in ONE catch-all layer, "rpmostree-unpackaged-content". That
# layer is ~390 MB compressed and it changes on EVERY release, because the
# Shell is in it. Naming a component here gives those files a layer of their
# own (rpm-ostree guarantees one layer per user.component value), so a
# Shell-only release changes the Shell's layer and nothing else.
#
# Format: <component> <update-interval> <absolute path or glob>
#   - a directory means every file under it
#   - only files NO package owns are tagged: a rule never pulls a file out of
#     its RPM's layer
#   - update-interval is a hint for the packer (daily|weekly|monthly|yearly)
#
# A component name is part of the published layer plan. Renaming one moves its
# files to a new layer = a one-time re-download of those files on every machine.

# Kernel side: rebuilt only when core is.
rime-kernel-modules  monthly  /usr/lib/modules/*/extra
rime-kernel-modules  monthly  /usr/lib/modules/*/updates
rime-kernel-indexes  monthly  /usr/lib/modules/*/modules.*
rime-initramfs       weekly   /usr/lib/modules/*/initramfs.img
rime-microcode       monthly  /usr/lib/firmware/intel-ucode

# Big, rarely-changing third-party payloads installed outside dnf.
rime-nerd-fonts      yearly   /usr/share/fonts/jetbrains-mono-nerd
rime-tool-sing-box   monthly  /usr/bin/sing-box
rime-tool-zellij     monthly  /usr/bin/zellij
rime-tool-yazi       monthly  /usr/bin/yazi
rime-tool-yazi       monthly  /usr/bin/ya
rime-tool-starship   monthly  /usr/bin/starship
rime-tool-matugen    monthly  /usr/bin/matugen
rime-tool-awww       monthly  /usr/bin/awww
rime-tool-awww       monthly  /usr/bin/awww-daemon
rime-qtwebengine-dictionaries  yearly  /usr/share/qt6/qtwebengine_dictionaries

# Package databases: rewritten by every dnf transaction in base/image.
rime-rpmdb           daily    /usr/share/rpm
rime-rpmdb           daily    /usr/lib/sysimage/rpm
rime-rpmdb           daily    /usr/lib/sysimage/rpm-ostree-base-db
rime-rpmdb           daily    /usr/lib/sysimage/libdnf5
rime-selinux-policy  weekly   /etc/selinux/targeted/active
rime-selinux-policy  weekly   /etc/selinux/targeted/policy

# Rime itself: changes almost every release, kept apart from everything above.
rime-shell           daily    /usr/share/rime-shell
rime-daemons         daily    /usr/bin/rime
rime-daemons         daily    /usr/bin/rimed
rime-daemons         daily    /usr/bin/rime-*
