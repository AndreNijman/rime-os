# Rime isolated CI runners on katana: defaults.
# install.sh copies this to /etc/rime-runner/runner.conf; edit that copy, not this one.
# Every script sources it through lib/common.sh. Shell syntax, no spaces around "=".

# The repository the runners serve, and the labels a job asks for in `runs-on`.
# `katana-nix` is NEW on purpose: today's runner answers `katana` and keeps doing so
# until step 3 replaces it (PLAN.md 6.2 row 6), so no existing job moves by accident.
RIME_RUNNER_REPO=AndreNijman/rime-os
RIME_RUNNER_LABELS=katana-nix
RIME_RUNNER_GROUP_ID=1

# How many jobs may run at once. Each slot is one rime-runner@N.service.
RIME_RUNNER_SLOTS=1

# Credential that may mint just-in-time runner configs (repo Administration: write).
# Root-only, 0600, never mounted into any container.
RIME_RUNNER_TOKEN_FILE=/etc/rime-runner/gh-token

# Everything big lives on /var/lab (ext4, its own disk); /var is ~87 % full.
RIME_RUNNER_STATE=/var/lab/rime-runner
# A podman storage root of its own: images and every job's writable layer live
# here, not in /var/lib/containers, and `podman ps` for Andre's own containers
# never shows a job.
RIME_RUNNER_STORAGE=/var/lab/rime-runner/containers
RIME_RUNNER_RUNROOT=/run/rime-runner/containers
# The shared Nix store. Only the builder container writes it; jobs see it read-only.
RIME_RUNNER_NIX=/var/lab/rime-runner/nix

# Images. The builder is the official Nix image pinned by digest (same Nix as the
# rime-nix dev container). The job image is built locally from images/job.
RIME_RUNNER_BUILDER_IMAGE=docker.io/nixos/nix@sha256:05fe61395588e8a11452e9ba4602d4f0eb0ce5db8f7b9fa417c4ec07af79ca42
RIME_RUNNER_JOB_IMAGE=localhost/rime-runner-job:2.338.2-1

# User namespaces. Container root is an unprivileged host uid in a range no login
# user, no subuid entry and no file on this host owns (login.defs SUB_UID_MAX is
# 600100000; andre is 524288+65536, ghrunner 1000000+65536). Builder gets the first
# block, job slot N gets block N+1, so two jobs never share a uid.
RIME_RUNNER_UID_BASE=2000000000
RIME_RUNNER_UID_BLOCK=65536

# Network: a podman network of its own, firewalled off Andre's LAN (nftables.conf).
RIME_RUNNER_NETWORK=rime-runner
RIME_RUNNER_SUBNET=10.89.77.0/24
RIME_RUNNER_GATEWAY=10.89.77.1
# The network's bridge, named so nftables can match it for IPv6 too (the subnet
# rules only see IPv4). At most 15 characters.
RIME_RUNNER_BRIDGE=rime-runner0
# DNS: public resolvers, reached through the forward path like any other public
# address. NOT aardvark-dns on the gateway: katana's own firewall (table
# inet rime, input policy drop) drops port 53 from container networks, so on
# 2026-11-01 a container on a DNS-enabled test network resolved nothing. The
# network is created with --disable-dns and katana's input stays closed to jobs.
RIME_RUNNER_DNS="1.1.1.1 9.9.9.9"

# Scheduling. No quota: an idle katana gives a job all 20 threads. Weights only
# matter under contention, and then Andre's session (weight 100) wins 5:1.
# `rime-runner-ctl gaming on` drops the slice to CPUWeight=idle.
RIME_RUNNER_CPU_WEIGHT=20
RIME_RUNNER_IO_WEIGHT=20
# Throttle (never kill) before the desktop starts swapping. katana has 62 GB.
RIME_RUNNER_MEMORY_HIGH=44G
RIME_RUNNER_MEMORY_MAX=52G
# The longest job (kernel build) is 28-74 min; give it room.
RIME_RUNNER_JOB_TIMEOUT=6h
