# nix-daemon in the rime-runner builder container. Jobs are UNTRUSTED clients:
# they may build derivations and read the store, but cannot add unsigned paths,
# change substituters or turn the sandbox off (only root in the builder is trusted).
build-users-group = nixbld
sandbox = true
sandbox-fallback = false
experimental-features = nix-command flakes
system-features = nixos-test benchmark big-parallel kvm
trusted-users = root
allowed-users = *
require-sigs = true
substituters = https://cache.nixos.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
max-jobs = auto
cores = 0
# Build directories live in the store volume (/var/lab), not in a RAM tmpfs.
build-dir = /nix/var/nix/builds
# Garbage-collect when the store's disk gets tight; /var/lab is shared with the
# rime-nix dev store and today's runner.
min-free = 53687091200
max-free = 107374182400
keep-outputs = false
keep-derivations = false
