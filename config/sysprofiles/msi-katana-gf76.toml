# Rime OS system profile: msi-katana-gf76
#
# Device profile for the MSI Katana GF76 (Intel i7-12700H P/E hybrid + NVIDIA
# RTX 3070 Laptop, Iris Xe iGPU). Matched on DMI product_name/family containing
# "Katana". Supersedes the intel-hybrid class profile on this machine.
#
# This is an always-on-AC gaming laptop, so the AC default is the top tier.
# platform_profile is omitted because MSI's EC (msi-ec) does not reliably export
# the ACPI platform_profile interface; the real SysWriter would skip it anyway.

id = "msi-katana-gf76"
kind = "device"
description = "MSI Katana GF76 (Intel i7-12700H, RTX 3070 Laptop)"

[defaults]
ac = "performance"
battery = "balanced"

[tiers.performance]
governor = "performance"
epp = "performance"

[tiers.balanced]
governor = "powersave"
epp = "balance_power"

[tiers.power-saver]
governor = "powersave"
epp = "power"

# The msi-ec longevity window. No battery is named: this chassis presents
# its pack as BAT1 rather than BAT0, which is exactly why the paths used to be
# hard-coded here and exactly why they no longer are. rimed discovers the pack
# and its threshold attributes at runtime.
#
# Those attributes come from the out-of-tree msi-ec the image builds (the
# kernel's own msi-ec does not know this EC firmware, 17L3EMS1.109). msi-ec
# keeps both thresholds in ONE EC byte, so the start always reads stop - 10:
# this machine holds 70/80, not 60/80. rimed writes the stop last so the
# 80 % ceiling is the value that lands.
[charge]
start = 60
stop = 80

# ── Fans ─────────────────────────────────────────────────────────────────────
# This board (MS-17L3), as shipped:
#
#   * msi-ec (the out-of-tree build in the image) commands the fans: `fan_mode`
#     auto/silent/advanced plus `cooler_boost` on/off. It has no pwm, so `max`
#     is cooler boost with fan_mode advanced; `auto` hands both back.
#     Measured: max = 7,900 / 6,000 RPM, auto ~4,000 / 3,600 under light load.
#   * msi-wmi-platform binds too (with `force=1`) and registers an hwmon device
#     with four read-only `fanN_input` channels: the RPM rimed shows.
#
# `backend = "auto"` probes in order (hwmon pwm -> msi-wmi-platform -> msi-ec)
# and takes what exists.
[fan]
backend = "auto"
min_pwm = 90              # ~35%: floor for any pwm we ever command
max_pwm = 255
boost_pwm_threshold = 200 # a manual pwm >= this trips cooler_boost on msi-ec
msi_ec_auto_mode = "auto"
msi_ec_max_mode = "advanced"
curve_interval_secs = 3
# Only used where a genuine pwm channel exists; harmless otherwise.
[[fan.curve]]
temp_c = 45.0
pwm = 90
[[fan.curve]]
temp_c = 60.0
pwm = 130
[[fan.curve]]
temp_c = 75.0
pwm = 190
[[fan.curve]]
temp_c = 85.0
pwm = 255

# ── Game mode ────────────────────────────────────────────────────────────────
# i7-12700H: 6 P-cores (12 threads, CPUs 0-11) + 8 E-cores (CPUs 12-19). The
# cpuset is resolved at runtime from /sys/devices/cpu_core/cpus, never
# hard-coded, so a BIOS with E-cores disabled degrades to "all CPUs".
# IRQs are parked on the E-cores while a game runs, except the NVIDIA
# interrupt, which belongs on the cores doing the rendering work.
[gamemode]
enabled = true
tier = "performance"
# The EC's own fan curve, NOT cooler boost: boost runs both fans at ~7,900 /
# 6,000 RPM for the whole session, menus included. Measured, it only pays in
# long heat-soaked play (Cyberpunk back to back: 110 -> 107 fps with it, 111 ->
# 99 without; GPU-bound 51 vs 42). `fan_mode = "max"` turns it back on.
fan_mode = "auto"
cpuset = "p-cores"
irq = "away-from-game"
irq_pin_to_game = ["nvidia"]
cgroup = "/sys/fs/cgroup/rime-game"

# sched-ext scheduler held for the duration of a game session, then stopped.
#
# The image has shipped a CachyOS kernel with CONFIG_SCHED_CLASS_EXT=y and
# sixteen scx schedulers since M1, and nothing ever selected one — the sched-ext
# half of the reason that kernel was chosen was dead weight. This turns it on.
#
# scx_lavd ("latency-aware virtual deadline") is the one that helps a game: it
# is built for interactive/gaming latency, which is what the Katana is for, as
# opposed to scx_rusty/scx_layered (throughput and datacentre shaping). It is
# restored to the kernel's own scheduler on exit, so it applies only while a
# game session is actually held.
#
# Stated explicitly here even though it is now also the built-in default, so the
# reference gaming machine documents its own scheduler rather than inheriting it
# silently. Set it to "" to opt a machine out.
#
# This does nothing on the Daily edition: scxctl drives scx_loader over D-Bus,
# and scx_loader.service is D-Bus activated rather than enabled at boot, so
# rimed logs a skip and carries on.
scx = "scx_lavd"

# RTX 3070 Laptop (GA104, 8 GB GDDR6). Values are clamped at runtime against
# `nvidia-smi --query-gpu=clocks.max.graphics,clocks.max.memory`, so an
# over-ambitious number here can never reach the driver.
#   graphics_clock = [floor, ceiling] in MHz — the floor stops the GPU dropping
#   out of its boost bin mid-frame; 1620 MHz is the part's rated boost.
#   memory_clock = "max" locks GDDR6 to its top supported bin (6001 MHz for the
#   12 Gbps modules MSI ships in this chassis).
[gamemode.nvidia]
enabled = true
persistence = true
graphics_clock = [1200, 1620]
memory_clock = "max"
