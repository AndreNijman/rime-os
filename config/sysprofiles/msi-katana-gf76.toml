# Rime OS system profile: msi-katana-gf76
#
# Device profile for the MSI Katana GF76 (Intel i7-12700H P/E hybrid + NVIDIA
# RTX 3070 Laptop, Iris Xe iGPU). Matched on DMI product_name/family containing
# "Katana". Supersedes the intel-hybrid class profile on this machine.
#
# This is an always-on-AC gaming laptop, so the AC default is the top tier.
#
# platform_profile: this firmware registers no ACPI platform_profile, so rimed
# writes the MSI EC's shift_mode instead (msi-ec; this EC offers turbo, comfort
# and eco): performance -> turbo, balanced -> comfort, low-power -> eco. The EC
# comes up in comfort, which held the CPU near 43 W. Measured 2026-10-08
# (Cyberpunk 2077 built-in benchmark, CPU-bound): comfort 70-74 fps, turbo
# 103-107 fps with the CPU at ~51 W.

id = "msi-katana-gf76"
kind = "device"
description = "MSI Katana GF76 (Intel i7-12700H, RTX 3070 Laptop)"

[defaults]
ac = "performance"
battery = "balanced"

[tiers.performance]
governor = "performance"
epp = "performance"
platform_profile = "performance"
# CPU package power limits [sustained PL1, burst PL2] in watts, held while on
# this tier (rimed pauses thermald for the duration; any other tier hands the
# limits back to the firmware and restarts it).
#
# The firmware's DPTF policy, applied by thermald --adaptive, holds this
# i7-12700H to 38 W / 45 W. Intel rates it 45 W base / 115 W maximum turbo.
# Measured 2026-10-08 (Cyberpunk 2077 built-in benchmark, CPU-bound
# configuration, on a cooling pad, two or more runs each):
#   thermald (38/45)  55-56 fps avg, 1 % low 25-26
#   38/90             78-86 fps,     1 % low 25
#   45/65             108-110 fps,   1 % low 73-75   <- chosen
#   45/90, 45/115, 60/115, 80/115: no faster than 45/65
# The burst stays at 65 W, not 90, for a measured reason: at 90 W, bursts on
# top of the GPU's ~90 W sometimes took the package to 100 C, and the firmware
# then locked it near 47 W with no burst at all — invisibly (MSR 0x610 and
# powercap still read 45/90) — until the next reboot. Runs after that fell to
# ~70 fps with a 1 % low of 10. A reactive guard (drop the burst at 95 C) was
# tried and could not catch Cyberpunk's spikes. 45 W is Intel's base power.
cpu_power_limit_w = [45, 65]

[tiers.balanced]
governor = "powersave"
epp = "balance_power"
platform_profile = "balanced"

[tiers.power-saver]
governor = "powersave"
epp = "power"
platform_profile = "low-power"

# The msi-ec longevity window. No battery is named: this chassis presents
# its pack as BAT1 rather than BAT0, which is exactly why the paths used to be
# hard-coded here and exactly why they no longer are. rimed discovers the pack
# and its threshold attributes at runtime.
#
# Those attributes come from the out-of-tree msi-ec the image builds (the
# kernel's own msi-ec does not know this EC firmware, 17L3EMS1.109). msi-ec
# keeps both thresholds in ONE EC byte, so the start always reads stop - 10:
# this machine holds 70/80, not 60/80. rimed writes the stop last so the
# 80 % ceiling is the value that lands.
[charge]
start = 60
stop = 80

# ── Fans ─────────────────────────────────────────────────────────────────────
# This board (MS-17L3), as shipped:
#
#   * msi-ec (the out-of-tree build in the image) commands the fans: `fan_mode`
#     auto/silent/advanced plus `cooler_boost` on/off. It has no pwm, so `max`
#     is cooler boost with fan_mode advanced; `auto` hands both back.
#     Measured: max = 7,900 / 6,000 RPM, auto ~4,000 / 3,600 under light load.
#   * msi-wmi-platform binds too (with `force=1`) and registers an hwmon device
#     with four read-only `fanN_input` channels: the RPM rimed shows.
#
# `backend = "auto"` probes in order (hwmon pwm -> msi-wmi-platform -> msi-ec)
# and takes what exists.
[fan]
backend = "auto"
min_pwm = 90              # ~35%: floor for any pwm we ever command
max_pwm = 255
boost_pwm_threshold = 200 # a manual pwm >= this trips cooler_boost on msi-ec
msi_ec_auto_mode = "auto"
msi_ec_max_mode = "advanced"
curve_interval_secs = 3
# Only used where a genuine pwm channel exists; harmless otherwise.
[[fan.curve]]
temp_c = 45.0
pwm = 90
[[fan.curve]]
temp_c = 60.0
pwm = 130
[[fan.curve]]
temp_c = 75.0
pwm = 190
[[fan.curve]]
temp_c = 85.0
pwm = 255

# ── Game mode ────────────────────────────────────────────────────────────────
# i7-12700H: 6 P-cores (12 threads, CPUs 0-11) + 8 E-cores (CPUs 12-19). The
# cpuset is resolved at runtime from /sys/devices/cpu_core/cpus, never
# hard-coded, so a BIOS with E-cores disabled degrades to "all CPUs".
# IRQs are parked on the E-cores while a game is IN the cpuset, except the
# NVIDIA interrupt, which belongs on the cores doing the rendering work.
#
# Gaming Mode does not put a game in it: rime-gaming-session names no game, so
# the cpuset stays empty and the game runs on all 20 CPUs, as on the desktop.
# Interrupts therefore stay put too (they used to be moved anyway, onto the
# E-cores the game was also using). A game attached by hand (`rime game start
# --pid`, `rime game attach`) is confined and its interrupts move then.
[gamemode]
enabled = true
tier = "performance"
# The EC's own fan curve, NOT cooler boost: boost runs both fans at ~7,900 /
# 6,000 RPM for the whole session, menus included. Measured, it only pays in
# long heat-soaked play (Cyberpunk back to back: 110 -> 107 fps with it, 111 ->
# 99 without; GPU-bound 51 vs 42). `fan_mode = "max"` turns it back on.
fan_mode = "auto"
cpuset = "p-cores"
irq = "away-from-game"
irq_pin_to_game = ["nvidia"]
cgroup = "/sys/fs/cgroup/rime-game"

# sched-ext: none — the game gets the kernel's own scheduler (BORE), the same
# one the desktop runs. Measured best on this machine (2026-10-08): a CPU-bound
# stand-in game ran 90-91 fps / 1 % low 85-87 under it, against 61-66 / 53 under
# scx_lavd as Gaming Mode loaded it, 70-75 / 53-55 under lavd --performance,
# 85 / 77 under bpfland -m performance and 68 / 56 under p2dq performance mode.
#
# This said scx_lavd until 2026-10-07, when Cyberpunk 2077 ran slower and
# choppier in Gaming Mode than on the desktop. Measured in a live Gaming Mode
# session: CPU-bound (GPU busy 48 %), `GameThread` 98 % busy, and scx_lavd put
# that thread on an E-core in 65 of 200 samples, moving it across all 20 CPUs
# in 5 s. lavd sorts threads onto P- or E-cores by how often they sleep and
# wake others, and a game's busiest thread rarely sleeps, so nothing keeps it on
# a P-core. Its `--performance` mode does not change that sorting. lavd was
# never benchmarked against the kernel's scheduler on this machine before it was
# turned on; the desktop, which never loads it, is the comparison that exists.
# The reasoning is on GameModeConfig::scx_for in rimed-core/src/profile.rs.
#
# Set it to "scx_lavd" to load lavd anyway: the patched build is still in the
# image, and scxctl still drives it.
scx = ""

# RTX 3070 Laptop (GA104, 8 GB GDDR6). No clock locks: the card boosts on its
# own, exactly as it does on the desktop.
#
# This used to lock graphics to [1200, 1620] MHz and memory to "max". 1620 MHz
# is the part's RATED boost, not its ceiling: nvidia-smi on katana reports
# clocks.max.graphics 2100 MHz. Wherever the lock applied, Gaming Mode held the
# GPU up to ~23 % below what the desktop lets it reach, a straight loss in any
# scene the GPU limits. (In the 2026-10-07 session that prompted this, the lock
# was NOT applied: `rime game status` read gpus_lock_attempted 0. It was not
# that session's cause.) The floor and the memory lock went with it: on this
# chassis the CPU and GPU share one cooler, and holding the GPU's clocks up
# while a game waits on the CPU spends the CPU's thermal headroom. Nothing
# measured either lock helping.
[gamemode.nvidia]
enabled = true
persistence = true
