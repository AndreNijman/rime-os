# Rime OS system profile: amd-zen
#
# CPU-class profile for AMD Zen parts driven by amd-pstate-epp (EPP active
# mode). Selected when the CPU vendor is AMD, unless a device profile overrides
# it.
#
# The class deliberately makes no assumption beyond "AMD": an older Zen box on
# plain acpi-cpufreq, or amd-pstate in passive/guided mode, gets the same table
# and the writer drops the knobs that part does not publish. amd-pstate-epp
# exposes exactly two governors (performance, powersave); the EPP string is what
# actually grades performance within each governor, and where EPP is absent the
# governor alone still does the right thing.
#
# No [ryzenadj] table and no power-limit tuning of any kind. Package power
# limits are per-SKU, per-chassis and per-cooling-solution — a class profile
# cannot know a safe number, and asserting one from a class profile would push
# a laptop past its thermal envelope.

id = "amd-zen"
kind = "class"
description = "AMD Zen (amd-pstate / acpi-cpufreq)"

[defaults]
ac = "performance"
battery = "balanced"

[tiers.performance]
governor = "performance"
epp = "performance"
platform_profile = "performance"
cpu_boost = true
cpu_min_freq = "lowest_nonlinear"

[tiers.balanced]
governor = "powersave"
epp = "balance_power"
platform_profile = "balanced"
cpu_boost = true
cpu_min_freq = "lowest_nonlinear"

[tiers.power-saver]
governor = "powersave"
epp = "power"
platform_profile = "low-power"
# Boost off and the clock floor at the hardware minimum: what
# power-profiles-daemon's amd-pstate driver wrote for power-saver, kept now that
# rimed is the only writer (PPD is masked; see docs/rimed-dbus.md).
cpu_boost = false
cpu_min_freq = "cpuinfo_min"
