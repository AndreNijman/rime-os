# Rime OS system profile: thinkpad-l16-g2
#
# Device profile for the Lenovo ThinkPad L16 Gen 2 (AMD Ryzen 7 PRO 250 /
# Radeon 780M, amd-pstate-epp). Matched on DMI product_version / product_family
# "ThinkPad L16" (the product_name is the bare MTM code, e.g. 21SCCTO1WW, so
# matching must look at version/family too). Supersedes the amd-zen class
# profile on this exact machine.
#
# What this device profile adds over the class is a battery-longevity charge
# window. It does NOT name a battery: rimed enumerates
# /sys/class/power_supply at start-up, keeps whatever reports type=Battery, and
# writes the window to every pack whose driver publishes threshold attributes.
# On this machine that resolves to BAT0 via thinkpad_acpi; on a machine where
# it resolves to nothing, the window is skipped and reported unsupported.
#
# The RyzenAdj STAPM/fast reapply loop that used to live here was removed in the
# universal-hardware pass. It was gated on this exact machine, its power numbers
# were this machine's numbers, and it only ran in a tier that no longer exists.
# See docs/m3-notes.md for the reasoning.

id = "thinkpad-l16-g2"
kind = "device"
description = "Lenovo ThinkPad L16 Gen 2 (AMD Zen, Radeon 780M)"

[defaults]
ac = "performance"
battery = "balanced"

[tiers.performance]
governor = "performance"
epp = "performance"
platform_profile = "performance"
cpu_boost = true
cpu_min_freq = "lowest_nonlinear"

[tiers.balanced]
governor = "powersave"
epp = "balance_power"
platform_profile = "balanced"
cpu_boost = true
cpu_min_freq = "lowest_nonlinear"

[tiers.power-saver]
governor = "powersave"
epp = "power"
platform_profile = "low-power"
# Boost off and the clock floor at the hardware minimum: what
# power-profiles-daemon's amd-pstate driver wrote for power-saver, kept now that
# rimed is the only writer (PPD is masked; see docs/rimed-dbus.md).
cpu_boost = false
cpu_min_freq = "cpuinfo_min"

# ── UI boost ─────────────────────────────────────────────────────────────────
# Balanced is the battery default here (governor powersave, EPP balance_power).
# Short frame bursts every 16 ms read as low load to the firmware, clocks stay
# low and frames run late. The boost raises EPP to balance_performance for the
# length of one animation only (Ui.Boost, capped at 600 ms, coalesced and rate
# limited by rimed), then writes the tier's own EPP back. Power-saver is boosted
# too, so the UI is smooth in every tier; its CPU boost stays off and its clock
# floor stays at the minimum during a boost, only EPP moves for those 600 ms.
[ui_boost]
enabled = true
epp = "balance_performance"
tiers = ["balanced", "power-saver"]

# Charge window only — no paths. Applied to whichever batteries support it.
[charge]
start = 75
stop = 80

# ── Fans ─────────────────────────────────────────────────────────────────────
# Verified on this machine: thinkpad_acpi's hwmon node ("thinkpad") publishes
# fan1_input plus pwm1 and pwm1_enable at mode 0644 — but the driver answers
# -EPERM to any write unless it was loaded with fan_control=1, which Rime OS
# does not do. So the attributes look controllable and are not; rimed writes,
# reads back, sees nothing moved, and reports the refusal instead of pretending.
# No default_mode is set here: there is no reason to poke the EC at boot.
[fan]
backend = "auto"
min_pwm = 90

# ── Game mode ────────────────────────────────────────────────────────────────
# Uniform Zen 4 cores: there is no P/E split to pin to, and steering IRQs around
# a homogeneous CPU buys nothing, so both are off. No NVIDIA GPU either. What
# game mode still does here is hold the top tier for the duration of a session.
[gamemode]
enabled = true
tier = "performance"
cpuset = "all"
irq = "off"

[gamemode.nvidia]
enabled = false
