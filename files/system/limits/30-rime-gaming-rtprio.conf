# Rime OS Gaming — allow realtime scheduling priorities for the desktop user.
#
# WHY THIS FILE EXISTS
# `gamescope --rt` asks for SCHED_RR so the compositor thread cannot be starved
# by the game it is presenting. That call needs either CAP_SYS_NICE on the binary
# or a non-zero RLIMIT_RTPRIO for the calling user. Verified on Rime OS:
#
#   $ getcap /usr/bin/gamescope      -> nothing; Fedora sets no file caps
#   $ ulimit -Hr                     -> 0
#
# So `--rt` silently failed to acquire realtime scheduling. gamescope logs it and
# carries on at normal priority, which is exactly the kind of quiet degradation
# that makes a "performance" feature do nothing.
#
# ── 2026-09-19: THIS FILE IS NOT SUFFICIENT FOR `--rt`, AND THAT IS MEASURED ──
# The sentence above says "either CAP_SYS_NICE ... or a non-zero RLIMIT_RTPRIO".
# That is true of sched_setscheduler(2) and it is NOT true of gamescope, which
# gates its realtime path on the CAPABILITY and never looks at the rlimit. On
# katana, in a real Gaming Mode session, with this drop-in installed and working:
#
#   [rime-gaming-session] soft RLIMIT_RTPRIO is 20 — requesting realtime scheduling
#   [gamescope] No CAP_SYS_NICE, falling back to regular-priority compute and
#               threads. Performance will be affected.
#
# — on all three attempts. `rime-gaming-session` now reads CAP_SYS_NICE and only
# passes `--rt` when it is reachable, so the log no longer claims a realtime the
# session did not get.
#
# This file is still worth shipping and is NOT being removed: it is the half that
# any OTHER realtime user on the machine needs, and it is the half that would
# still have to be here if the capability ever arrives. It just does not, on its
# own, buy gamescope anything.
#
# WHY NOTHING WAS ADDED TO GRANT THE CAPABILITY
#   * setcap cannot work. Rime's /usr is a read-only composefs and gamescope
#     arrives through a systemd-sysext overlay whose lower layers are read-only
#     too; there is no writable inode to hang the security.capability xattr on.
#   * pam_cap, the direct analogue of this file, would work mechanically — and
#     would put capabilities into the PERMITTED set of every process in the
#     session, including Steam's own bwrap, which refuses to start with any
#     ("Unexpected capabilities but not setuid, old file caps config?"). That is
#     the unattributed message in evidence §6.3. Granting CAP_SYS_NICE here would
#     trade a frame-pacing regression for a Steam that does not start.
#
# WHY rlimits AND NOT setcap
# A file capability on gamescope would grant CAP_SYS_NICE to every invocation of
# it by anyone, and has to survive an OCI layer -> ostree round-trip to work at
# all. An rlimit is applied by pam_limits at login, is scoped to real login
# sessions, and needs no privileged binary. Verified that the path works here:
# greetd's PAM file (/usr/lib/pam.d/greetd since Fedora 45) includes
# system-auth in its session stack, and that stack
# has `session required pam_limits.so` — so a greetd-started session, which is
# how both the desktop and Gaming Mode start, picks this up.
#
# WHY @wheel AND NOT EVERYONE
# Realtime priority is a denial-of-service primitive: a runaway SCHED_RR thread
# can lock out normal scheduling. wheel is the interactive-owner group the Rime
# installer puts the primary account in, matching the posture of the
# Windows-boot rule. A shared machine's non-admin accounts do not get it.
#
# WHY 20
# gamescope only needs to outrank ordinary SCHED_OTHER work. nice -19 covers
# gamescope's non-RT threads and `rime game`'s reniced helpers.
#
# This comment used to read "20 rather than PipeWire's 70 ... staying well below
# the audio stack means a busy compositor can never preempt PipeWire and cause
# crackle." That was wrong on this image, in a way worth writing down because it
# is the reason the number is not being changed here. Measured 2026-09-08 on both
# the L16 and katana, by tests/test-rime-audio-live.sh:
#
#   * PipeWire's data loops run SCHED_FIFO at priority **20**, not 70. All three
#     of them, on both machines — pipewire, wireplumber and pipewire-pulse.
#   * The 70 comes from /etc/security/limits.d/25-pw-rlimits.conf, which grants
#     it to @pipewire. That group ships EMPTY (this is stock Fedora, not a Rime
#     choice — Fedora relies on RTKit and never populates it), and the file's own
#     comment says so: "if the group is not automatically created, the match rule
#     will never be true and this file will have no effect."
#   * RTKit's MaxRealtimePriority is also 20. So there is no configuration of
#     this image in which PipeWire reaches 70.
#
# So the ordering claim does not hold: this file's ceiling and the audio stack's
# effective priority are the SAME number, and "can never preempt" was never
# established — Rime passes `--rt` with no priority argument, so what gamescope
# requests under this ceiling is gamescope's choice and is not pinned anywhere
# in this repository.
#
# The number is deliberately left at 20. Raising it is a security-posture
# decision (see the DoS note above) and separating the audio stack from the
# compositor properly means granting the audio stack more, not the compositor
# less — which is a change to make on purpose with someone watching, not as a
# side effect of correcting a comment.
#
# LATENT TRAP for whoever does that. Adding the desktop user to @pipewire to
# pick up the 70 would put them in @pipewire AND @wheel. This file sorts after
# 25-, and the precedence pam_limits applies when a user matches two different
# group lines for the same item is NOT documented in limits.conf(5) on this
# image — so it is untested, not known-safe. Verify it with a real login session
# before relying on it.
@wheel   -   rtprio   20
@wheel   -   nice     -19
