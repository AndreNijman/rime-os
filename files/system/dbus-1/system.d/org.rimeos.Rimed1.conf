<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root (the rimed service user) may own the name. -->
  <policy user="root">
    <allow own="org.rimeos.Rimed1"/>
    <!-- rimed is the one writer of the power profile and serves
         power-profiles-daemon's API on its names (the service is masked in
         the image). Allowed here as well as in the package's own file, so
         rimed keeps them if that file ever goes. -->
    <allow own="org.freedesktop.UPower.PowerProfiles"/>
    <allow own="net.hadess.PowerProfiles"/>
  </policy>

  <!-- Any local user may call the service; per-method authorization is
       delegated to polkit (see org.rimeos.rimed.policy). Reads (properties,
       fingerprint, metrics) are unrestricted; the mutating methods
       (SetTier, SetChargeThresholds, ...) are gated by polkit inside rimed. -->
  <policy context="default">
    <allow send_destination="org.rimeos.Rimed1"/>
    <allow receive_sender="org.rimeos.Rimed1"/>
    <allow send_destination="org.freedesktop.UPower.PowerProfiles"/>
    <allow receive_sender="org.freedesktop.UPower.PowerProfiles"/>
    <allow send_destination="net.hadess.PowerProfiles"/>
    <allow receive_sender="net.hadess.PowerProfiles"/>
  </policy>
</busconfig>
