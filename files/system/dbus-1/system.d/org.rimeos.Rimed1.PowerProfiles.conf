<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- rimed answers power-profiles-daemon's API under both of its names
       (rimed/rimed/src/ppd.rs), so a desktop's own power control (GNOME,
       KDE, COSMIC, powerprofilesctl) drives Rime's tiers. Only root (rimed)
       may own them. -->
  <policy user="root">
    <allow own="org.freedesktop.UPower.PowerProfiles"/>
    <allow own="net.hadess.PowerProfiles"/>
  </policy>

  <!-- Anyone may call; every change is authorised by polkit inside rimed
       (org.freedesktop.UPower.PowerProfiles.* actions). -->
  <policy context="default">
    <allow send_destination="org.freedesktop.UPower.PowerProfiles"/>
    <allow receive_sender="org.freedesktop.UPower.PowerProfiles"/>
    <allow send_destination="net.hadess.PowerProfiles"/>
    <allow receive_sender="net.hadess.PowerProfiles"/>
  </policy>
</busconfig>
