# The weekly TRIM, made to finish on a bootc machine (see /usr/libexec/rime-fstrim).
#
# Stock fstrim.service fails for the week whenever system sleep interrupts the
# trim ("FITRIM ioctl failed: Unknown error 512", exit 32), and on a machine
# that HAS an /etc/fstab it never trims the root filesystem, which bootc never
# lists there. The wrapper lists every mounted filesystem and trims one again
# when the kernel interrupted it; real errors still fail the unit.
[Service]
ExecStart=
ExecStart=/usr/libexec/rime-fstrim
