# Rime OS: Gaming Mode is a toggle. rime-greetd spends the one-shot that
# rime-session-select leaves for a desktop <-> Gaming Mode switch and, only
# then, puts `--config <one-shot>` in the env file. greetd itself is still
# exec'd directly by systemd, so it keeps its own SELinux domain. With no
# one-shot (or no env file at all) this is stock `greetd`.
[Service]
EnvironmentFile=-/run/rime-greet/greetd.env
ExecStartPre=-/usr/libexec/rime-greetd
ExecStart=
ExecStart=/usr/bin/greetd $RIME_GREETD_ARGS
