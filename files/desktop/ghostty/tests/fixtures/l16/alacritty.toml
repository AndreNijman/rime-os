
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# Clickable URLs: click opens in the default browser (hold Shift if an app grabs the mouse,
# e.g. Claude Code fullscreen). Ctrl+Shift+O = keyboard hint mode.
[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse = { enabled = true, mods = "None" }
binding = { key = "O", mods = "Control|Shift" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"
