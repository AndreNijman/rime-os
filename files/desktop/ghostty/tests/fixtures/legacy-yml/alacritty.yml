# Synthetic: Alacritty <= 0.12 YAML.
background_opacity: 0.85
draw_bold_text_with_bright_colors: true
working_directory: /home/alex/src
shell:
  program: /run/current-system/sw/bin/bash
  args:
    - --login
font:
  normal:
    family: Fira Code
  size: 12.5
colors:
  primary:
    background: '0x002b36'
    foreground: '0x839496'
  normal:
    black: '0x181818'
    red:   '0xdc322f'
cursor:
  style:
    shape: Underline
    blinking: Always
window:
  padding:
    x: 4
    y: 4
key_bindings:
  - { key: Return, mods: Shift, chars: "\x1b\r" }
  - { key: Back, mods: Alt, chars: "\x1b\x7f" }
  - { key: Key1, mods: Control, action: Copy }
mouse_bindings:
  - { mouse: Right, action: PasteSelection }
alt_send_esc: false
