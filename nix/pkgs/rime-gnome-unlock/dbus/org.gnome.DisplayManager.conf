<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- rime-gnome-unlock (docs/nixos/desktops.md §12.4): GNOME Shell's lock screen asks org.gnome.DisplayManager to check
     the password. Only root owns the name; anyone may call the Manager, whose one real method serves a caller its own
     local graphical session only. The private reauthentication server is not on this bus. -->
<busconfig>
  <policy user="root">
    <allow own="org.gnome.DisplayManager"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.gnome.DisplayManager" send_interface="org.gnome.DisplayManager.Manager"/>
    <allow send_destination="org.gnome.DisplayManager" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.gnome.DisplayManager" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.gnome.DisplayManager" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
