name: PR validation

on:
  pull_request:
    branches: [main]
  # The roadmap v2.2 program integrates onto `roadmap/v2.2` and is forbidden
  # from opening a PR until the final integration, so for the whole of that
  # program NOTHING here ever ran: `pull_request` was the only trigger, and
  # sixty landed roadmap items were verified entirely on one laptop. That is
  # one machine's kernel, one cgroup layout, one set of installed packages.
  #
  # `push` on the integration branch gives every landing a second environment
  # for free, and `workflow_dispatch` lets a task branch be checked BEFORE it
  # lands rather than after — `gh workflow run pr-validation.yml --ref <branch>`.
  # Neither changes what a pull request does.
  push:
    branches: [roadmap/v2.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Select tests
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      installer: ${{ steps.paths.outputs.installer }}
      engine: ${{ steps.paths.outputs.engine }}
      android: ${{ steps.paths.outputs.android }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The range depends on the event, and until now only one event could
          # produce one. `github.event.pull_request.*` is EMPTY on a push, so
          # the first push-triggered run of this workflow died here with
          # `git diff --name-only "" ""` and exit 128 before a single test ran.
          #
          # Whatever cannot be determined selects EVERYTHING. This file already
          # records three separate bugs where a selector picked nothing, the
          # job was skipped, and a skipped job counted as success — so the
          # unknown case fails towards running too much, never too little.
          case "$EVENT" in
            pull_request)
              base="$BASE_SHA"; head="$HEAD_SHA" ;;
            push)
              head="$SHA"; base="$PUSH_BEFORE"
              # All-zeros on a branch's first push, and unreachable after a
              # force-push; both mean "no usable predecessor".
              if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
                 || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                base="$(git merge-base origin/main "$head" 2>/dev/null || true)"
              fi ;;
            *)
              head="$SHA"; base="$(git merge-base origin/main "$head" 2>/dev/null || true)" ;;
          esac

          if [ -n "${base:-}" ] && [ -n "${head:-}" ]; then
            files="$(git diff --name-only "$base" "$head")"
            echo "::notice::classified $EVENT over ${base}..${head}"
          else
            files=""
            echo "::notice::$EVENT gave no usable diff range; selecting every suite"
          fi
          printf '%s\n' "$files"

          rust=false
          installer=false
          engine=false
          android=false
          # `tests/` is in the Rust selector as well as the engine one because
          # test-apex-blueprint.sh and test-apex-modes.sh both drive the built
          # `apex` binary and therefore live in the `rust` job, the only one
          # with a toolchain. A PR touching only such a file used to set
          # engine=true and rust=false, so the suite never ran — and `result`
          # passed anyway, because a skipped job counts as success. A check
          # required on every PR must always report.
          # `config/` and not `config/sysprofiles/`: test-apex-ai.sh reads
          # config/ai/catalogue.toml, so a PR that changed ONLY the catalogue
          # — adding a model, or correcting a digest — set every selector false
          # and skipped this job, and a skipped job counts as success. That is
          # the third instance of this bug in this file, and a catalogue edit is
          # exactly the change most likely to introduce an id `apex ai pull`
          # would refuse. `config/` is small and every file in it is read by the
          # binary this job builds.
          # `files/` — the WHOLE tree — is in the RUST selector as well as the
          # engine one. It began as files/desktop/{fish,nushell,shell}/ and the
          # multiplexer adapter, added because test-shell-agent.sh and
          # test-mux-layouts.sh assert them and run in the rust job, the only
          # one with a toolchain to build `apex`. A PR touching only one of
          # those set engine=true, rust=false, skipped the job, and passed: a
          # skipped job counts as success. Fourth instance of this bug.
          #
          # It is now the whole tree because the narrow path was the wrong
          # shape, and paying the debt one path at a time is what produced six
          # numbered instances. Counted 2026-09-13: SIX suites in the rust job
          # read something under files/ —
          #   check-containerfile-assertions.sh  files/system/NetworkManager/
          #   test-apex-blueprint.sh             files/system/libexec/apex-pkg
          #   test-apex-lid.sh                   files/system/units/, and a grep
          #                                      over ALL of files/ for a static
          #                                      HandleLidSwitch=
          #   test-apex-recover.sh               files/system/libexec/
          #   test-apex-storage.sh               files/system/{libexec,units}/
          #   test-boot-v2.sh                    files/scripts/boot-v2, units/
          # — and the selector reached none of them. Deleting apex-lid.service,
          # or adding `HandleLidSwitch=ignore` to any drop-in under files/, is a
          # files/-only change: engine=true, rust=false, job skipped, PR green,
          # on exactly the change those suites exist to catch. Seventh instance,
          # and the only one of the seven that was never introduced by a single
          # commit — it has been latent under every narrow entry above.
          #
          # The cost is that a files/-only PR now also spins the rust job. That
          # is the trade this file already declares two screens up: "the unknown
          # case fails towards running too much, never too little."
          # docs/ and README.md are in the RUST selector, and only because the
          # job that checks them is the one with a toolchain: check-doc-verbs.sh
          # asks the built `apex` binary what it can do, in both directions. A
          # docs-only PR — deleting the line that documents `apex remote pair`,
          # say — set every selector false, skipped the job, and passed, which
          # is exactly the change that checker exists to catch. Fifth instance
          # of this bug in this file; the four above it are the same shape.
          # Containerfile* is in the RUST selector for the same reason docs/ is:
          # the job that checks them lives here. check-containerfile-assertions.sh
          # runs the image build's own grep assertions against this repo, and a
          # PR touching only a Containerfile set every selector false, skipped
          # this job, and passed -- on exactly the change that checker exists to
          # catch. Sixth instance of this bug in this file, and it was introduced
          # by adding the checker without reading the selector first.
          # `android/core/src/test/resources/` is in the RUST selector as well
          # as the android one, and the reason is the same shape as every other
          # note in this block. `noise-vectors.json` is generated by
          # apex-remote-core's `vectors.rs` and checked by its
          # `the_committed_android_vectors_are_what_snow_produces` test — which
          # lives in the `rust` job. A PR that edited only that file would
          # otherwise never run the check that the file is still what `snow`
          # produces, and hand-editing it is precisely how the Kotlin suite
          # stops being evidence about the protocol the desktop speaks.
          grep -Eq '^(apexd/|config/|Containerfile|docs/|README\.md|tests/|files/|android/core/src/test/resources/)' <<<"$files" && rust=true
          grep -Eq '^installer/' <<<"$files" && installer=true
          # files/** is the whole runtime payload of the image — the package
          # engine, session launchers, guards. A PR touching only that used to
          # run nothing but a syntax check that did not even reach it.
          # Containerfile* is in the ENGINE selector as well as the rust one,
          # and it is another instance of the bug above rather than a new idea.
          # tests/test-apex-a11y-stack.sh asserts what Containerfile.core
          # installs — the screen reader P2-003 names — so a PR that deleted
          # `orca` from that file and touched nothing else set every selector
          # false, skipped every job, and passed, because a skipped job counts
          # as success. The file an assertion is ABOUT has to select the job
          # that runs it.
          # `.github/workflows/` is in the ENGINE selector, and it is the sixth
          # instance of the bug the five comments above describe — this time in
          # the selector list itself. Nothing selected on workflow files at all,
          # so a change touching only a workflow set every selector false,
          # skipped every job, and passed, because a skipped job counts as
          # success.
          #
          # That is not abstract. Deleting the line that invokes a suite is a
          # workflow-only change, and tests/check-suites-run-in-ci.sh — the gate
          # that exists to notice exactly that — lives in this job and would not
          # have run. The check whose job it is to catch a deletion was disarmed
          # by the deletion.
          # `build-local.sh` is in the ENGINE selector for the same reason as
          # every line above, and it is the seventh instance. It sits at the
          # repository ROOT, which no selector named, so a PR editing only it
          # set every selector false, skipped every job, and passed — including
          # tests/test-build-local-shell-ref.sh, the suite that exists to hold
          # its apex-shell pinning rule. The file an assertion is ABOUT has to
          # select the job that runs it.
          grep -Eq '^(files/|tests/|Containerfile|build-local\.sh|\.github/workflows/)' <<<"$files" && engine=true
          # The Android client. Its own job, because none of the three above can
          # build it — and because without this rule an Android-only change
          # matches nothing, every selector stays false, every job is skipped,
          # and a skipped job counts as success at the `result` gate.
          #
          # `tests/test-android-release.sh` and the release workflow are in
          # this selector too, and it is the eighth instance of the bug the
          # comments above describe. The release suite is ABOUT the release
          # workflow and the three scripts under `android/tools/`; a PR that
          # edited only `.github/workflows/release-android.yml` would have set
          # `engine=true` (the workflows selector) and `android=false`, and the
          # android job is the only one that runs that suite. The gate whose
          # job is to hold the release flow would not have run on a change to
          # the release flow.
          grep -Eq '^(android/|tests/test-android-(release|signing)\.sh|\.github/workflows/release-android\.yml)' <<<"$files" && android=true

          # The fail-towards-running rule, applied.
          if [ -z "${base:-}" ] || [ -z "${head:-}" ]; then
            rust=true; installer=true; engine=true; android=true
          fi

          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"

  static:
    name: Static validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # These checks are cheap enough to run over the complete tree. That avoids
      # path-filter blind spots when an included or copied file changes.
      - name: Validate shell and Python syntax
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # Selected by SHEBANG, not by suffix. The old list was `*.sh` plus two
          # installer files named one by one, which checked 25 of the 34 shell
          # scripts in the tree and missed every extensionless one that the image
          # installs into /usr/libexec — including the package engine. A named
          # list also rots silently: a new helper is simply never checked.
          checked=0
          while IFS= read -r -d '' file; do
            head -n1 -- "$file" | grep -qE '^#!.*(bash|/bin/sh)' || continue
            bash -n "$file"
            checked=$((checked + 1))
          done < <(find . -type f -not -path './.git/*' -not -path './apexd/target/*' -print0)
          echo "bash -n: $checked shell scripts"
          # The engine is the one that must never be missed again, so its
          # presence in that set is asserted rather than assumed.
          test -f files/system/libexec/apex-pkg
          bash -n files/system/libexec/apex-pkg
          python3 -m py_compile installer/apex-installer-gui
          # The plugin CLI's node shim. Nothing else in the tree is JavaScript,
          # so it would otherwise be the one shipped program with no syntax
          # check at all — and it is the file that asks apex-shell's validator
          # for every verdict `apex plugin` gives.
          test -f files/system/libexec/apex-plugin-verdict.js
          node --check files/system/libexec/apex-plugin-verdict.js

      - name: Validate TOML
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib

          for path in pathlib.Path('.').rglob('*.toml'):
              if '.git' not in path.parts and 'target' not in path.parts:
                  with path.open('rb') as file:
                      tomllib.load(file)
          PY

      - name: Validate Containerfile layer order
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # Two mistakes that otherwise surface only hours into an image build,
          # on a runner with a six-hour ceiling:
          #
          #   * a RUN that reads a path above the COPY which creates it — the
          #     build fails at that layer, and on this image that is hours in;
          #   * volatile content copied early — `podman build --cache-to`
          #     pushes each intermediate layer to the registry separately, so a
          #     cache miss near the top costs a rebuild AND a push for every
          #     layer beneath it. That is what killed the post-agent-runtime
          #     build at step 76 of 83 after six hours, where the previous
          #     successful build took 3h16m.
          #
          # A static check, so both are caught in seconds on the PR instead.
          python3 files/scripts/check-containerfile-order \
            Containerfile.base Containerfile.core Containerfile.apex

      # ── the checker above, checked ────────────────────────────────────────
      #
      # It was red on 34727364060 for a defect of its own: a path inside a
      # quoted `grep` PATTERN counted as a read, so Containerfile.base:1644 —
      # which greps a unit file for the string `ExecStart=/usr/bin/apex lid
      # watch` and reads nothing — was reported as reading /usr/bin/apex ahead
      # of the COPY at line 2952. The Containerfile says in a comment directly
      # above that line that the binary is deliberately not read there.
      #
      # Nothing asserted the checker itself. Fixing a false positive by making
      # a gate answer "OK" more often is the exact defect this repository has
      # recorded most: a step that runs and inspects nothing. So the fix comes
      # with a harness whose cases sit on BOTH sides — a checker that always
      # passed fails six of them, and one that always failed fails eight — and
      # the over-stripping mutation (drop everything on a `grep` line, not just
      # the pattern) is caught by its own control.
      - name: The layer-order checker can still fail
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ./tests/test-containerfile-order.sh | tee /tmp/cf-order.log
          # Read the summary back rather than banking the exit code. A suite
          # that printed nothing and exited 0 would otherwise be indis-
          # tinguishable from one that ran, which is the defect one level up.
          line=$(tail -1 /tmp/cf-order.log)
          echo "measured: $line"
          n=$(sed -n 's/^\([0-9]*\) passed.*/\1/p' <<<"$line")
          if [ -z "$n" ] || [ "$n" -lt 24 ]; then
            echo "FATAL: expected at least 24 passing cases, got: $line"
            exit 1
          fi
          if ! grep -q ', 0 failed$' <<<"$line"; then
            echo "FATAL: the harness reported failures: $line"
            exit 1
          fi

      # The same gate one level up. The checker that refuses an unreadable
      # build failure is itself a gate, and a gate nobody has watched go red
      # is this repository's most-recorded defect. Every case in the harness
      # sits on one side or the other: a checker that always exited 1 fails
      # eight of them, one that always exited 0 fails seven, and the naive
      # `grep -q akmods` mutation is caught by its own control (the word
      # appearing as a PATH in a `sed` argument).
      - name: The unreadable-failure checker can still fail
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ./tests/test-run-recovery-reachable.sh | tee /tmp/run-recovery.log
          # Read the summary back rather than banking the exit code: a suite
          # that printed nothing and exited 0 is otherwise indistinguishable
          # from one that ran.
          line=$(tail -1 /tmp/run-recovery.log)
          echo "measured: $line"
          n=$(sed -n 's/^\([0-9]*\) passed.*/\1/p' <<<"$line")
          if [ -z "$n" ] || [ "$n" -lt 28 ]; then
            echo "FATAL: expected at least 28 passing cases, got: $line"
            exit 1
          fi
          if ! grep -q ', 0 failed$' <<<"$line"; then
            echo "FATAL: the harness reported failures: $line"
            exit 1
          fi

      - name: Input page and generator agree
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # The settings page writes a JSON model; the generator reads it.
          # Nothing connects the two but a shared understanding of the key
          # names, and both failure modes are silent:
          #
          #   * a key the page offers and the generator ignores — the control
          #     writes the model, the generator runs, success is reported, and
          #     nothing changes. InputService's first draft invented
          #     `numlock_on_boot` exactly this way.
          #   * a default that differs — the generator's defaults are asserted
          #     to reproduce what the shipped compositor configs already set, so
          #     a page that disagrees changes behaviour the first time anyone
          #     touches any single control.
          #
          # Neither shows up in a test of either side alone, because each is
          # internally consistent.
          #
          # apex-shell is a separate repository, so it is checked out here. The
          # checker exits 77 (skip) when it is absent, which keeps this from
          # failing for a reason that is nothing to do with the change.
          # Clone the MATCHING branch where one exists, and say which one was
          # used. This job's first ever run compared apex-os `roadmap/v2.2`
          # against apex-shell `main` and failed on two touchpad defaults —
          # while the two INTEGRATION branches agreed perfectly (22 settings,
          # identical keys and defaults). A parity check that silently compares
          # a branch against someone else's default branch reports drift that
          # is not there and hides drift that is.
          #
          # The real drift it exposed is between the two MAINS, and it is kept
          # rather than papered over: apex-shell main has drag_lock=true and
          # click_method=clickfinger where apex-os main's generator has false
          # and buttonAreas. Whoever performs the final integration must land
          # both sides together, or opening the Input page silently changes a
          # user's touchpad behaviour.
          # ...and then the fallback did exactly the thing the paragraph above
          # forbids, on every branch. apex-shell has no `task/*` twin for most
          # of this program's branches, so "no matching branch" sent the
          # comparison to apex-shell's DEFAULT branch — `main`, the one the
          # paragraph above says is knowingly drifted. The result: this step
          # was red on every apex-os feature branch, for a reason that had
          # nothing to do with the change, which is the precise failure the
          # comment was written to describe. Measured on task/followups-5:
          #   vs apex-shell main          -> rc=1, click_method and drag_lock
          #   vs apex-shell roadmap/v2.2  -> rc=0, "22 settings, identical"
          #
          # So try the integration branch BEFORE the default one. Exact match
          # stays first, which is what keeps the main-vs-main drift reported:
          # on apex-os `main` the exact match is apex-shell `main`, and that
          # comparison still fails, deliberately.
          #
          # `roadmap/v2.2` is hardcoded because it is this program's
          # integration branch, named as such at the top of this file. When
          # the integration branch moves, this moves with it.
          #
          # GITHUB_HEAD_REF first, because on a pull_request GITHUB_REF_NAME is
          # `<n>/merge` — a name no other repository will ever have, so the
          # lookup could only ever miss. Same expression the keybind vendoring
          # step below uses; the two are meant to stay in step.
          want="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          shell_ref=""
          for cand in "$want" roadmap/v2.2; do
            [ -n "$cand" ] || continue
            # ls-remote rather than a clone with stderr thrown away: that
            # conflates "the branch does not exist" with "the network is
            # down", and sends the second one to a silently wrong comparison.
            if git ls-remote --exit-code --heads \
                 https://github.com/AndreNijman/apex-shell "$cand" >/dev/null 2>&1; then
              shell_ref="$cand"; break
            fi
          done
          if [ -n "$shell_ref" ]; then
            git clone --depth 1 -q --branch "$shell_ref" \
              https://github.com/AndreNijman/apex-shell /tmp/apex-shell-parity
            echo "input parity: comparing against apex-shell branch '$shell_ref'"
          else
            git clone --depth 1 -q https://github.com/AndreNijman/apex-shell \
              /tmp/apex-shell-parity || true
            echo "::warning::input parity: apex-shell has no '$want' and no roadmap/v2.2; comparing against its default branch"
          fi
          set +e
          python3 files/scripts/check-input-parity \
            --service /tmp/apex-shell-parity/src/services/config_tab/InputService.qml
          rc=$?
          set -e
          case "$rc" in
            0)  echo "input parity holds" ;;
            77) echo "::notice::apex-shell unavailable; input parity not checked" ;;
            *)  exit "$rc" ;;
          esac

          # Same clone, same shape, a different contract: apexd's power tiers
          # against the shell's picker. tier.rs states in prose that the IDs
          # "must match the strings the D-Bus API and the apex-shell
          # PowerProfileService use verbatim" — and nothing enforced it, so the
          # picker went on offering `ultra` and `ultra-max` for a release after
          # apexd stopped parsing them. Two buttons that could only fail, found
          # by Andre looking at the page rather than by any test on either side,
          # because each side was internally consistent.
          set +e
          python3 files/scripts/check-tier-parity \
            --service /tmp/apex-shell-parity/src/services/system/PowerProfileService.qml
          rc=$?
          set -e
          case "$rc" in
            0)  echo "tier parity holds" ;;
            77) echo "::notice::apex-shell unavailable; tier parity not checked" ;;
            *)  exit "$rc" ;;
          esac

      - name: §24 every session APEX ships has a decided portal backend set
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # Screen sharing, file pickers, screenshots and the dark/light Settings
          # signal all route through xdg-desktop-portal, and the backend is
          # chosen by XDG_CURRENT_DESKTOP. Get that wrong and the session still
          # starts, still looks right, and quietly hands "Open File" to a
          # different implementation — or, where nothing matches, to whichever
          # backend resolves first.
          #
          # niri shipped that way for three releases. Its packaged
          # `default=gnome;gtk` sent FileChooser, AppChooser, Print and Settings
          # to xdg-desktop-portal-gnome while labwc and Hyprland both reached
          # gtk, and the only build assertion that existed named labwc, so
          # nothing could see it.
          #
          # This is enumerated BY DESKTOP NAME, and every name is either pinned
          # by APEX or listed here as deliberately packaged-default with the
          # reason. A count would pass with one of them missing.
          fail() { echo "::error::$*"; exit 1; }

          # Why a name may have no APEX-owned config. Empty means APEX must pin it.
          packaged_reason() {
            case "$1" in
              hyprland) echo "hyprland-portals.conf ships default=hyprland;gtk, and hyprland.portal implements only Screenshot/ScreenCast/GlobalShortcuts/InputCapture, so every desktop interface already reaches gtk" ;;
              *)        echo "" ;;
            esac
          }

          for d in hyprland niri labwc; do
            own="files/system/xdg-desktop-portal/${d}-portals.conf"
            if [ -f "$own" ]; then
              # Captured into a variable first: under `set -o pipefail` a
              # `cat | grep -q` reports the PRODUCER's SIGPIPE status when grep
              # exits early, which has already produced opposite verdicts for
              # the same pattern in this repo.
              body="$(cat "$own")"
              grep -qE '^\s*default=' <<<"$body" \
                || fail "${own} names no default backend"
              # `if`, not `&&`: under `set -e` a `grep && fail` line aborts the
              # step when grep finds nothing, which is the PASSING case.
              if grep -qE '^\s*default=.*[*]' <<<"$body"; then
                fail "${own} resolves backends through a wildcard, which is the defect it exists to remove"
              fi
              grep -qE "^COPY files/system/xdg-desktop-portal/${d}-portals.conf" Containerfile.base \
                || fail "${own} exists but Containerfile.base never installs it"
              grep -q "/etc/xdg-desktop-portal/${d}-portals.conf" Containerfile.base \
                || fail "${own} is not installed into /etc, so the packaged file wins"
              echo "portals: ${d} pinned by ${own}"
            else
              why="$(packaged_reason "$d")"
              [ -n "$why" ] || fail "no portal configuration for the ${d} session, and no stated reason to rely on the packaged one"
              echo "portals: ${d} deliberately packaged-default — ${why}"
            fi
          done

          # A portals.conf is only ever read because the session announces that
          # desktop name. These two are the links that make the filenames mean
          # anything, and both have silently broken before in this repo's history
          # of renames.
          grep -q '^DesktopNames=niri$' files/desktop/wayland-sessions/niri.desktop \
            || fail "niri.desktop no longer announces DesktopNames=niri; niri-portals.conf would be inert"
          grep -q '^XDG_CURRENT_DESKTOP=labwc' files/desktop/labwc/environment \
            || fail "the labwc session no longer announces labwc; labwc-portals.conf would be inert"

          # apex-gaming is gamescope + Steam Big Picture: no desktop session, no
          # Flatpak file dialogs, no portal story. Named as excluded rather than
          # silently absent — silently absent is exactly what niri was.
          grep -q '^DesktopNames=gamescope$' files/desktop/wayland-sessions/apex-gaming.desktop \
            || fail "apex-gaming.desktop changed its desktop name; re-decide whether it now needs a portal config"

      - name: The blueprint and the capsule engine agree on the languages
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # `[development] languages` is validated by apexd-core's LANGUAGES
          # const and converged by apex-env's own LANGUAGES table. The split is
          # deliberate — the planner needs the vocabulary and must NOT have the
          # language -> package table, because a table on the host is what §8
          # exists to avoid — but two lists in two files drift silently, and
          # each side is internally consistent so neither suite catches it.
          #
          # THIS RUNS IN THE `static` JOB ON PURPOSE. The path selectors would
          # otherwise hide it: `rust` fires on ^(apexd/|…) and `engine` on
          # ^(files/|tests/), so a PR touching only apex-env's table never runs
          # the Rust job and a PR touching only the const never runs the engine
          # job — and a skipped job counts as success. That is the exact bug
          # this repository already recorded once with test-apex-modes.sh.
          #
          # Needs no toolchain and no container: it parses one Rust const and
          # runs `apex-env languages`, which is a pure print.
          python3 files/scripts/check-language-parity

      - name: Only the daemon may run host commands
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # `RealWriter::for_daemon` is the one constructor permitted to shell
          # out to scxctl and nvidia-smi. Every other caller — tests above all
          # — gets a writer that logs and skips, because a process spawn is not
          # redirected by the fixture `sys_root` the way a sysfs write is.
          #
          # This is a static check because the symptom was remote from the
          # cause: running the game-mode tests fired a burst of polkit prompts
          # ("Authentication is required to ... switch sched-ext schedulers") on
          # the developer's own desktop and then BLOCKED for 177 seconds waiting
          # on a password, which read as a slow test suite rather than as a test
          # reaching the host.
          # Two allowed files: the daemon that opts in, and syswriter.rs where
          # the constructor is defined and unit-tested. Comment lines are
          # stripped so prose about it does not trip the check. Anywhere else —
          # a tests/ directory, the `apex` CLI, a future binary — is a failure.
          found="$(grep -rn 'RealWriter::for_daemon' apexd --include='*.rs' \
                   | grep -vE ':[0-9]+:[[:space:]]*//' || true)"
          echo "$found"
          outside="$(printf '%s\n' "$found" \
                     | grep -vE '^apexd/(apexd/src/main\.rs|apexd-core/src/syswriter\.rs):' || true)"
          if [ -n "$outside" ]; then
            echo "FATAL: only the daemon may opt into host commands; found:" >&2
            printf '%s\n' "$outside" >&2
            exit 1
          fi
          # No integration test may construct one, whatever the path.
          if grep -rn 'RealWriter::for_daemon' apexd --include='*.rs' \
             | grep -E '/tests/'; then
            echo "FATAL: a test must never opt into host commands (see above)" >&2
            exit 1
          fi
          # And the daemon must still use it, or game mode has silently stopped
          # switching the scheduler — the failure mode of fixing this lazily.
          printf '%s\n' "$found" | grep -q '^apexd/apexd/src/main\.rs:' \
            || { echo "FATAL: the daemon no longer opts in; game mode would never switch the scheduler" >&2; exit 1; }
          echo "host commands: only the daemon opts in"

      - name: Only `apex apply` may converge the machine
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # The blueprint's counterpart to the check above, for the same class
          # of accident one command along. `apex apply` writes session state,
          # runs the package engine and rewrites the user's configuration, so
          # `RealConverger::for_apply` is the one constructor permitted to have
          # effects — everything else gets the inert one, which logs and skips.
          #
          # Three parts, matching the host-command check, because a red check
          # fixed by neutering the feature is the failure mode this shape
          # exists to prevent.
          FILE=apexd/apex/src/blueprint.rs
          test -f "$FILE"

          # 1. Nothing outside that file may construct one. Comment lines are
          #    stripped so prose about it does not trip the check.
          found="$(grep -rn 'RealConverger::for_apply' apexd --include='*.rs' \
                   | grep -vE ':[0-9]+:[[:space:]]*//' || true)"
          echo "$found"
          outside="$(printf '%s\n' "$found" | grep -v "^${FILE}:" | grep . || true)"
          if [ -n "$outside" ]; then
            echo "FATAL: only \`apex apply\` may build a converger with effects; found:" >&2
            printf '%s\n' "$outside" >&2
            exit 1
          fi

          # 2. No test may construct one, whatever the path.
          if grep -rn 'RealConverger::for_apply' apexd --include='*.rs' \
             | grep -E '/tests/'; then
            echo "FATAL: a test must never build a converger with effects (see above)" >&2
            exit 1
          fi

          # 3. And the CLI must still use it, in code that is not #[cfg(test)] —
          #    or `apex apply` has silently become a command that converges
          #    nothing while every test still passes.
          prod="$(sed '/^#\[cfg(test)\]/,$d' "$FILE")"
          grep -q 'RealConverger::for_apply()' <<<"$prod" \
            || { echo "FATAL: nothing outside the tests constructs a live converger; \`apex apply\` would change nothing" >&2; exit 1; }

          # `apply` must never escalate. This is the whole reason it cannot
          # raise a polkit prompt: it converges the privilege domain it is
          # already in and reports the other. A `sudo` here would undo that,
          # and the symptom would be a password prompt in the middle of a test
          # run — which has happened twice in this repository already.
          if grep -nE 'Command::new\("(sudo|pkexec|su|doas)"|"(sudo|pkexec|doas)"' <<<"$prod"; then
            echo "FATAL: apex apply must never escalate privilege (see above)" >&2
            exit 1
          fi
          echo "converging: only \`apex apply\` opts in, and it never escalates"

      - name: §12 shares one apply guard, and its planner stays pure
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # The third member of the family above, for roadmap §12's per-game
          # profiles. Same three-part shape, and for the same reason: a red
          # check fixed by neutering the feature is the failure mode this
          # arrangement exists to prevent.
          CORE_PLAN=apexd/apexd-core/src/gameprofile.rs
          CORE_PROBE=apexd/apexd-core/src/gaming.rs
          CLI=apexd/apex/src/gaming.rs
          for f in "$CORE_PLAN" "$CORE_PROBE" "$CLI"; do test -f "$f"; done

          # 1. `apex game profile apply` moves the same levers as
          #    `apex mode set` — tier, auto-switch, game mode, fan — so it must
          #    obey the SAME guard. A second environment variable would split
          #    one invariant across two names, and the older one's
          #    guard-before-bus proof would stop covering the newer verb.
          prod="$(sed '/^#\[cfg(test)\]/,$d' "$CLI")"
          grep -q 'crate::mode::guard_set()' <<<"$prod" \
            || { echo "FATAL: \`apex game profile apply\` no longer checks the shared guard; it could move the tier of a machine running the tests" >&2; exit 1; }
          if grep -nE 'NO_APPLY_ENV *: *&str *=' "$CLI"; then
            echo "FATAL: §12 must not define a second apply guard (see above)" >&2
            exit 1
          fi

          # 2. The planner and the readiness probe are pure/read-only, which is
          #    what lets every rule in them be unit-tested with no machine to
          #    break. Neither may construct a writer or spawn a process. The
          #    probe reads files by design; running a program is the line,
          #    because a PATH lookup is redirected by a fixture root and a
          #    spawn is not.
          #
          #    Comment lines are stripped, as in the two checks above, so prose
          #    explaining the rule does not trip it — the rule is about code.
          impure="$(grep -nE 'RealWriter|Command::new|std::process::Command' \
                    "$CORE_PLAN" "$CORE_PROBE" \
                    | grep -vE ':[0-9]+:[[:space:]]*//' || true)"
          if [ -n "$impure" ]; then
            echo "FATAL: §12's planner and probe must not write or spawn:" >&2
            printf '%s\n' "$impure" >&2
            exit 1
          fi

          # 3. And the CLI must still route the verb, or `apex game profile
          #    apply` has silently become a command that changes nothing while
          #    every test still passes.
          grep -q 'gaming::profile_main' apexd/apex/src/main.rs \
            || { echo "FATAL: nothing dispatches \`apex game profile\`" >&2; exit 1; }
          # It must be routed at the dispatch site, NOT only inside cmd_game:
          # cmd_game connects to the system bus before it looks at the verb, so
          # routing through it would put a connection ahead of the guard.
          sed -n '/Cmd::Game { cmd } => match cmd {/,/^        },$/p' \
              apexd/apex/src/main.rs | grep -q 'GameCmd::Profile { cmd } => gaming::profile_main' \
            || { echo "FATAL: \`game profile\` must be routed before cmd_game, which connects to the bus first" >&2; exit 1; }
          echo "§12: one shared guard, a pure planner, a read-only probe"

      # §22 boot v2. THIS RUNS IN THE `static` JOB ON PURPOSE, and the reason is
      # the one docs/p1-progress.md already records twice: `rust` fires on
      # ^(apexd/|config/sysprofiles/|tests/) and `engine` on ^(files/|tests/),
      # so a check in either specialised job is skipped by a PR that changes
      # only the other side — and a skipped job counts as success.
      #
      # A boot-v2 PR is exactly that kind of PR. The units and the health
      # helper are under files/, `apex boot status` is under apexd/, and the
      # single most important assertion here spans both: that every unit this
      # image enables is conditioned on systemd-boot's LoaderBootCountPath, so
      # the systemd-boot path stays opt-in and GRUB stays the default for
      # daily, gaming-mesa and gaming-nvidia (AGENTS.md boot-path rule 5). A
      # PR that quietly removed that condition from a unit file would have
      # skipped the `rust` job entirely.
      #
      # No argument, so no `apex` binary is needed. The binary-driven half runs
      # in `rust` below, where the toolchain is, and dies rather than skipping
      # if the binary is missing.
      - name: §22 boot v2 — the opt-in is structural, and nothing shipped touches a boot path
        if: ${{ !cancelled() }}
        run: ./tests/test-boot-v2.sh

      # The in-place migration to systemd-boot. In `static` rather than `rust`
      # because what it guards is mostly a shell engine, a unit and a
      # Containerfile block, and the `rust` job's path filter would skip a PR
      # that changed only those — a skipped job passes.
      #
      # It cannot prove crash-safety; a guest with its power cut did that, and
      # the transcripts are in ROADMAP/evidence/sdboot-migrate-20260921-lab.md.
      # What it holds is the order of the writes, every refusal, and the state
      # machine that stops a failed migration being re-armed on every update.
      - name: §22 migration — one commit point, every refusal, no re-arming a failure
        if: ${{ !cancelled() }}
        run: ./tests/test-boot-migrate.sh

      # The efivars guard. In `static` for the same reason as the step above:
      # the scan it ends with walks EVERY tracked file, so a PR adding a
      # `bootc install --via-loopback` with no `--generic-image` anywhere — a
      # workflow, an installer script, a lab helper — must not be able to skip
      # it by touching neither apexd/ nor files/.
      #
      # 2026-09-20, twice. A loopback install reached bootc's firmware step,
      # bootupd rewrote the HOST's boot entry to point inside the disk image it
      # was building, and the laptop would not boot the next morning. The fix
      # shipped that evening was an efivars tmpfs; the SECOND occurrence, four
      # hours later, happened with that tmpfs applied and logged, because bootc
      # nsenters into the host's mount namespace for that step. The flag that
      # prevents it is `--generic-image`, and this suite proves the wrapper
      # refuses to launch without it. BOOT-BREAKAGE-2026-09-20.md.
      #
      # Nothing dangerous runs here: `podman` and `efibootmgr` are stubs on
      # PATH and the firmware root is a fixture tree. The assertion is about
      # launch ARGUMENTS, which need no launch.
      - name: a loopback bootc install cannot reach this machine's firmware
        if: ${{ !cancelled() }}
        run: ./tests/test-bootc-install-guard.sh

      # windows-installer/ is Windows-targeted code in a repository that is
      # developed, built and tested entirely on Linux, so every one of its unit
      # tests compiles for the HOST and the Windows-only paths are skipped by
      # cfg(). Its first round shipped 655 lines and recorded honestly that no
      # .exe had ever been built here — the toolchain looked unavailable
      # because APEX is bootc and read-only, so `dnf install` on the host is
      # refused. It installs fine in a container.
      #
      # This builds the real PE32+ binary and RUNS it under wine. The exit code
      # is not the assertion: a binary that dies in the loader exits non-zero
      # exactly like one that ran and refused, so the check is on the program's
      # own usage text and its read-only disclaimer reaching the user.
      - name: the Windows binary builds, and it runs
        if: ${{ !cancelled() }}
        run: ./tests/test-windows-installer.sh

      # §27's trust readout, structural half. In `static` because the check
      # that matters most here compares two files in DIFFERENT selectors: the
      # cosign identity in .github/workflows/build-image.yml against the one
      # `apex trust` expects in apexd/apex/src/trust.rs. A PR touching only the
      # workflow sets rust=false, and the drift would ship — with every machine
      # reporting a good image as signed by the wrong party.
      - name: §27 trust — the readout is wired into apex status, and expects the identity CI signs under
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-trust.sh

      # §13.4's tool half, the part an agent actually types. In `static`
      # because the thing being asserted is a command line: which subcommands
      # reach the broker and which reach the real tool unchanged. It needs no
      # toolchain, no wrangler, no terraform and no daemon — the suite refuses
      # to run if `apex` resolves to anything but its own stub, so it cannot
      # quietly start measuring the runner's machine.
      - name: §13.4 tool broker — a brokered subcommand reaches apex, and everything else reaches the tool
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-tool-broker.sh

      # §25's persistent-state migration, structural half. In `static` because
      # the thing most likely to rot here is a doc comment — a version key that
      # goes back to saying "absent means the current version" is a one-line
      # change whose consequence lands the day the schema moves, on somebody
      # else's machine.
      - name: §25 schema — every store declares its rollback answer, and no version key defaults to current
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-schema.sh

      # §48's Storage Manager, structural half. Three one-line changes away
      # from being actively harmful: a comparison against smartctl's exit
      # status turns a failing disk grey, a free-space check pointed at / fires
      # forever on every bootc machine, and a trust in blkid reports an
      # encrypted disk as unencrypted.
      - name: §48 storage — a failing disk is red not grey, and the composefs root is not a full disk
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-storage.sh

      # §P2-015's firmware readout, structural half. fwupdmgr's exit status
      # means "nothing to do" when non-zero and accompanies an explicit error
      # document when zero, so a caller that trusts it reads a current machine
      # as a broken one. And `updatable` is a momentary condition: on battery
      # this machine drops the flag from seven devices including the System
      # Firmware, so printing it as a capability is a lie about the hardware.
      - name: §P2-015 firmware — the document is the only truth, and updatable is not a property
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-firmware.sh

      # The initramfs gates, run against captured listings rather than inside a
      # 40-minute image build. They were inline Containerfile greps until
      # 2026-09-21, which is why one of them shipped asserting
      # `! grep 'kernel/drivers/net/ethernet/'` against a slim initramfs that
      # contains eleven files under kernel/drivers/net — a FATAL on the very
      # artifact it existed to pass, invisible until a build ran it. This step
      # is what makes that class visible in two seconds: it asserts every
      # gate's verdict by name on a fat listing AND a slim one, so a gate that
      # cannot go red fails here.
      - name: initramfs budget — every gate proven red on a fat image and green on a slim one
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-initramfs-budget.sh

      # §33's qualification database, structural half. The two properties it
      # guards are both one-line changes away: a consent gate that reads
      # "not declined" instead of "granted" starts recording on a machine
      # nobody asked, and a verdict collapsed to a bool turns every row nobody
      # has tried into a fault report about working hardware.
      - name: §33 qualify — nothing is recorded without consent, and a check nobody tried is not a check that failed
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-qualify.sh

      # P1-025/026/027/028, structural half, and it belongs in `static` for the
      # usual reason: its subject is the shape of the source, and a PR that
      # changed only a doc would skip the job that guards it. What it holds is
      # that no reader in these modules turns a refused read into a fact — the
      # defect this repository has now found in about fifteen places — and that
      # the dead code which kept this branch out of the tree was fixed by
      # giving it callers rather than by `#[allow(dead_code)]`. The second one
      # cannot be caught by clippy: silencing the lint is what makes clippy
      # green.
      - name: §P1-025 skills & provenance — a refused read is never an absence, and dead code was called rather than silenced
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-skill.sh

      # §P1-061 application permissions. In `static` because the subject is a
      # runtime behaviour of xdg-desktop-portal, not of anything in apexd/ —
      # a PR that changed only docs/app-permissions.md would skip a `rust` job
      # and ship a page that claims a revocation nothing enforces.
      #
      # On a runner with no xdg-desktop-portal it skips the portal half and
      # says so. That is deliberate: the alternative is a green tick for a
      # revocation that was never exercised, which is the exact failure the
      # test exists to catch. The half that matters runs on any machine with
      # the desktop stack, which is every machine this feature ships to.
      - name: §P1-061 app permissions — a revoked grant is refused, and the native one cannot be
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-permissions.sh

      # §P1-061 criterion 4, the other half: does a permission-store change
      # reach a PipeWire client that is ALREADY RUNNING? The answer decides
      # whether Timing::Immediate is a real variant or a placeholder, and for
      # one round it was unmeasured because measuring it looked like it meant
      # revoking a real camera grant. It does not: the harness brings its own
      # session bus, PipeWire, WirePlumber and XDG_DATA_HOME, and takes the
      # grant away from an application id that does not exist.
      #
      # Measured on the L16, 2026-09-12: it does NOT reach it. So this is a
      # MEASUREMENT and not a gate — it prints what it found and exits 0 either
      # way, because a machine where the answer flips is a machine where the
      # model should change, and that is a decision for a person. It needs
      # pipewire, wireplumber, gcc, the libpipewire headers and the pipewire
      # tools, and skips cleanly without them, which is what it does on this
      # runner. It is listed so the entry point exists rather than being
      # something only one laptop knows about.
      - name: §P1-061 app permissions — does a store change reach a running client (measurement)
        if: ${{ !cancelled() }}
        run: ./tests/measure-permission-store-reach.sh

      # §26's channels, structural half, and this one has to be in `static`:
      # every assertion compares .github/workflows against apexd/, which are
      # different path selectors. A PR touching only build-image.yml sets
      # rust=false, and the drift that ships is `stable` quietly advancing on
      # every build — a user who chose it would be taking edge's risk while
      # believing they had opted out.
      - name: §26 channels — edge moves with every build, the slower ones do not, and a promotion cannot skip a channel
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-channel.sh

      # §19's disposable engine, and the structural rules its teardown depends
      # on. In `static` for the reason boot-v2's structural half is: the
      # `engine` selector is ^(files/|tests/) and the `rust` selector is
      # ^(apexd/|config/|tests/), so a PR touching ONLY
      # files/system/libexec/apex-disposable sets engine=true and rust=false.
      # A check that lived only in `rust` would be skipped by exactly the PR
      # that changes the recursive delete — and a skipped job counts as
      # success. `static` has no path filter and can never be skipped.
      #
      # No argument, so no `apex` binary is needed. The binary-driven half runs
      # in `rust` below, where the toolchain is, and dies rather than skipping
      # if the binary is missing.
      - name: §19 disposable execution — the teardown's four fences, and the copy boundary
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-recover.sh

      # §14's cross-file constants. The daemon, the CLI and the unit all have to
      # agree about the socket names, the store root, the protocol version and
      # the refusal of a TCP endpoint — and they are in three different
      # languages, so nothing but a parity check can hold them together.
      #
      # In `static` and not `rust` on purpose. It was put here because a PR
      # touching only files/system/units/apex-aid.service did not set rust=true,
      # and that unit is one of the files this check reads. The rust selector
      # gained `files/` on 2026-09-13, so that particular hole is closed — but
      # `static` is the job with no selector at all, and a parity check across
      # three languages is exactly the thing that should run on every PR rather
      # than on the PRs somebody predicted. It stays here.
      #
      # `--self-test` is the part that makes it worth having: it mutates each
      # constant and asserts the check catches it, and it also asserts a COMMENT
      # mentioning the forbidden token does NOT trip it — the inverse mutant.
      # This repository has shipped four checks satisfied by their own comments;
      # this one proves it is not a fifth.
      # P1-062's chaos harness, tested. `tests/chaos/` is what decides whether
      # APEX survives a fault, so "what decides whether the decider is right?"
      # needs an answer that is not "somebody read it".
      #
      # In `static` because it needs no binary and because the `rust` selector
      # (^(apexd/|config/|tests/)) would in fact catch it — but the boot-path
      # half is a rule about FILE CONTENT under tests/chaos/, and a rule that
      # can be skipped is a rule that gets broken on the PR that skips it.
      # `static` has no path filter and can never be skipped.
      #
      # It carries its own inverse mutants, the way `check-ai-parity
      # --self-test` does: a COMMENT naming bootctl must not trip the check,
      # and neither must a fixture FILE named rpm-ostree-status.json, while a
      # real `sudo rpm-ostree status` must. Without both directions the check
      # would be satisfiable by its own prose, which is the defect this
      # repository has shipped four times.
      - name: P1-062 the chaos harness — the boot-path rule, and every verdict arm
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-chaos.sh

      - name: §14 the daemon, the CLI and the unit agree
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          test -f files/scripts/check-ai-parity
          python3 files/scripts/check-ai-parity
          python3 files/scripts/check-ai-parity --self-test

  rust:
    name: Rust validation
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apexd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        if: ${{ !cancelled() }}
        run: rustup component add clippy

      # bubblewrap is not on the GitHub runner, and six assertions in
      # apex/tests/mcp_sidecar_live.rs depend on it: they confine a real MCP
      # server and then check that the confinement actually holds — no network
      # where none was asked for, no reach into the agent's HOME, no inherited
      # variables, the broker socket opened only on request. Without bwrap each
      # one fails on `apex mcp run: this MCP server cannot be confined`.
      #
      # Installed rather than skipped, deliberately. The alternative pattern in
      # this repository is to skip when a tool is missing, and that is right for
      # a suite needing a compositor or a GPU — but these six are the assertions
      # that the sandbox IS a sandbox, and a security boundary that quietly does
      # not get checked in CI is the one you least want quiet. This file already
      # records four occasions where something skipped and the workflow passed.
      - name: Sandbox tooling the confinement assertions need
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          command -v bwrap
          bwrap --version
          # Ubuntu 24.04 ships kernel.apparmor_restrict_unprivileged_userns=1,
          # which denies an unprivileged user namespace — so bwrap installs
          # fine and then fails with "setting up uid map: Permission denied"
          # and "loopback: Failed RTM_NEWADDR". The runner is ephemeral and
          # unshared, so relaxing it here affects nothing else.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Proven, not assumed: a sandbox that cannot start must fail HERE,
          # naming the reason, rather than three steps later as five confusing
          # assertion failures about MCP servers.
          bwrap --dev-bind / / --unshare-net --unshare-user true \
            || { echo "FATAL: bwrap cannot create a user namespace on this runner"; exit 1; }
          echo "bwrap can create a user namespace"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apexd/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apexd/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings

      # `cargo test` does not build the `apex` binary, and apex-agentd's
      # hook_bridge suite needs it: it runs `apex agent hook` inside a real
      # session to prove the publish path. Without the binary that test SKIPS
      # and reports as a pass, which is how it went unnoticed that the live
      # assertion had never run in CI at all — four green tests in 0.13 s.
      - name: Build the apex CLI, which the live agent tests drive
        if: ${{ !cancelled() }}
        run: cargo build --locked -p apex

      # APEX_REQUIRE_APEX_CLI turns that skip into a failure. Same shape as
      # APEX_REQUIRE_NIRI in tests/test-apex-input.sh: a developer running one
      # crate's tests still gets a skip, CI does not.
      # Through tests/in-login-session.sh, which is what makes §7's LOCAL
      # column reachable. `apex-agentd` decides whether a human is at this
      # machine from the connecting peer's cgroup, and a GitHub runner's
      # processes are in neither a login session nor a user service — so
      # `origin::observe` cannot classify them at all, and every assertion
      # about approving a root operation or holding a system-access grant is
      # refused before it reaches the behaviour it is testing.
      # `system_grants.rs`'s `renewing_a_grant_that_does_not_exist_…` is the
      # one that shows it. The helper enters a real logind session first, or
      # says out loud why it could not and runs the tests exactly as before.
      - name: Tests
        if: ${{ !cancelled() }}
        run: ../tests/in-login-session.sh cargo test --locked
        env:
          APEX_REQUIRE_APEX_CLI: "1"
          # The same shape, for the other thing this step buys. `apex-remoted`'s
          # relay and end-to-end suites cannot pair a device unless §7 observes
          # a human at this machine, so outside a login session they SKIP with
          # the placement named — the honest answer, and a silent pass if it
          # happens HERE, because in-login-session.sh falls back to running the
          # tests unchanged when PAM refuses rather than failing. This step is
          # the one place the session is supposed to exist, so here a skip is a
          # failure. Measured on the runner 2026-09-12: the helper reported
          # `logind session 3, 0::/user.slice/user-1001.slice/session-3.scope`,
          # so this knob asserts a fact that already held rather than asking
          # for a new one.
          APEX_REQUIRE_LOCAL_ORIGIN: "1"

      # §7's table has two columns and they live in two different
      # environments, so no single `cargo test` run can cover both: inside a
      # login session the origin is local, and outside one it is not. The step
      # above buys the local column, which had never executed in CI. This step
      # keeps the other one instead of trading it away.
      #
      # `request_origin.rs` asserts the RULE rather than a fixed answer, so it
      # is green either way and is simply run again here. `system_grants.rs`
      # is filtered to the single test that needs a non-local placement — the
      # rest of that file needs a local one and is covered above — and the
      # count is then checked, because a `cargo test` whose filter matches
      # nothing exits 0 having run nothing, which is the green-tick-over-
      # nothing-asserted shape docs/p1-progress.md records this repository
      # being bitten by three times. Here it would fire the day somebody
      # renames the test.
      - name: The non-local column, from the runner's own placement
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked -p apex-agentd --test request_origin
          out="$(cargo test --locked -p apex-agentd --test system_grants \
                 a_non_local_caller_is_refused_a_grant_before_polkit_is_asked \
                 -- --exact --nocapture 2>&1)"
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q '1 passed' || {
              echo "::error::a_non_local_caller_is_refused_a_grant_before_polkit_is_asked did not run; has it been renamed?"
              exit 1
          }

      # §10's blueprint suite drives the COMPILED binary, so it belongs here
      # rather than in the `engine` job: this is where the toolchain and the
      # cargo cache are, and building `apex` a second time elsewhere would
      # double the slowest step in the PR for no extra coverage.
      #
      # APEX_BLUEPRINT_NO_APPLY is set for the whole step as a blanket net for
      # anything that might invoke `apex apply` directly. It is NOT what keeps
      # the suite safe, and pretending otherwise would be worse than not
      # setting it: the suite builds each invocation's environment with
      # `env -i`, so this variable does not reach the binary at all. What
      # actually keeps it safe is that `apply` never escalates — every run in
      # the suite is an ordinary user, so the only reachable steps write files
      # inside a throwaway HOME the suite created — plus fake `sudo`, `pkexec`,
      # `secret-tool` and friends first on PATH, whose invocation the suite
      # fails on. It asserts the guard itself by setting the variable
      # explicitly, per case.
      - name: Run blueprint and sync assertions
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          APEX_BLUEPRINT_NO_APPLY: "1"
        # No APEX_BIN: the suite builds the binary itself, which is a cache hit
        # after the two steps above. Pointing it at a path instead would make
        # the job depend on exactly which targets `cargo test` happens to
        # build, and the failure would read as a broken suite rather than a
        # missing artefact. When it cannot build, it exits non-zero — a suite
        # that cannot run must never report a green tick, which this repository
        # has now been bitten by three times.
        run: ./tests/test-apex-blueprint.sh

      # §11/§12/§13's shell-level suite. It lives HERE rather than in the
      # `engine` job because it runs the real built `apex` binary, and this is
      # the only job with a Rust toolchain and a warm cargo cache.
      #
      # It is also the suite that must never reach the host. The area has form:
      # an earlier game-mode suite shelled out to `scxctl`, raised a burst of
      # polkit prompts on the developer's desktop and blocked 177 seconds on a
      # password. So this one invokes only read-only and --dry-run verbs, puts
      # fake scxctl/nvidia-smi/systemctl first on PATH, fails if any of them is
      # called, and proves that tripwire is armed with a negative control.
      - name: Run mode, workload and Performance Lab assertions
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: ./tests/test-apex-modes.sh

      # §12's other two halves: per-game profiles and boot-to-game readiness.
      # A separate file from the suite above because it is a separate claim —
      # that one asserts `mode`/`workload`/`perf` only report, this one asserts
      # a profile is stored losslessly, resolves to one ordered plan, and is
      # gated before it can move anything.
      #
      # It carries its own tripwire and its own negative control rather than
      # inheriting them, because a separate file with an unarmed tripwire would
      # be worse than no separate file. `steam` and `gamescope` are in its fake
      # set as an assertion in their own right: the readiness probe must find
      # them by PATH lookup and must never spawn one.
      #
      # Every invocation in it redirects DBUS_SYSTEM_BUS_ADDRESS at a path that
      # does not exist, so nothing in it can reach a live apexd — which is also
      # what makes it behave identically here and on a developer's desktop.
      - name: Run per-game profile and boot-to-game assertions
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: ./tests/test-apex-gaming.sh

      # What the Gaming Mode session actually hands gamescope, measured by
      # RUNNING the session script with a fake gamescope that records its argv.
      # Before this, the only thing behind apex-gaming-session was `bash -n` in
      # Containerfile.apex — a parser, which accepted every version of the
      # script that produced the 2026-09-19 katana failures: gamescope on the
      # Intel iGPU with the external monitor dark, and `--rt` passed to a
      # gamescope that logged "No CAP_SYS_NICE" and ran at normal priority.
      #
      # Both of those are now decisions the script makes from sysfs and
      # /proc/self/status, so both are reachable on a runner with no GPU: the
      # suite feeds it katana's exact DRM topology as a fixture tree. It uses
      # the REAL apex binary for the selection rule, through APEX_ROOT, so what
      # is under test is the code that ships rather than a fake that agrees
      # with the test.
      - name: Run Gaming Mode session assertions
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: ./tests/test-apex-gaming-session.sh

      # §22's `apex boot status`, driven against fixture roots that stand in
      # for a GRUB machine and for a systemd-boot machine mid-rollback. The
      # sd-boot fixture's entry list is the document `bootctl list --json`
      # produced from an ESP a VM had actually booted four times, so the field
      # shapes — including triesLeft being ABSENT rather than 0 on a blessed
      # entry — are measured rather than invented.
      #
      # `--with-binary` re-runs the toolchain-free half too. That is
      # deliberate: it costs a second and it means a PR touching apexd/ gets
      # the unit-file assertions as well, rather than relying on the `static`
      # job being the only place they exist.
      #
      # APEX_BOOT_ROOT relocates every path the command READS. No program name
      # comes from the environment: bootctl is a fixed absolute path and under
      # a fixture root it is not executed at all.
      - name: §22 boot v2 — apex boot status against GRUB and systemd-boot fixtures
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          APEX_BIN: ${{ github.workspace }}/apexd/target/debug/apex
        run: |
          set -euo pipefail
          cargo build -p apex --locked --manifest-path apexd/Cargo.toml
          # A missing binary must be a hard failure, not a skip.
          test -x "$APEX_BIN"
          ./tests/test-boot-v2.sh --with-binary

      # §27's binary half: `apex trust` and `apex status` against fixture
      # machines — an unverified pull on a permissive policy (what every APEX
      # machine has today), a signed pull on a strict one, and the two reads
      # that must report as unavailable rather than as an answer. `--verify`
      # refuses to run under a fixture root, so this step never leaves the
      # runner and cannot go red because ghcr.io is having a bad day.
      - name: §27 trust — apex trust against unverified, signed and unreadable fixtures
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          APEX: ${{ github.workspace }}/apexd/target/debug/apex
        run: |
          set -euo pipefail
          cargo build -p apex --locked --manifest-path apexd/Cargo.toml
          test -x "$APEX"
          ./tests/test-apex-trust.sh --with-binary

      # §27's other half, and the half that refuses things. The step above
      # guards the READOUT — that `apex trust` describes the machine's trust
      # state without lying about it. This one guards the GATE: that
      # `apex update` refuses an image whose signature does not verify, permits
      # one it merely could not check, and says which of the two happened.
      # It was DEBT in tests/suites-not-in-ci.txt; no CI run had executed it.
      #
      # Every assertion needs a minted CA and a real signature, so it is slower
      # than the readout suite and it needs openssl. It never touches a real
      # deployment: the fixtures are a mktemp tree passed as APEX_TRUST_ROOT.
      #
      # The floor is the assertion that matters on a RUNNER specifically. This
      # repository has a standing note that the CI runner is a second
      # environment, openssl among the differences, and the suite already
      # feature-detects `openssl x509 -not_before`. A runner whose openssl
      # cannot mint one of these certificates would quietly assert less and
      # still print a green summary — so the count is read back and floored.
      - name: §27 trust — the gate rather than the readout, so a bad signature is refused
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          APEX: ${{ github.workspace }}/apexd/target/debug/apex
        run: |
          set -euo pipefail
          cargo build -p apex --locked --manifest-path apexd/Cargo.toml
          test -x "$APEX"
          rc=0; out="$(./tests/test-apex-trust-enforcement.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 0 ] || { echo "::error::the trust-enforcement suite exited $rc; it exits 1 before asserting anything if openssl is missing"; exit 1; }
          summary="$(printf '%s\n' "$out" | grep -E '^[[:space:]]*[0-9]+ passed, [0-9]+ failed$' || true)"
          [ -n "$summary" ] || { echo "::error::the trust-enforcement suite printed no summary line"; exit 1; }
          [ "$(printf '%s\n' "$summary" | wc -l)" = 1 ] || { echo "::error::more than one line looked like the summary; the parse below would read the wrong one"; exit 1; }
          passed="$(printf '%s' "$summary" | awk '{print $1}')"
          failed="$(printf '%s' "$summary" | awk '{print $3}')"
          echo "measured: passed=$passed failed=$failed"
          [ "$failed" = 0 ] || { echo "::error::$failed trust-enforcement assertions failed"; exit 1; }
          [ "$passed" -ge 77 ] || { echo "::error::only $passed trust-enforcement assertions ran; 77 ran on 2026-09-13, so some no longer execute — the runner's openssl is the first thing to check, the suite drops assertions it cannot mint a certificate for"; exit 1; }
          if printf '%s\n' "$out" | grep -qiE '^[[:space:]]*(SKIP|skipped)'; then
              echo "::error::the trust-enforcement suite printed a SKIP; a could-not-run is not a pass"
              exit 1
          fi

      # P0-002's first criterion has two halves, and only one of them was ever
      # measured anywhere. The PATH half — the store is /var/lib/apex-secretd
      # and not $HOME — is a unit test and has been true since the crate landed.
      # The AT-REST half is not a property of the path at all: it is whether a
      # process running as the owner's own uid can open the file. That needs
      # real root and a real uid boundary, so it is a shell suite, and it sat in
      # tests/suites-not-in-ci.txt as DEBT — the property P0-002 earned, checked
      # by nobody.
      #
      # In the rust job because it builds apex-secretd itself with cargo, and
      # this is the only job with a toolchain.
      #
      # It uses `sudo -n`, which by definition cannot prompt, and touches
      # nothing outside a fresh mktemp tree: --store and --socket point the
      # daemon there, and the real /var/lib/apex-secretd and the shipped unit
      # are never started, stopped or read. A GitHub runner's passwordless sudo
      # is what makes it meaningful here — without it the suite abstains, and
      # the step below refuses the abstention rather than banking its exit 0.
      - name: P0-002 secrets at rest — the owner's own uid is refused by the kernel
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rc=0; out="$(./tests/test-secret-at-rest.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 0 ] || { echo "::error::the secret-at-rest suite exited $rc"; exit 1; }
          summary="$(printf '%s\n' "$out" | grep -E '^secret-at-rest: [0-9]+ passed, [0-9]+ failed$' || true)"
          [ -n "$summary" ] || {
              echo "::error::no summary line. Both of this suite's abstentions print 'secret-at-rest: 0 passed, 0 failed, SKIPPED' and exit 0 — no passwordless sudo, or running AS root — and either would otherwise be a green tick over the whole at-rest property"
              exit 1
          }
          [ "$(printf '%s\n' "$summary" | wc -l)" = 1 ] || { echo "::error::more than one line looked like the summary; the parse below would read the wrong one"; exit 1; }
          counts="$(printf '%s' "$summary" | sed 's/^secret-at-rest: //')"
          passed="$(printf '%s' "$counts" | awk '{print $1}')"
          failed="$(printf '%s' "$counts" | awk '{print $3}')"
          echo "measured: passed=$passed failed=$failed"
          [ "$failed" = 0 ] || { echo "::error::$failed at-rest assertions failed"; exit 1; }
          [ "$passed" -ge 19 ] || { echo "::error::only $passed at-rest assertions ran; 19 ran on 2026-09-13, so some no longer execute"; exit 1; }
          if printf '%s\n' "$out" | grep -qE '^[[:space:]]*SKIP'; then
              echo "::error::the secret-at-rest suite printed a SKIP; it has no skip counter, so one appearing means an assertion stopped being made"
              exit 1
          fi

      # ── P1-063 lid, and the reason this step exists at all ─────────────────
      # tests/test-apex-lid.sh is sixty assertions for the behaviour Andre
      # asked for by name — close the lid at school and the agents keep
      # running — and until this line, no CI run had ever executed one of
      # them. It sat in tests/suites-not-in-ci.txt as debt: a file that looks
      # like coverage and gates nothing.
      #
      # It lives in the RUST job because it drives the shipped `apex lid`
      # binary, and this is the only job with a toolchain. tests/ is in the
      # rust selector, so an edit to the suite reaches it.
      #
      # The suite opens no window, starts no compositor, suspends nothing and
      # never touches the machine running it: every fixture is a tree under
      # mktemp, HOME is pushed inside it so the invoking account's own
      # ~/.config/apex/lid.toml cannot be read, and every power-down action is
      # a logged argv rather than a syscall. The real SW_LID half needs uinput,
      # root and a machine you are willing to watch sleep — that is
      # test-apex-lid-live.sh, which stays exempt for that reason.
      #
      # The step reads the suite's own summary line back rather than banking
      # exit 0, because the point of wiring a suite in is evidence that it RAN.
      # It also fails on a SKIP: this suite ships no skip helper at all, by a
      # decision written into its header, so a SKIP appearing means an
      # assertion stopped being made.
      - name: P1-063 lid — sixty assertions no CI run had ever executed
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          APEX_BIN: ${{ github.workspace }}/apexd/target/debug/apex
        run: |
          set -euo pipefail
          cargo build -p apex --locked --manifest-path apexd/Cargo.toml
          test -x "$APEX_BIN"
          rc=0; out="$(./tests/test-apex-lid.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 0 ] || { echo "::error::the lid suite exited $rc; it says FATAL and exits 2 when it cannot find the binary or python3"; exit 1; }
          summary="$(printf '%s\n' "$out" | grep -E '^[[:space:]]*[0-9]+ passed, [0-9]+ failed$' || true)"
          [ -n "$summary" ] || { echo "::error::the lid suite printed no summary line"; exit 1; }
          [ "$(printf '%s\n' "$summary" | wc -l)" = 1 ] || { echo "::error::more than one line looked like the summary; the parse below would read the wrong one"; exit 1; }
          passed="$(printf '%s' "$summary" | awk '{print $1}')"
          failed="$(printf '%s' "$summary" | awk '{print $3}')"
          echo "measured: passed=$passed failed=$failed"
          [ "$failed" = 0 ] || { echo "::error::$failed lid assertions failed"; exit 1; }
          [ "$passed" -ge 60 ] || { echo "::error::only $passed lid assertions ran; 60 ran on 2026-09-13, so some no longer execute"; exit 1; }
          if printf '%s\n' "$out" | grep -qE '^[[:space:]]*SKIP'; then
              echo "::error::the lid suite printed a SKIP; it ships no skip helper, so one appearing means an assertion stopped being made"
              exit 1
          fi

      # §25's binary half: `apex schema` against real state trees — a record
      # from before the version key existed migrated with a copy kept, a record
      # from a newer APEX left byte-identical, and a blueprint from a newer
      # APEX refused by name rather than by serde. The suite exports
      # XDG_STATE_HOME and XDG_CONFIG_HOME at its own mktemp tree and hard-exits
      # if any store path resolves outside it: this is the suite that drives the
      # code which REWRITES persistent state.
      - name: §25 schema — apex schema against records older and newer than this build
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          APEX: ${{ github.workspace }}/apexd/target/debug/apex
        run: |
          set -euo pipefail
          cargo build -p apex --locked --manifest-path apexd/Cargo.toml
          test -x "$APEX"
          ./tests/test-apex-schema.sh --with-binary

      # §48's binary half: `apex storage` and the notifier against a whole
      # fixture machine — sysfs, mountinfo, udev records and captured smartctl
      # output for a healthy disk, a failing one and a refused read. Nothing
      # touches a real block device: under $APEX_STORAGE_ROOT no subprocess is
      # spawned at all, and the notifier's notify-send is a shim that writes to
      # a file.
      - name: §48 storage — apex storage against a healthy disk, a failing one and a refused read
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          APEX: ${{ github.workspace }}/apexd/target/debug/apex
        run: |
          set -euo pipefail
          cargo build -p apex --locked --manifest-path apexd/Cargo.toml
          test -x "$APEX"
          ./tests/test-apex-storage.sh --with-binary

      # §P2-015's binary half: `apex firmware` against captured fwupd
      # documents — the on-battery one, an Error object that arrived with exit
      # zero, a document with no Devices list at all, and prose where JSON was
      # asked for. No fwupdmgr is spawned; every answer is a file the script
      # writes, so this runs on a machine with no fwupd and no system bus.
      - name: §P2-015 firmware — apex firmware against fwupd's own oddest answers
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          APEX: ${{ github.workspace }}/apexd/target/debug/apex
        run: |
          set -euo pipefail
          cargo build -p apex --locked --manifest-path apexd/Cargo.toml
          test -x "$APEX"
          ./tests/test-apex-firmware.sh --with-binary

      # §33's binary half: `apex qualify` against a whole fixture machine —
      # DMI, PCI, cpuinfo, cmdline and an EFI variable — including a serial
      # number sitting in DMI next to the model, which must not reach the
      # database, and a sealed SecureBoot variable, which must read as not
      # checked rather than as a firmware that fails.
      - name: §33 qualify — apex qualify against a fixture machine, consent gate and all
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          APEX: ${{ github.workspace }}/apexd/target/debug/apex
        run: |
          set -euo pipefail
          cargo build -p apex --locked --manifest-path apexd/Cargo.toml
          test -x "$APEX"
          ./tests/test-apex-qualify.sh --with-binary

      # P1-061's binary half. The three refusals `apex permissions revoke` owes
      # — a native subject, a Flatpak carrying `devices=all`, and a capability
      # this session has no portal for — must each exit NON-ZERO with its own
      # sentence, against a shimmed `flatpak` and `busctl` so no real store is
      # touched. The control case, a capability that genuinely can be revoked,
      # runs beside them: a suite where every case refuses would pass on a
      # binary that refused everything.
      - name: §P1-061 app permissions — revoke refuses what it cannot do, and names what it can
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          APEX: ${{ github.workspace }}/apexd/target/debug/apex
        run: |
          set -euo pipefail
          cargo build -p apex --locked --manifest-path apexd/Cargo.toml
          test -x "$APEX"
          ./tests/test-apex-permissions.sh --with-binary

      # P1-025/026/027/028's binary half: the four verbs against fixture HOMEs,
      # including a skills directory that exists and is refused (which must
      # never read as a machine with no skills), a plugin edited after it was
      # recorded, a baseline store that cannot be parsed (could-not-run, not
      # first-sight — the latter is what a DELETED store looks like), and a
      # documentation-only plugin, which must not come out "sandboxed" on a
      # vacuously true field.
      #
      # Each fixture gets its own XDG_STATE_HOME as well as its own HOME:
      # `apex provenance record` writes a baseline store and `store_path`
      # prefers XDG_STATE_HOME, so a suite setting only HOME would write over
      # the runner's real one.
      - name: §P1-025 skills & provenance — apex skill / provenance / mcp planes against fixture homes
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          APEX: ${{ github.workspace }}/apexd/target/debug/apex
        run: |
          set -euo pipefail
          cargo build -p apex --locked --manifest-path apexd/Cargo.toml
          test -x "$APEX"
          ./tests/test-apex-skill.sh --with-binary

      # §26's binary half: `apex channel` against fixture machines on each of
      # the four channel tags and on the legacy alias every installed machine
      # actually follows.
      - name: §26 channels — apex channel against a machine on each tag
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          APEX: ${{ github.workspace }}/apexd/target/debug/apex
        run: |
          set -euo pipefail
          cargo build -p apex --locked --manifest-path apexd/Cargo.toml
          test -x "$APEX"
          ./tests/test-apex-channel.sh --with-binary

      # §19's binary half: the recovery surface against whole fixture machines,
      # `apex doctor --json`, and the factory reset.
      #
      # This step drives the most destructive verb in the product, so it is
      # worth stating what stops it reaching the runner: every path is
      # redirected into a temp tree and the suite hard-exits if one resolves
      # outside it, a PATH tripwire fails the run if bootctl, efibootmgr,
      # ostree, bootc, podman, pkexec, busctl or sudo is ever spawned, canaries
      # planted outside every fixture are compared byte-for-byte at the end
      # (Rust's remove_dir_all spawns no `rm`, so the PATH tripwire is blind to
      # it), and the invoking account's own ~/.config/apex is diffed before and
      # after. The safety properties are mutation-tested, not assumed: removing
      # the teardown's symlink guard fails one assertion, removing both guards
      # fails six including "THE CANARY IS GONE".
      #
      # The structural half of the same file runs in `static`, where no path
      # filter can skip it.
      - name: §19 recovery, repair and the scoped factory reset
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          APEX_BIN: ${{ github.workspace }}/apexd/target/debug/apex
        run: |
          set -euo pipefail
          cargo build -p apex --locked --manifest-path apexd/Cargo.toml
          # A missing binary must be a hard failure, not a skip.
          test -x "$APEX_BIN"
          ./tests/test-apex-recover.sh --with-binary

      # §20's trusted devices. A fake `ssh` first on PATH records every argv,
      # which is the only way to assert the things that matter here: that
      # BatchMode=yes is always passed so a dispatch can never block on a
      # password prompt, that StrictHostKeyChecking is never weakened (an
      # ABSENCE assertion — `accept-new` in a background probe would pin an
      # unverified key), and that a remote argument containing a space stays one
      # argument rather than becoming two when ssh hands the string to the
      # remote login shell.
      #
      # It also means the suite reaches no network and no other machine, so it
      # behaves the same here as on a laptop that has left the LAN. The last
      # case compares the developer's real ~/.config/apex/hosts.toml before and
      # after: if `apex host` ever resolved paths from $HOME instead of
      # XDG_CONFIG_HOME, the cost of not catching it is someone's device list.
      # A verb can vanish from the binary without breaking the build. Two
      # agents editing main.rs in parallel silently dropped `mod task;`, which
      # also stopped task.rs being compiled — so there was no orphaned
      # reference, no dead-code warning and no test failure. `apex task` was
      # simply gone. Only asking the built artifact what it can do catches it.
      - name: Every verb is in the binary
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: ./tests/test-apex-verbs.sh

      # tests/check-doc-verbs.sh existed since the `apex request install clang`
      # defect and ran NOWHERE — not in this workflow, not from any suite — so
      # it was a checker somebody had to remember to type. Both directions run
      # here now. Forward: every `apex …` a doc shows parses. Reverse: every
      # command the binary offers is named by some doc, or is declared in
      # tests/doc-verbs-undocumented, which is a debt list that can only
      # shrink. The reverse direction is the one that found `apex remote
      # pair|devices|revoke|status|enable` documented nowhere; the forward one
      # structurally cannot, because a verb no doc mentions produces no line.
      # It asks the binary this job already built, not the installed apex,
      # which on a runner does not exist.
      - name: Docs and the CLI agree, in both directions
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: ./tests/check-doc-verbs.sh

      # A Containerfile assertion is the one test the test suite cannot run,
      # because it only exists inside a build. Five of them on this branch could
      # never pass or never run, and each was found by a `base` job failing at a
      # later step than the last. This resolves them back to the files in this
      # repo that become them and runs them here.
      - name: Containerfile assertions can actually pass
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: ./tests/check-containerfile-assertions.sh

      # APEX builds its own kernel, and kernel/kernel.pin is what decides which
      # one. It exists because the COPR build it replaces takes
      # `BuildRequires: dwarves` unversioned and fetches two of its three
      # sources from `master` URLs -- which is how a kernel that could not load
      # any sched-ext scheduler shipped three times. A pin file rots into
      # decoration quietly (a URL edited back to a branch, a sha left behind
      # when a version moves), and none of that fails a build: it just stops
      # being reproducible. This checks it without a 45-minute kernel compile,
      # and fails in both directions -- an undefined key the build reads, and a
      # pin key nothing reads.
      - name: The kernel pin is actually pinned
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: ./tests/check-kernel-pin.sh

      # The pin above says which kernel to BUILD. This says which built kernel
      # `core` INSTALLS -- one `FROM ${APEX_KERNEL_IMAGE}` line, which has now
      # stopped every image build in the project twice: once defaulting to a
      # localhost image only a machine that hand-built a kernel can have, once
      # declared where the ARG was invisible to its own FROM. Both cost ~45
      # minutes of build to discover and one grep to notice. It also holds the
      # two properties that make the pin worth having: the default is a DIGEST,
      # so core cannot install a kernel other than the one whose BTF was
      # checked, and there is NO fallback to the COPR kernel.
      - name: The kernel core installs is pinned to a digest
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: ./tests/check-kernel-image-pin.sh

      # The build CONTEXT is an input to every image, and .containerignore can
      # remove source from it without failing any COPY. `**/target/` once hid
      # apexd/apex-backup-core/src/target/, a real module, and `base` died on
      # E0583 minutes later naming neither the context nor .containerignore
      # (run 35582968952). Milliseconds, and it reads git rather than building.
      - name: .containerignore does not hide tracked source
        run: ./tests/check-containerignore-keeps-sources.sh

      - name: Run trusted-device assertions
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: ./tests/test-apex-host.sh

      # The editors APEX ships have to be launchable, not merely present. Zed
      # shipped on every image with no desktop entry at all — the install read a
      # filename the tarball has never used and `|| true` swallowed the failure —
      # so the binary worked from a shell and the editor was invisible in every
      # launcher. This runs the structural half here; the live half needs the
      # unpacked zed.app and skips in CI.
      - name: The shipped editors are launchable
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: ./tests/test-apex-editors.sh

      # The desktop AI apps are part of the product, not add-ons: ChatGPT and
      # Claude Desktop ship in the image, arrive with `apex update`, and must
      # bring no updater of their own. Both vendors package for mutable
      # distributions and therefore subscribe the machine to their own
      # repository on install — OpenAI's rpm ships an enabled
      # /etc/yum.repos.d/chatgpt.repo, Anthropic's deb writes an apt source
      # from its maintainer script. On APEX that is a live hazard rather than
      # dead weight, because apex-pkg builds user extensions with dnf against
      # the host's repos. This runs the structural half here; the live half
      # needs the installed apps and skips in CI.
      - name: The desktop AI apps ship with the system and bring no updater
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: ./tests/test-apex-ai-apps.sh

      # QT_QPA_PLATFORMTHEME is not a palette preference. Qt decides
      # layoutDirection by translating the string QT_LAYOUT_DIRECTION, so it
      # needs a Qt translation catalogue loaded — and the only thing in APEX
      # that installs a QTranslator is the qt6ct platform theme plugin, on its
      # way to applying a dark palette. Right-to-left mirroring therefore rests
      # on a theming choice, a labwc environment file, and a package that until
      # now reached the image only as a weak dependency.
      #
      # The step above greps that same variable, but only to LOCATE the
      # /etc/environment line before asserting Electron settings on it. Deleting
      # the variable goes red there for the wrong reason; changing its VALUE was
      # caught by nothing at all. apex-shell's run-rtl-test.sh checks the live
      # value and SKIPs off a booted APEX host, so this repository — the one
      # that can actually break it — had no guard naming the consequence.
      - name: The Qt platform theme that makes the shell mirror is set, to qt6ct
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: ./tests/test-apex-platform-theme.sh

      # §20's remote compute and handoff. The largest group of cases in it is
      # about one refusal: `apex build --on` has to decide which directory on
      # the far side is this project, and the failure mode of a wrong answer is
      # not a crash but a build that SUCCEEDS against the wrong source. So the
      # suite asserts the same-repository check happens, refuses on a mismatch,
      # names both origins in the refusal, and that --remote-path skips it and
      # says so.
      #
      # The fake ssh plays the far side in scenarios — same repo, different
      # repo, no such directory, a machine at its greeter — because those are
      # refusals that need another computer to be in a particular state. The
      # live equivalents were run by hand against the developer's katana, which
      # has this repository at the same absolute path; that proved the design,
      # and this keeps it proved.
      - name: Run remote-compute and handoff assertions
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: ./tests/test-apex-dispatch.sh

      # §14's local inference service, driven as a process.
      #
      # Every invocation in it redirects stdin from /dev/null, and that is
      # load-bearing rather than tidiness: `apex ai run` accepts a piped
      # prompt, so with no arguments and an open stdin it waits for EOF the way
      # `cat` does. Measured while writing the suite — an invocation without the
      # redirection hung for two minutes. A suite that forgets it does not fail,
      # it hangs, and a hung job is worse than a red one because nobody can
      # tell it from a slow one.
      #
      # It points APEX_AI_CATALOGUE at config/ai/catalogue.toml, because the
      # catalogue is image content installed to /usr/share/apexos/ai by the
      # build and does not exist on a checkout — the same coupling
      # test-labwc-keybinds.sh documents for the shell tree. The suite hard
      # exits if the repository copy is missing rather than falling back.
      - name: Run local inference assertions
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: ./tests/test-apex-ai.sh

      # §21's Task. It belongs in this job rather than `engine` because it
      # drives the built `apex` binary, and this is the only job with a Rust
      # toolchain and a warm cargo cache.
      #
      # The binary is built explicitly first and then asserted executable. The
      # suite would build it itself if it were absent, but `target/` here comes
      # out of a restored cache, so "absent" is not the failure mode — a STALE
      # binary from an older commit is, and a suite that passed against one has
      # asserted nothing about this PR.
      #
      # What the suite is really for: a task names a project, a capsule, a
      # worktree and a checkpoint, and every one of them can go away
      # underneath it. Each of those cases greps the specific refusal and the
      # specific recovery command rather than a non-zero exit. It also proves
      # the two properties that are absences: `apex task` reopens no window
      # (the fixture window logs every launch, and the count must stay at one),
      # and it invokes none of sudo, pkexec, secret-tool, podman, distrobox,
      # hyprctl or niri — recording stubs for all seven are first on PATH, with
      # a negative control proving the recorder is armed. That is the "never a
      # polkit or keyring prompt" rule asserted rather than claimed.
      - name: §21 task — binder assertions, refusals and the no-prompt tripwire
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          APEX_BIN: ${{ github.workspace }}/apexd/target/debug/apex
        run: |
          set -euo pipefail
          cargo build -p apex --locked --bin apex --manifest-path apexd/Cargo.toml
          # A missing binary must be a hard failure, not a skip.
          test -x "$APEX_BIN"
          ./tests/test-apex-task.sh

      # ── LAST IN THIS JOB, DELIBERATELY ──────────────────────────────────
      # A failed step skips every step BELOW it in the same job, and this
      # repository has already been bitten by that: a known-red step placed
      # mid-job silently switched off the four suites under it. The chaos run
      # is expected green, but it is also the step most likely to go red for an
      # environmental reason on a runner this repository does not control —
      # a kernel that refuses a namespace turns two cases into could-not-inject
      # and fails the run by design. Nothing else should be disabled by that.
      # P1-062's chaos cases, for real, against the built binary.
      #
      # THIS JOB AND NOT ANOTHER: two of the four cases need an unprivileged
      # user namespace — `network-loss` puts `apex doctor` in a network
      # namespace, `full-disk` mounts a size-limited tmpfs in a mount
      # namespace — and Ubuntu 24.04 ships
      # kernel.apparmor_restrict_unprivileged_userns=1. The bubblewrap step
      # near the top of this job already turns it off. In any other job those
      # two cases report could-not-inject, which fails the run by design and
      # with no opt-out, so there is no version of this that quietly skips.
      #
      # A chaos run is green only when every requested case both INJECTED its
      # fault (proven by an observation the injector did not make) and the
      # subject survived it. could-not-inject fails the run. That is the whole
      # point of the unit and it has no override.
      #
      # The bundles are uploaded on failure AND on success, because criterion 3
      # is "failures produce reproducible diagnostics" and a diagnostic that
      # only exists inside a finished runner is not one. Each bundle carries
      # the seed, the git revision, the binary's own sha256, the environment
      # probe, both the faulted and the no-fault runs, and sha256 snapshots of
      # the fixture tree before and after — enough for
      # `run-chaos --replay <bundle>` on another machine.
      - name: P1-062 chaos — four faults injected, proven, and survived
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        env:
          APEX_BIN: ${{ github.workspace }}/apexd/target/debug/apex
        run: |
          set -euo pipefail
          cargo build -p apex --locked --bin apex --manifest-path apexd/Cargo.toml
          # A missing binary must be a hard failure, not a skip. Without this
          # every case reports could-not-inject for the least interesting
          # possible reason.
          test -x "$APEX_BIN"
          ./tests/chaos/run-chaos --out "$RUNNER_TEMP/chaos" --seed "$GITHUB_RUN_ID"

      # The comment above says "a diagnostic that only exists inside a finished
      # runner is not one". That was the exact state this step was in: it has
      # never uploaded a byte, and it failed the whole `rust` job every run.
      #
      # upload-artifact@v4 refuses any path containing a colon (NTFS), and a
      # chaos bundle snapshots a fixture sysfs tree whose PCI addresses are
      # `0000:03:00.0` by construction — tests/chaos/lib.sh writes
      # `sys/bus/pci/devices/0000:03:00.0/class`. So the upload aborted on the
      # fixture it exists to preserve:
      #   "The path for one of the files in artifact is not valid:
      #    /failed-rollback/root/sys/bus/pci/devices/0000:03:00.0/class"
      #
      # A tar has no such restriction, so the bundles go up WHOLE. Excluding
      # the sysfs tree would also make the upload succeed, and would throw away
      # the fixture `run-chaos --replay` needs — a green tick for a diagnostic
      # that no longer diagnoses, which is the failure mode this file is full
      # of scar tissue about.
      - name: Pack the chaos bundles
        if: always()
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/chaos" ]; then
            echo "no chaos directory at $RUNNER_TEMP/chaos — nothing to pack"
            exit 0
          fi
          tar -czf "$RUNNER_TEMP/chaos-bundles.tar.gz" -C "$RUNNER_TEMP" chaos
          # An archive nobody looked inside is the same mistake one layer down.
          # Assert it round-trips, name the colon path specifically, and refuse
          # an archive that unpacks to nothing.
          #
          # Materialise the listing rather than piping it. `tar -tzf … | grep -q`
          # makes grep exit at its FIRST match; tar then dies of SIGPIPE, and
          # under `pipefail` the pipeline reports failure — so the guard fails
          # exactly WHEN the path is present, and passes when it is absent and
          # grep has to read to the end. Run 34796578198 is that inversion: the
          # step printed "the fixture sysfs tree is not in the archive" over an
          # archive holding it, one line after "194 paths packed".
          tar -tzf "$RUNNER_TEMP/chaos-bundles.tar.gz" > "$RUNNER_TEMP/chaos-listing.txt"
          n=$(wc -l < "$RUNNER_TEMP/chaos-listing.txt")
          echo "$n paths packed"
          [ "$n" -gt 1 ] || { echo "FATAL: the chaos archive is empty" >&2; exit 1; }
          grep -q '0000:03:00\.0' "$RUNNER_TEMP/chaos-listing.txt" || {
            echo "FATAL: the fixture sysfs tree is not in the archive — the" >&2
            echo "       bundle cannot be replayed from it" >&2
            exit 1
          }

      - name: Chaos diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-bundles
          path: ${{ runner.temp }}/chaos-bundles.tar.gz
          if-no-files-found: warn
          retention-days: 14

  installer:
    name: Installer safety and UI
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This is intentionally the complete suite when installer code changes:
      # pre-write guards plus measured renders of every GUI page at both minimum
      # panel sizes. Its container setup is too expensive for unrelated PRs.
      - name: Run installer safety suite
        working-directory: installer
        run: ./test-installer.sh

      # The keyboard/locale/timezone half. Kept as its own step so a failure
      # names which half broke rather than being buried in the big suite.
      #
      # Both degrade honestly on this runner rather than lying: the engine cases
      # SKIP when no APEX-OS image can be put where preflight looks, and the
      # end-to-end keymap measurement SKIPs without Xvfb, cage and python3-gi.
      # Installing them here is what makes the criterion actually measured in CI
      # instead of skipped on every run.
      - name: Install the compositor and X server the keymap suite measures with
        run: |
          sudo apt-get update -qq
          # One package at a time. `apt-get install a b c` aborts the WHOLE
          # command if any single name is unavailable, so one bad name would
          # silently cost Xvfb as well — and the suite would then SKIP the
          # assertion that carries the criterion while the step still reported
          # success.
          # xdotool, at-spi2-core, dbus-x11 and libglib2.0-bin are the
          # accessibility audit's half: real X key events into the real toolkit,
          # a private accessibility bus, and gdbus to read the tree back. Without
          # them test-installer-a11y.sh SKIPs, and a skip there means the
          # criterion is unmeasured rather than met.
          for p in xvfb cage python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
                   libxkbcommon0 xkb-data binutils \
                   xdotool at-spi2-core dbus-x11 libglib2.0-bin; do
            sudo apt-get install -y -qq "$p" || echo "note: $p unavailable"
          done
          # Say what actually arrived, so a SKIP below can be traced without
          # guessing.
          for b in Xvfb cage; do
            command -v "$b" >/dev/null && echo "have: $b" || echo "MISSING: $b"
          done
          python3 -c 'import gi; gi.require_version("Gtk","4.0"); gi.require_version("Adw","1"); from gi.repository import Gtk, Adw; print("have: python3-gi with Gtk4 + Adw")' \
            || echo "MISSING: python3-gi Gtk4/Adw"

      - name: Run installer locale/timezone suite
        working-directory: installer
        run: ./test-installer-locale.sh

      - name: Run installer keyboard suite
        working-directory: installer
        run: ./test-installer-keymap.sh

      # L-002's encryption path. This is the FAST half — every refusal, the
      # XKB-to-console keymap conversion, and the character-level check that
      # says a German keyboard's `z` really is a `z` at the unlock prompt. It
      # touches no block device beyond a loopback file it makes itself, and the
      # dry-run cases assert that even that comes back untouched.
      #
      # The other half — a REAL `bootc install` onto a REAL LUKS2 volume —
      # is installer/test-installer-luks-live.sh and needs root, a loop device
      # and the 15 GB image, so it is recorded in tests/suites-not-in-ci.txt
      # with that reason rather than pretending a runner could run it.
      - name: Run installer disk-encryption suite
        working-directory: installer
        run: ./test-installer-luks.sh

      # P2-003's acceptance line ends "keyboard-only installer validated", and
      # this is the step that validates it. Not a sweep for missing labels: the
      # shipped GUI runs on a private Xvfb, xdotool delivers real X key events
      # into the real GTK4 toolkit, and the resulting focus and names are read
      # back over AT-SPI -- the protocol Orca speaks. It is what found TEN
      # focusable fields whose only label was a placeholder GTK never maps to an
      # accessible name.
      #
      # Second machine, not this laptop, is the point of running it here: the
      # last round's CI dispatch is what found the Etc/UTC engine gap that a
      # laptop in Perth could not see.
      - name: Run installer accessibility audit
        working-directory: installer
        run: ./test-installer-a11y.sh

  engine:
    name: Package engine
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs the shipped /usr/libexec/apex-pkg itself: argument classification,
      # the local-.rpm validation refusals, the package-name guard that keeps an
      # untrusted RPM header out of a root-owned path, the cache identifiers a
      # rebuild depends on, and the unsigned-package policy. No root, no network,
      # nothing built or merged — every case is reached before the engine's root
      # gate or is a pure function. Cases needing `rpm` skip out loud here and
      # run for real in the image smoke test in build-image.yml.
      - name: Run package-engine assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-pkg.sh

      # The per-login provisioner edits files that belong to the user. These
      # extract its self-healing blocks from the shipped script and run them
      # against throwaway HOMEs, asserting the repairs happen once and nothing
      # the user wrote is touched.
      - name: Run user-provisioner assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-firstrun.sh

      - name: Run input-settings assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-input.sh

      # §8's capsule engine. `apex env create` pulls hundreds of megabytes and
      # makes a container, so it can never run for real here — and it must
      # never run for real on a developer's machine during a test either. The
      # suite reduces $PATH to recording stubs for podman and distrobox and
      # HARD-EXITS if `command -v distrobox` does not resolve to the stub, so
      # the failure mode is a refusal rather than containers appearing on
      # somebody's desktop. There are no skips: the stubs are always there, so
      # a runner with no podman gets the same 149 assertions as one with it.
      #
      # What that buys is coverage of the parts that cannot be checked live:
      # the exact distrobox argv per device profile (NVIDIA driver
      # passthrough, ROCm's /dev/kfd and render group), and the rootless
      # preflight that refuses root and a missing subuid range BEFORE an image
      # is downloaded.
      - name: Run capsule assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-env.sh

      # P2-008's virtualization engine. Same trade as the capsule suite above
      # and for a sharper reason: `apex vm create` defines a libvirt domain and
      # `apex vm rm` deletes disk images, so it can never run for real here and
      # must never run for real on a developer's machine during a test. $PATH
      # is reduced to recording stubs for virsh, qemu-img, mcopy and friends,
      # and the suite HARD-EXITS if `command -v virsh` does not resolve to the
      # stub.
      #
      # What that buys is the domain XML, which is where five of P2-008's six
      # flows actually live — and in particular the three elements that look
      # optional and are not: <smm state='on'/>, the memfd/shared memory
      # backing virtiofs cannot start without, and an xHCI controller with
      # ports. Dropping any one produces a domain that DEFINES and then refuses
      # to START, which no live run on a KVM-less runner could ever catch.
      #
      # The live half — real guests booted through this engine against a real
      # virtqemud — is tests/vmlab/run-vmlab. It cannot verify anything here:
      # these runners have no /dev/kvm. The step below runs it anyway, and
      # that is the point.
      - name: Run virtualization assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-vm.sh

      # ── the could-not-run arm, EXERCISED rather than asserted by comment ───
      #
      # A lab whose third verdict arm is broken does not announce itself: it
      # reports "all six flows work" from a machine that booted no guest, which
      # is this repository's "permission denied is not absence" defect with a
      # reliability claim on top. The arm only ever fires where there is no
      # KVM — which is exactly here — so here is where it has to be checked.
      #
      # The assertion does NOT require the runner to lack KVM, and that is the
      # correction rather than a relaxation: GitHub's ubuntu images expose a
      # /dev/kvm node that is root:kvm 0660 and unusable by the job — present
      # and not usable, the exact distinction the lab's own `-r -w` check makes
      # and that a `[ -e /dev/kvm ]` guard would get wrong. So the rule here is
      # the one that holds on every runner: a flow that could not run must say
      # why, and no flow may come back `failed`. A runner that CAN boot guests
      # verifies them instead, which is also a pass.
      #
      # tests/test-apex-vm.sh drives both could-not-run branches directly (the
      # --no-kvm flag and an unusable KVM node), so the arm is proven there on
      # every runner. This step is the end-to-end shape: the lab, invoked the
      # way a person invokes it, writing a bundle.
      - name: P2-008 the vmlab, and its verdicts wherever this runs
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ./tests/vmlab/run-vmlab --out "$RUNNER_TEMP/vmlab"
          bad=0
          for f in $(./tests/vmlab/run-vmlab --list); do
            v="$RUNNER_TEMP/vmlab/$f/verdict.json"
            if [ ! -f "$v" ]; then echo "no verdict for $f"; bad=1; continue; fi
            state=$(sed -n 's/.*"state": "\([^"]*\)".*/\1/p' "$v")
            reason=$(sed -n 's/.*"reason": "\([^"]*\)".*/\1/p' "$v")
            echo "$f: $state — $reason"
            case "$state" in
              failed) echo "  ^ a flow FAILED"; bad=1 ;;
              could-not-run|verified) ;;
              *) echo "  ^ unknown verdict state"; bad=1 ;;
            esac
            if [ -z "$reason" ]; then echo "  ^ no reason given"; bad=1; fi
          done
          exit $bad

      - name: Keep the vmlab bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmlab-bundles
          path: ${{ runner.temp }}/vmlab
          if-no-files-found: ignore

      # ── P2-012's browser capsule ──────────────────────────────────────────
      #
      # The everywhere half. A recording stub for `apex` on $APEX_BROWSER_APEX,
      # and assertions on the two argvs and the one file that decide anything:
      # the SESSION argv, where the confinement is asked for (a dropped word
      # there is a capsule whose home is not masked or whose network is not
      # filtered, reported as neither, and it is not a compile error); the
      # BROWSER argv, for --headless, --no-remote and the capsule's own
      # --profile; and user.js, which is the only thing pointing Firefox at the
      # egress bridge because Firefox does not read $HTTP_PROXY.
      - name: Run browser capsule assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-browser.sh

      # ── and its live lab, wherever this runs ──────────────────────────────
      #
      # tests/browserlab/run-browserlab boots real capsules through the shipped
      # engine against a real apex-agentd, a real bwrap namespace and a real
      # browser. On a runner it will almost always report could-not-run, and
      # that is the point rather than a shortfall: it needs a runtime built
      # from THIS branch, and session.rs::bridge_program refuses a bridge under
      # /tmp or $HOME — a checkout on a runner is under $HOME, so the lab says
      # so and names it.
      #
      # The rule enforced here is the vmlab's and not "it passed": a flow that
      # could not run must say WHY, and no flow may come back `failed`. A
      # runner that can run them verifies them instead, which is also a pass.
      - name: P2-012 the browserlab, and its verdicts wherever this runs
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ./tests/browserlab/run-browserlab --out "$RUNNER_TEMP/browserlab"
          bad=0
          for f in $(./tests/browserlab/run-browserlab --list); do
            v="$RUNNER_TEMP/browserlab/$f/verdict.json"
            if [ ! -f "$v" ]; then echo "no verdict for $f"; bad=1; continue; fi
            state=$(sed -n 's/.*"state": "\([^"]*\)".*/\1/p' "$v")
            reason=$(sed -n 's/.*"reason": "\([^"]*\)".*/\1/p' "$v")
            echo "$f: $state — $reason"
            case "$state" in
              failed) echo "  ^ a flow FAILED"; bad=1 ;;
              could-not-run|verified) ;;
              *) echo "  ^ unknown verdict state"; bad=1 ;;
            esac
            if [ -z "$reason" ]; then echo "  ^ no reason given"; bad=1; fi
          done
          exit $bad

      - name: Keep the browserlab bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserlab-bundles
          path: ${{ runner.temp }}/browserlab
          if-no-files-found: ignore

      # The half the suite above deliberately cannot answer. Its device-profile
      # coverage is argv-PINNED — it proves the engine emits the flags its
      # author intended, with a stubbed container manager. It cannot prove
      # those flags reach a device, which is the entire purpose of the `amd`
      # and `hw` profiles, and §BASE-005 carried that as its outstanding
      # qualification.
      #
      # This suite asks the shipped engine what a profile adds (it sources
      # apex-env and calls gpu_flags, so a change to a profile changes the
      # test) and hands exactly those flags to real rootless podman on an
      # image that is ALREADY local, then reads back what is reachable inside.
      # It never calls `apex env create`, never pulls, and every container is
      # --rm.
      #
      # On this runner there is no AMD device and probably no podman, so the
      # hardware half skips with status 0 — the same trade test-apex-hypr-lua
      # and test-apex-input-live already make. The profile-SHAPE assertions run
      # everywhere and fail rather than skip if gpu_flags stops emitting
      # `--additional-flags` plus one argument, which is the way this file
      # could otherwise have gone quietly vacuous.
      - name: Run capsule device-profile assertions (live where the hardware is)
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-env-devices-live.sh

      # What the login session picker calls the three desktops. BASE-013's
      # third criterion — compositor names stay implementation details for
      # normal users — failed on the one surface every user sees at every
      # login: the greeter rendered `Name=` verbatim, so the carousel read
      # "labwc (APEX) / niri / Hyprland".
      #
      # This runs here rather than only in an image build because two of the
      # three things it checks are build rules: Containerfile.base's rename of
      # the Hyprland package's own entry, and Containerfile.apex's sweep over
      # the finished directory. Both are LIFTED OUT of the Containerfiles and
      # run against a staging tree, so the gate that normally costs a
      # multi-hour image build is exercised on every PR in under a second, and
      # the greeter's enumeration is lifted out of GreetContext.qml and run
      # rather than re-implemented — this tree already carries three copies of
      # that loop. It starts no compositor and opens no window.
      - name: Run session-picker wording assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-greet-sessions.sh

      # P2-018's first criterion, and the half that did not exist until now:
      # APEX Safe Graphics shipped as a session a PERSON enters, and NOTHING
      # noticed a failure. greetd is a stock Fedora unit with no Restart=, no
      # StartLimitBurst and no OnFailure=, and apex-boot-health's units are
      # inert on every published image because they condition on
      # LoaderBootCountPath while every APEX image boots GRUB.
      #
      # It runs beside the session-picker suite because it needs exactly what
      # that one needs — python3 and the shipped GreetContext.qml — and because
      # it lifts BOTH greeter hooks out of that same file and runs them. It
      # starts no compositor, no greeter and no session, opens no window, and
      # touches no real /var/lib/apex-greet.
      #
      # THE FLOOR IS NOT DECORATION HERE. This suite's most important
      # assertions are the three fail-open mutations — the helper replaced by
      # `sleep 60`, then deleted, then run with timeout(1) off PATH — and each
      # requires the greeter's launch hook to return 0 anyway. A suite that
      # stopped finding its input would assert none of that and exit 0, and the
      # change it guards is the one that can leave somebody at a password
      # prompt that never proceeds.
      #
      # `skipped` must be 0 for the same reason it must be in the firewall step
      # below: a could-not-run is not a pass. That is not hypothetical for this
      # suite — its unwritable-state-directory section USED to skip on exactly
      # this runner, because CI is root and chmod 0555 does not stop root. It
      # was rewritten to make the directory uncreatable by shape instead, and
      # this line is what stops that regressing quietly.
      #
      # §5 also skips its nine assertions without node(1), which is the other
      # way this suite could go quiet. A GitHub runner always has node — the
      # actions themselves need it — so a skip there means the runner image
      # changed under us, and that is worth failing over rather than passing
      # with the preselection rule unexecuted.
      - name: Run session-watchdog assertions
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          out="$(./tests/test-apex-session-watchdog.sh 2>&1)"
          printf '%s\n' "$out"
          summary="$(printf '%s' "$out" | grep -E '^session-watchdog: ' || true)"
          [ -n "$summary" ] || { echo "::error::the session-watchdog suite printed no summary line"; exit 1; }
          read -r passed _ failed _ skipped _ <<<"$(printf '%s' "$summary" | sed 's/^session-watchdog: //')"
          echo "measured: passed=$passed failed=$failed skipped=$skipped"
          [ "$failed" = 0 ] || { echo "::error::$failed session-watchdog assertions failed"; exit 1; }
          [ "$skipped" = 0 ] || {
              echo "::error::$skipped session-watchdog assertions could not run ($summary); a could-not-run is not a pass"
              exit 1
          }
          [ "$passed" -ge 91 ] || {
              echo "::error::only $passed session-watchdog assertions ran; 91 ran as both uid 0 and uid 1000 on 2026-09-13, so some no longer execute"
              exit 1
          }

      # P2-016's guest and kiosk halves. Two claims, tested two ways.
      #
      # Criterion 3 -- "kiosk/shared-device policy is possible WITHOUT
      # weakening ordinary desktop use" -- is an assertion about an ABSENCE:
      # the shipped greetd config must carry no auto-login stanza, or APEX
      # would have stopped asking who you are and would still boot. The suite
      # also feeds the same check a config that HAS one, because an absence
      # assertion that never sees a presence cannot fail.
      #
      # Criterion 2 runs the real /usr/libexec/apex-guest-wipe against a
      # fixture passwd, a fixture secretd store and a fixture greeter state
      # dir, as an ordinary user. It creates no account and touches nothing
      # outside its temp directory -- and asserts that redirection worked
      # before it asserts anything about wiping. It starts no compositor and
      # opens no window.
      - name: Run shared-machine (guest, kiosk) assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-shared-machine.sh

      # P2-016 criterion 1. One assertion carries it: `apex user add` without
      # --admin must not put the account in wheel, because wheel is what
      # polkit's auth_admin and sudo both resolve to on APEX. A dropped
      # condition there is not a compile error and not a visible failure -- it
      # is every account APEX creates able to approve a root operation, which
      # is the state installer/apex-install is in today.
      #
      # It runs the real /usr/libexec/apex-user against a fixture passwd and
      # group file, with every privileged tool (useradd, userdel, gpasswd,
      # systemctl) replaced by a stub that records its argv. So the decisions
      # go through the production path while no account is created, removed or
      # changed, and nothing is written outside its temp directory.
      - name: Run account (standard vs administrator) assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-user.sh

      # What a screen reader and a keyboard-only user get from the login
      # screen. P2-003's "accessible login" and P2-004's "keyboard layout
      # before password" both land on the same surface, so they are measured
      # on the same one.
      #
      # This is NOT a grep for Accessible.name. The shipped GreetSurface.qml is
      # built under qmltestrunner on the offscreen platform, the accessible
      # name and role are READ OFF THE LIVE OBJECTS — the same attached objects
      # QAccessible publishes to AT-SPI — and the focus order is measured by
      # posting real Qt.Key_Tab events through the window's delivery agent. The
      # difference is not academic: `KeyNavigation.tab: passwordInput` reads
      # like a complete tab chain and was in fact a two-element ring that could
      # not reach the session picker at all.
      #
      # It opens no window and starts no compositor; WAYLAND_DISPLAY is removed
      # from the environment before the runner is invoked. It skips with
      # status 0 where qmltestrunner is not installed.
      # ubuntu-24.04 ships Qt 6.4, and the greeter imports QtQuick.Effects for
      # its wallpaper blur — MultiEffect is Qt 6.5 and later. So this suite can
      # never run on the runner itself: apt has no qml6-module-qtquick-effects
      # to install, the surface would fail to build, and the suite would skip on
      # every PR for ever. A skip nobody notices is how a suite goes quietly
      # vacuous, which is the failure this whole unit exists to measure.
      #
      # So it runs in a Fedora container, which is what APEX is built from
      # anyway — the Qt the greeter actually ships against rather than the one
      # the runner happens to carry. Verified by running it: 22 assertions, same
      # result as on a Fedora workstation.
      #
      # A container that cannot be pulled or a dnf that cannot resolve leaves
      # the suite unrun and says so, rather than reddening the job over a
      # network hiccup — the same trade the labwc step above makes.
      # ── the four accessibility steps run even after an earlier failure ────
      # Not `continue-on-error`: these steps still fail the job. `!cancelled()`
      # only stops an UNRELATED red step earlier in this job from hiding them.
      #
      # That is not hypothetical. `Run virtualization assertions` is red on
      # roadmap/v2.2 itself, a hundred lines above these, and GitHub stops a job
      # at its first failing step — so on 2026-09-12 all four accessibility
      # suites silently stopped running in CI while reporting nothing at all.
      # A job that halts at step N is evidence about steps 1..N and about
      # nothing after it, and a unit whose whole argument is "a second machine
      # finds what a laptop cannot" cannot afford to lose the second machine to
      # somebody else's red step.
      - name: Run greeter accessibility assertions
        if: ${{ !cancelled() }}
        run: |
          if ! docker run --rm -v "$PWD":/w -w /w fedora:43 bash -c '
                dnf -y install --setopt=install_weak_deps=False \
                    qt6-qtdeclarative-devel >/dev/null 2>&1 || exit 97
                ./tests/test-apex-greet-a11y.sh'; then
              rc=$?
              if [ "$rc" -eq 97 ]; then
                  echo "could not install Qt in the container; the greeter a11y suite did not run"
              else
                  exit "$rc"
              fi
          fi

      # The AT-SPI walk: the greeter in a real window on a private wlroots
      # compositor, read back over D-Bus exactly as Orca reads it. This was the
      # last accessibility suite in this unit verified on ONE laptop, and the
      # round-18b dispatch is the argument for not leaving it there — CI found
      # two false greens in the installer audit that a laptop could not.
      #
      # Same Fedora container as the step above, for the same reason (the
      # greeter imports QtQuick.Effects, which is Qt 6.5+, and the runner ships
      # 6.4), plus four things that step does not need:
      #
      #   labwc                     a wlroots compositor. The suite refuses the
      #                             offscreen QPA deliberately: offscreen
      #                             provides no platform accessibility, so the
      #                             bridge publishes nothing and every assertion
      #                             would read an empty tree and have to be
      #                             written to expect one.
      #   xorg-x11-server-Xwayland  labwc exits at startup without it ("cannot
      #                             create xwayland server"). Nothing in the
      #                             suite is an X client; labwc simply will not
      #                             start.
      #   mesa-dri-drivers          llvmpipe. Without it the Qt client cannot
      #                             make an EGL context in a container with no
      #                             /dev/dri, and it fails in the most confusing
      #                             possible way: the process stays alive, its
      #                             stderr is empty, and it registers nothing.
      #   at-spi2-core, python3-gobject, dbus-daemon, glib2
      #                             the bus, the registry, and the walker.
      #
      # Verified by running it in this exact container before it was written
      # here, not dispatched blind: 31 passed, 0 failed, identical to the
      # laptop's 31. That run is also what corrected tests/lib/atspi.sh — see
      # its "the flag a screen reader sets" note. On a bare container
      # org.a11y.Status starts FALSE, Qt publishes nothing, and the suite reads
      # as "the greeter has no accessibility tree"; on a developer machine the
      # flags are already true, which is why the old finding said Qt ignored
      # them.
      #
      # exit 97 = the container could not resolve its packages: reported as
      # "did not run" rather than reddening the job, the same trade the greeter
      # a11y step makes.
      - name: Run greeter AT-SPI assertions
        if: ${{ !cancelled() }}
        run: |
          if ! docker run --rm -v "$PWD":/w -w /w fedora:43 bash -c '
                dnf -y install --setopt=install_weak_deps=False \
                    qt6-qtdeclarative-devel qt6-qtwayland labwc \
                    xorg-x11-server-Xwayland mesa-dri-drivers \
                    at-spi2-core python3-gobject dbus-daemon glib2 \
                    >/dev/null 2>&1 || exit 97
                ./tests/test-apex-greet-atspi.sh'; then
              rc=$?
              if [ "$rc" -eq 97 ]; then
                  echo "could not install the accessibility stack in the container; the AT-SPI walk did not run"
              else
                  exit "$rc"
              fi
          fi

      - name: Run greeter keyboard-layout assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-greet-layout.sh

      # The other half of the same finding, and the more important one: the
      # greeter's markup is right and a screen reader still receives nothing,
      # because the greet session has no D-Bus session bus for Qt's
      # accessibility bridge to publish on. greetd's own command string is
      # parsed out of the shipped TOML and RUN, with the compositor and
      # quickshell replaced by stubs on a private PATH.
      #
      # It asserts ABSENCE, so it goes RED when somebody fixes the greeter --
      # which is the intended behaviour, and its failure messages say so.
      #
      # dbus-daemon and gdbus are what it needs; without them it SKIPs and says
      # nothing was measured.
      - name: Install the bus tools the greeter session-bus suite measures with
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -qq
          for p in dbus dbus-x11 libglib2.0-bin at-spi2-core; do
            sudo apt-get install -y -qq "$p" || echo "note: $p unavailable"
          done
          for b in dbus-daemon dbus-run-session gdbus; do
            command -v "$b" >/dev/null && echo "have: $b" || echo "MISSING: $b"
          done
          # at-spi2-core is what the wrapper execs. Without it the two
          # accessibility-bus assertions SKIP with a reason rather than being
          # measured, which is a runner that says nothing about the half of the
          # change that matters most.
          # `|| true` is load-bearing, not decoration: this step runs under
          # `bash -e`, a for-loop exits with its last command's status, and a
          # final `[ -x ]` that is false therefore FAILED THE WHOLE STEP on the
          # first dispatch — while the packages it was reporting on had
          # installed perfectly.
          for f in /usr/libexec/at-spi-bus-launcher /usr/lib/at-spi2-core/at-spi-bus-launcher; do
            [ -x "$f" ] && echo "have: $f" || true
          done
          true

      - name: Run greeter session-bus assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-greet-session-bus.sh

      # The image ships a screen reader, and nothing starts it. Reads
      # Containerfile.core by parsing its dnf5 invocations rather than grepping
      # for the word -- "orca" is in that stanza's prose as well as its install
      # line. The rpmdb section SKIPs on a runner, which has no ostree
      # deployment to ask; the two sections that gate the change do run.
      - name: Run accessibility-stack assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-a11y-stack.sh

      # §9's resolver, which is the same engine as the package suite above and
      # a separate file because it is a separate claim: that engine INSTALLS,
      # this one CHOOSES. A choice is a policy, and the policy is invisible
      # until someone reads the source.
      #
      # `dnf5` and `flatpak` are faked from fixture files — again with a hard
      # exit if they do not resolve to the fakes, so the failure mode is a
      # refusal rather than a run that queries Fedora's mirrors and the
      # developer's own Flatpak remotes. That makes the ranking testable at
      # all: both "this exists" and "this does not" are reachable.
      #
      # The load-bearing assertion is that an exact-name repository package
      # still wins, because `apex install <name>` already ships and a silent
      # re-route would be a behaviour change on a shipped command. The one
      # exception is the curated table, and the suite checks that it explains
      # itself and stays overridable with --source.
      - name: Run resolver assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-resolve.sh

      # The display engine is the one generator that can reach hardware, so its
      # suite asserts that it does not: fake hyprctl/wlr-randr first on PATH
      # record every call, and the run fails if a MUTATING one appears. There is
      # no compositor on the runner, but the guard is set anyway — the bug it
      # exists for was a test that reconfigured the live desktop it ran on, and
      # a developer running this locally is exactly that situation.
      - name: Run display-settings assertions
        if: ${{ !cancelled() }}
        env:
          APEX_DISPLAY_NO_LIVE: "1"
        run: ./tests/test-apex-display.sh

      # The seeded Hyprland Lua tree in a REAL Hyprland, not just through
      # --verify-config. Three things only a running instance can answer:
      # `hyprctl configerrors` is clean; `hyprctl reload` re-reads a generated
      # module rewritten under it (Lua caches modules, and a loader that did not
      # clear the cache would make every saved display layout a no-op); and
      # `hyprctl keyword` is refused under a Lua config, which is why the live
      # paths use `hyprctl eval`.
      #
      # Nests Hyprland inside a HEADLESS labwc, so it draws nothing and cannot
      # reach a developer's real session. Skips with status 0 where neither
      # binary is installed, which is what the runner will normally do — the
      # value is on a machine that has them.
      - name: Run the Hyprland Lua config assertions
        if: ${{ !cancelled() }}
        run: |
          # Run BARE, this step used to go green whatever the suite did — and on
          # ubuntu-24.04 what it does is print `0 passed, 0 failed, 1 skipped`
          # and exit 0, because labwc is not installed and there is no nested
          # compositor to drive. A green check over nothing, with the reason
          # visible only to someone who opened the log and read it. Both halves
          # are fixed here: the skip is SAID, in the run summary, and the
          # count is floored so the suite silently dropping assertions on a
          # machine that CAN run it is an error rather than a smaller number
          # nobody compares.
          set -uo pipefail
          rc=0; out="$(./tests/test-apex-hypr-lua.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 0 ] || { echo "::error::test-apex-hypr-lua.sh exited $rc"; exit 1; }
          summary="$(printf '%s\n' "$out" | grep -E '^apex hypr-lua: [0-9]+ passed, [0-9]+ failed, [0-9]+ skipped$' || true)"
          [ -n "$summary" ] || { echo "::error::test-apex-hypr-lua.sh printed no summary line; nothing below can be believed"; exit 1; }
          [ "$(printf '%s\n' "$summary" | wc -l)" = 1 ] || { echo "::error::more than one line looked like test-apex-hypr-lua.sh's summary"; exit 1; }
          passed="$(printf '%s' "$summary" | awk '{print $3}')"
          failed="$(printf '%s' "$summary" | awk '{print $5}')"
          skipped="$(printf '%s' "$summary" | awk '{print $7}')"
          echo "measured: passed=$passed failed=$failed skipped=$skipped"
          [ "$failed" = 0 ] || { echo "::error::$failed apex hypr-lua assertions failed"; exit 1; }
          if [ "$passed" -eq 0 ]; then
              [ "$skipped" -gt 0 ] || { echo "::error::test-apex-hypr-lua.sh asserted nothing and did not say why"; exit 1; }
              echo "::warning::test-apex-hypr-lua.sh asserted NOTHING on this runner ($skipped skipped) — it needs a nested labwc and ubuntu-24.04 has none, so this step is a could-not-run, not a pass. Its 22 assertions only ever run on a machine with the compositors installed."
          else
              [ "$passed" -ge 22 ] || { echo "::error::only $passed apex hypr-lua assertions ran; 22 ran on 2026-09-18, so some no longer execute"; exit 1; }
          fi

      # What SUPER+arrow actually DOES, which no config grep can answer. The
      # seeded session focus-follows-mouse, so a keyboard focus change that
      # leaves the pointer behind is undone by the next twitch of the mouse —
      # the defect Andre reported. The suite measures the pointer's position
      # after a directional focus, and runs the whole thing a second time with
      # `no_warps = true` where those assertions MUST fail. A gate that agrees
      # with whatever the configuration says is the dominant defect family in
      # this tree; the control is what stops this being one.
      #
      # Same nesting as the step above, same reason it usually skips here.
      - name: Run the Hyprland focus + switcher assertions
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          rc=0; out="$(./tests/test-apex-hypr-focus.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 0 ] || { echo "::error::test-apex-hypr-focus.sh exited $rc"; exit 1; }
          summary="$(printf '%s\n' "$out" | grep -E '^apex hypr-focus: [0-9]+ passed, [0-9]+ failed, [0-9]+ skipped$' || true)"
          [ -n "$summary" ] || { echo "::error::test-apex-hypr-focus.sh printed no summary line; nothing below can be believed"; exit 1; }
          [ "$(printf '%s\n' "$summary" | wc -l)" = 1 ] || { echo "::error::more than one line looked like test-apex-hypr-focus.sh's summary"; exit 1; }
          passed="$(printf '%s' "$summary" | awk '{print $3}')"
          failed="$(printf '%s' "$summary" | awk '{print $5}')"
          skipped="$(printf '%s' "$summary" | awk '{print $7}')"
          echo "measured: passed=$passed failed=$failed skipped=$skipped"
          [ "$failed" = 0 ] || { echo "::error::$failed apex hypr-focus assertions failed"; exit 1; }
          if [ "$passed" -eq 0 ]; then
              [ "$skipped" -gt 0 ] || { echo "::error::test-apex-hypr-focus.sh asserted nothing and did not say why"; exit 1; }
              echo "::warning::test-apex-hypr-focus.sh asserted NOTHING on this runner ($skipped skipped) — it needs a nested labwc + Hyprland + quickshell and ubuntu-24.04 has none, so this step is a could-not-run, not a pass. Its 17 assertions only ever run on a machine with the compositors installed."
          else
              [ "$passed" -ge 19 ] || { echo "::error::only $passed apex hypr-focus assertions ran; 19 ran on 2026-09-20, so some no longer execute"; exit 1; }
          fi

      # The input half of the same argument. test-apex-input.sh proves each
      # compositor's validator ACCEPTS what is generated; only a running
      # instance proves the value arrives, that `hyprctl reload` re-reads a
      # module rewritten under it, and that every option name the read-back
      # asks for still exists — `getoption` answers "no such option" for a name
      # it does not know, and a read-back treating that as "unset" would show a
      # working control as untouched forever.
      #
      # Same nesting, so it draws nothing and cannot reach a real session, and
      # the same status-0 skip where the binaries are absent.
      - name: Run the live input-settings assertions
        if: ${{ !cancelled() }}
        run: |
          # Run BARE, this step used to go green whatever the suite did — and on
          # ubuntu-24.04 what it does is print `0 passed, 0 failed, 1 skipped`
          # and exit 0, because labwc is not installed and there is no nested
          # compositor to drive. A green check over nothing, with the reason
          # visible only to someone who opened the log and read it. Both halves
          # are fixed here: the skip is SAID, in the run summary, and the
          # count is floored so the suite silently dropping assertions on a
          # machine that CAN run it is an error rather than a smaller number
          # nobody compares.
          set -uo pipefail
          rc=0; out="$(./tests/test-apex-input-live.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 0 ] || { echo "::error::test-apex-input-live.sh exited $rc"; exit 1; }
          summary="$(printf '%s\n' "$out" | grep -E '^apex input-live: [0-9]+ passed, [0-9]+ failed, [0-9]+ skipped$' || true)"
          [ -n "$summary" ] || { echo "::error::test-apex-input-live.sh printed no summary line; nothing below can be believed"; exit 1; }
          [ "$(printf '%s\n' "$summary" | wc -l)" = 1 ] || { echo "::error::more than one line looked like test-apex-input-live.sh's summary"; exit 1; }
          passed="$(printf '%s' "$summary" | awk '{print $3}')"
          failed="$(printf '%s' "$summary" | awk '{print $5}')"
          skipped="$(printf '%s' "$summary" | awk '{print $7}')"
          echo "measured: passed=$passed failed=$failed skipped=$skipped"
          [ "$failed" = 0 ] || { echo "::error::$failed apex input-live assertions failed"; exit 1; }
          if [ "$passed" -eq 0 ]; then
              [ "$skipped" -gt 0 ] || { echo "::error::test-apex-input-live.sh asserted nothing and did not say why"; exit 1; }
              echo "::warning::test-apex-input-live.sh asserted NOTHING on this runner ($skipped skipped) — it needs a nested labwc and ubuntu-24.04 has none, so this step is a could-not-run, not a pass. Its 22 assertions only ever run on a machine with the compositors installed."
          else
              [ "$passed" -ge 22 ] || { echo "::error::only $passed apex input-live assertions ran; 22 ran on 2026-09-18, so some no longer execute"; exit 1; }
          fi

      # §17's fourth generator. The shell has written Hyprland .conf/.lua and
      # niri .kdl on every keybind edit for a long time; labwc got nothing,
      # because it has no IPC to push bindings over and no include mechanism to
      # append a generated file to. So on labwc the Keybinds page was fully
      # interactive and completely inert.
      #
      # The suite splices into fixture files only — it must never touch a real
      # ~/.config/labwc/rc.xml, which is what the helper's own default would do
      # if `apply` were ever called without --rc.
      # The model lives in apex-shell, so the suite needs that tree. It vendors
      # the MATCHING branch, falling back to the default one, and says which.
      #
      # This used to clone the default branch unconditionally, and the comment
      # justified it: "exactly what Containerfile.base does — so a shell change
      # that moves the keybind defaults fails here until it lands, which is the
      # documented merge order doing its job." That premise was true and is not
      # any more. build-image.yml pinned apex-shell to `main` while this program
      # develops both repos on roadmap/v2.2 and is forbidden from pushing main
      # until the final integration, so the "merge order" this relied on cannot
      # happen while the program runs — apex-shell/main last moved 2026-09-04
      # and roadmap/v2.2 was 137 commits ahead of it. The image was being built
      # from two repos at different ages, and this check was comparing against
      # the older one, so it could not have noticed.
      #
      # Both are pinned to the matching branch now. Keep the two in step: if one
      # is ever changed, the other is wrong.
      - name: Vendor apex-shell for the keybind model
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # The integration branch sits between the exact match and the default
          # branch, for the reason spelled out on the input-parity step above:
          # apex-shell has no `task/*` twin for most of this program's
          # branches, so "no matching branch" meant "compare against main",
          # and main is 137 commits behind the work — the exact staleness the
          # paragraph above says this step was changed to stop having. It is
          # latent here rather than red only because the keybind assertions
          # happen to still pass against the older model; that is luck, not a
          # property. Exact match stays first, so apex-os `main` still
          # vendors apex-shell `main`.
          #
          # Kept deliberately identical to the input-parity step above. If one
          # is ever changed, the other is wrong.
          want="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          shell_ref=""
          for cand in "$want" roadmap/v2.2; do
            [ -n "$cand" ] || continue
            if git ls-remote --exit-code --heads \
                 https://github.com/AndreNijman/apex-shell "$cand" >/dev/null 2>&1; then
              shell_ref="$cand"; break
            fi
          done
          if [ -n "$shell_ref" ]; then
            echo "keybind model: vendoring apex-shell branch '$shell_ref'"
            git clone --depth 1 --branch "$shell_ref" \
              https://github.com/AndreNijman/apex-shell.git \
              "${GITHUB_WORKSPACE}/../apex-shell"
          else
            echo "::warning::keybind model: apex-shell has no '$want' and no roadmap/v2.2; using its default branch"
            git clone --depth 1 https://github.com/AndreNijman/apex-shell.git \
              "${GITHUB_WORKSPACE}/../apex-shell"
          fi
          git -C "${GITHUB_WORKSPACE}/../apex-shell" log -1 --format='vendored apex-shell %h %s'
          test -f "${GITHUB_WORKSPACE}/../apex-shell/src/services/config_tab/KeybindService.qml"

      - name: Run labwc keybind generator assertions
        if: ${{ !cancelled() }}
        env:
          # Turns "no shell tree, skip everything" into a failure. Without it the
          # suite reported passed=0 failed=0 and a green tick on its first CI
          # run, having asserted precisely nothing.
          APEX_REQUIRE_SHELL_TREE: "1"
        run: ./tests/test-labwc-keybinds.sh

      # The half of the reported bug the suite above cannot reach. It passes
      # --no-reload to every `apply` on purpose, so it never starts labwc and
      # never presses a key; test-labwc-session.sh starts labwc and reloads it
      # but never presses a key either. So "the XML is correct" and "the
      # compositor survived" were both proven and "the key the user just bound
      # now does something" was proven by neither — which is the entire
      # complaint: rebind the launcher, watch the UI confirm it, press the key,
      # nothing happens.
      #
      # This starts labwc under WLR_BACKENDS=headless in a private
      # XDG_RUNTIME_DIR with WAYLAND_DISPLAY unset, so it draws nothing and has
      # no parent session to leak a keystroke into, and synthesises the
      # keypresses with wtype over virtual-keyboard-unstable-v1. It asserts
      # that isolation as three hard failures before the first key, and unsets
      # the inherited LABWC_PID — `labwc --reconfigure` SIGHUPs whatever that
      # names, and inheriting it would reload a developer's own session.
      #
      # It reuses the apex-shell tree vendored above, and skips with status 0
      # where labwc or wtype will not run, so a runner that cannot host a
      # compositor reports a skip rather than a false green or a false red.
      - name: Install a compositor and a synthetic keyboard
        if: ${{ !cancelled() }}
        run: |
          # Tolerant on purpose. The suite below skips with status 0 where labwc
          # or wtype will not run, so a runner that cannot host a compositor
          # reports a skip — but that safety net protects the SUITE, not this
          # step. `apt-get install` of a package the image's enabled components
          # do not carry exits non-zero and would redden the whole job over a
          # missing test dependency, which is a worse outcome than not running
          # the test. So a failed install is reported and the suite is left to
          # skip.
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq labwc wtype \
            || echo "labwc/wtype unavailable on this runner; the reload suite will skip"

      - name: Run the keybind reload assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-labwc-keybind-reload.sh

      # P2-018's recovery session, in the same job for the same reason: it
      # starts a real labwc under WLR_BACKENDS=headless, so it needs the
      # compositor this step just installed and nothing else. Its own
      # structural half runs anywhere and its live half skips cleanly where
      # labwc will not start, so a runner that cannot host a compositor
      # reports a skip rather than a false green.
      #
      # The assertion that matters here is the one no structural check can
      # make: an unparseable rc.xml is planted exactly where the user's lives
      # and the session has to come up anyway, which is what `labwc -C` buys
      # and what its absence would silently cost.
      - name: Run the safe-graphics recovery assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-safe-graphics.sh

      # End-to-end, against a real daemon on an isolated socket: that the
      # daemon resolves the asking session from the connection's PEER
      # CREDENTIALS and not from anything the client sent. The negative control
      # is a session that files a request while claiming
      # APEX_AGENT_SESSION=99999 and is still attributed correctly.
      #
      # Needs no root: every approval uses --no-run, so the suite records
      # decisions without performing operations and never raises an
      # authentication prompt.
      # bubblewrap, so the sandbox boundary is actually exercised on CI rather
      # than skipped. The secret broker's central claim — that a CONFINED
      # session cannot read the credential file — is only testable with a real
      # sandbox, and a runner has no bwrap by default. Without this the one
      # assertion that matters most is the one that never runs.
      - name: Install bubblewrap
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          bwrap --version
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor,
          # so bwrap installs fine and then fails with "setting up uid map:
          # Permission denied" the moment it runs. Without this the sandbox
          # section reports a session that "started" and then asserts nothing,
          # because the script inside never executed.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || \
            echo "note: no apparmor userns restriction on this kernel"
          # Prove it actually works HERE, so a failure is one clear line at
          # install time rather than a confusing assertion later.
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid \
                /bin/true || {
            echo "::error::bubblewrap cannot create a namespace on this runner"
            exit 1
          }
          echo "bubblewrap works: a confined session can be built" 
          # The runtime also refuses to confine a session when the kernel still
          # honours the legacy TIOCSTI ioctl, because keystroke injection into
          # the controlling terminal would make confinement meaningless. Report
          # it rather than letting the suite fail with a less obvious message.
          sysctl dev.tty.legacy_tiocsti 2>/dev/null || \
            echo "note: dev.tty.legacy_tiocsti knob absent (compiled out — fine)"

      - name: Run privilege-request assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-privilege-requests.sh

      # P1-035's three claims, none of which a unit test can reach: the typed
      # path arrives at the session it was addressed to and at no other; nothing
      # that arrives can submit the line; and a managed session may not use the
      # verb at all. All three need a real daemon, a real PTY and a real socket,
      # and the suite builds its own — its own XDG_RUNTIME_DIR, its own state,
      # killed by pid.
      - name: Run file-injection assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-agent-inject.sh

      # P1-036's named guarantee, which is the whole reason the conflict answer
      # comes from `merge-tree` and not from a real merge: after a status call
      # on a GENUINELY CONFLICTED worktree, MERGE_HEAD is absent, the staged
      # entries are unchanged, `git status --porcelain` is byte-identical and
      # no ref has moved. A unit test cannot reach any of it — it needs a real
      # repository with a real conflict, and the suite builds one, along with
      # its own daemon on its own socket and its own project store.
      - name: Run worktree-status assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-agent-worktrees.sh

      # P1-037's acceptance line — an agent session that runs in a disposable
      # capsule and discards its state — against the REAL disposable engine
      # from this checkout, a real daemon and a real PTY. Only the capsule
      # engine is faked, through the override the engine already documents, and
      # the fake logs every call: a fake that merely exited 0 would let every
      # assertion pass with the agent running on the host. So this needs no
      # podman, no distrobox and no image pull, and it cannot fail here for a
      # reason unrelated to this code.
      - name: Run disposable-capsule assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-agent-disposable.sh
      # §7's other half, and the one the privilege suite deliberately does not
      # touch: approving a request WITHOUT --no-run performs the operation and
      # is gated on being root. That was argued from the code rather than run,
      # on the grounds that testing it needs a real sudo prompt. It does not —
      # `unshare -r` gives a process a real effective uid 0, established by the
      # kernel and read the way ops::effective_uid reads it, and asks nobody
      # for a password. Nothing in this suite can raise a prompt: no sudo, no
      # pkexec, no pkcheck.
      #
      # The operation that then runs is contained by a mount namespace, with a
      # stub bound over the absolute path `apex install` execs, so the real
      # package engine is never reached. The two steps that genuinely need a
      # person — sudo's own authentication, and capability over the real
      # machine — are named at the end of the run with the commands to check
      # them by hand.
      #
      # The apparmor knob two steps up is what makes `unshare -r` work on a
      # 24.04 runner at all; without it this suite skips out loud rather than
      # passing.
      - name: Run root-approval assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-root-approval.sh

      # §5's two claims, neither of which the unit tests can reach: a portable
      # bundle carries no credential and no conversation, from a profile on a
      # real filesystem; and a confined session cannot rewrite the instructions
      # it was started with, enforced by the mount namespace rather than by an
      # argument list. The agent is a stub on PATH, so this needs no account,
      # no network and no API call, and it touches nobody's own profile — the
      # fixture home is under /var/tmp, because the sandbox masks /tmp.
      - name: Run agent-profile assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-agent-profile.sh

      # The compositor adapter is faked through APEX_WINDOW_ADAPTER, so this
      # runs with no compositor at all — which is the whole reason the adapter
      # is a separate program. `restore` is only ever called with --dry-run, so
      # the suite cannot start a window.
      - name: Run project-layout assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-project-layout.sh

      # fish and nushell cannot source the POSIX agent.sh, so each has its own
      # integration file — and the only way to know the three agree is to run
      # all three. fish is in Ubuntu's archive; nushell is not, so it comes from
      # the pinned upstream release the image also ships. A failed download
      # degrades that section to a LOUD SKIP rather than a red build, and the
      # suite refuses to report success if every section skipped.
      - name: Install fish and nushell
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish
          fish --version
          nu_ver=0.99.1
          url="https://github.com/nushell/nushell/releases/download/${nu_ver}/nu-${nu_ver}-x86_64-unknown-linux-musl.tar.gz"
          # The whole fetch is the `if` condition, not just the curl: a step runs
          # under `bash -e`, so an extraction that failed after a successful
          # download would be a red build rather than the skip promised above.
          # The member path is `nu-<ver>-x86_64-unknown-linux-musl/nu`, checked
          # with `tar tzf` against the real asset.
          if curl -fsSL --retry 2 "$url" -o /tmp/nu.tgz \
             && tar xzf /tmp/nu.tgz -C /tmp \
             && sudo install -m0755 "/tmp/nu-${nu_ver}-x86_64-unknown-linux-musl/nu" /usr/local/bin/nu; then
            nu --version
          else
            echo "note: nushell ${nu_ver} is unavailable; its section will skip out loud"
          fi

      - name: Run fish and nushell agent-integration assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-shell-agent.sh

      # The layout templates open panes in a real multiplexer, so a real one has
      # to be here. tmux is in Ubuntu's archive; zellij is not in any distro, so
      # it comes from the same pinned upstream release Containerfile.core does —
      # the version is kept in step by hand, and a failed download degrades that
      # section to a LOUD SKIP rather than a red build.
      - name: Install tmux and zellij
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          sudo apt-get install -y -qq tmux
          tmux -V
          zj=v0.45.1
          url="https://github.com/zellij-org/zellij/releases/download/${zj}/zellij-x86_64-unknown-linux-musl.tar.gz"
          if curl -fsSL --retry 2 "$url" -o /tmp/zellij.tgz \
             && sudo tar xzf /tmp/zellij.tgz -C /usr/local/bin zellij \
             && sudo chmod 0755 /usr/local/bin/zellij; then
            zellij --version
          else
            echo "note: zellij ${zj} is unavailable; its section will skip out loud"
          fi

      # Both multiplexers run on an isolated socket (TMUX_TMPDIR,
      # ZELLIJ_SOCKET_DIR under the suite's own temp dir), and XDG_RUNTIME_DIR
      # is a fixture with no control socket — so this cannot reach an agent
      # runtime, and every agent pane resolves to `apex agent run` against a
      # stub on PATH.
      - name: Run terminal layout template assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-mux-layouts.sh

      # §4's whole claim is "agents use credentials without receiving the raw
      # secret". This stores a sentinel token, uses a capability from inside a
      # real CONFINED session, and asserts the sentinel appears in neither
      # stdout, stderr, the session's PTY transcript, nor the audit log — while
      # the git operation is genuinely attempted against 127.0.0.1:1, which
      # refuses instantly, so no network is used and the token goes nowhere.
      - name: Run secret-broker assertions
        if: ${{ !cancelled() }}
        env:
          # The suite's one legitimate skip is its sandbox section: without
          # bubblewrap a confined session cannot be built, so the boundary
          # cannot be tested and reporting "failed" would be a lie about what
          # was checked. bwrap is installed two steps up, so a skip HERE means
          # that install was lost — and this turns that into a failure rather
          # than a green job that never ran §4's central assertion.
          APEX_REQUIRE_SANDBOX: "1"
        run: ./tests/test-secret-broker.sh

      # P0-003's migration, against a fixture home under /var/tmp with two
      # obvious fakes in it and a loopback MCP server that refuses without the
      # bearer token. It proves the order the whole thing rests on — store,
      # verify, and only then remove — including that an unverifiable
      # credential is stored and LEFT, which is the outcome an interrupted or
      # ungranted run has to have.
      - name: Run credential-migration assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-secret-migrate.sh

      # P2-001/P2-002's backup framework, end to end through the real CLI. Two
      # things it MEASURES rather than asserts: that a canary planted in the
      # source appears in no byte written to the target — chunks, manifest,
      # head and the object names — and that a private key written by REAL
      # root cannot be opened by the account that owns the backups. The second
      # half uses `sudo -n`, which this runner has, and the suite says which
      # assertions it did not make when that is missing rather than passing
      # vacuously. Everything it touches is under one `mktemp -d -p /var/tmp`;
      # APEX_BACKUP_KEYS keeps it out of /var/lib.
      #
      # There is no R2 section in it, and that is not an omission: `Api::loopback`
      # is `#[cfg(test)]`, so a shipped apex-secretd always addresses
      # api.cloudflare.com and the store's host pin would refuse a credential
      # stored for anywhere else. The backup framework's own R2 call sequence is
      # proven in the `rust` job instead, against the same loopback double that
      # 401s an unauthenticated request.
      - name: §13.5 backup — encrypted at rest, versioned restore, and the four verdicts
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-backup.sh

      # P2-001's ssh target, against a REAL sshd on loopback — the fixture the
      # target's own source named as the reason it used to be refused, since a
      # transport proven against a fake `ssh` on PATH is a test of the argument
      # list and not of a backup.
      #
      # openssh-server is installed explicitly rather than assumed. The suite
      # exits 2 with COULD NOT RUN when there is no sshd, which is neither a
      # pass nor a failure, and a step that took that as a pass would make the
      # ssh target look proven on every runner while being proven on none —
      # `set -e` here turns that 2 into a failed step, which is the point.
      #
      # The sshd it starts is UNPRIVILEGED, on a kernel-chosen high port, from a
      # config file inside its own fixture, and it is killed by pid. Nothing
      # under /etc/ssh and no system unit is read or written.
      - name: §13.5 backup over ssh — a real sshd on loopback
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          ./tests/test-apex-backup-ssh.sh

      # P2-001's s3 target, through a REAL apex-secretd, against a loopback
      # double that recomputes the SigV4 signature with nothing but Python's
      # `hmac` and `hashlib` and answers 403 when it does not match.
      #
      # Three implementations of the signature and that is the point: the one
      # under test, botocore's numbers pinned as known-answer tests beside it,
      # and the double's. A signer compared only with itself is a signer that
      # will be consistently wrong and fail only at a real S3.
      #
      # NO AWS ACCOUNT AND NO OUTBOUND CONNECTION. The endpoint is 127.0.0.1 on
      # a kernel-chosen port and the access key id is AWS's own documentation
      # example, which authorises nothing.
      - name: §13.5 backup to S3 — SigV4 against an independent verifier
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-backup-s3.sh

      # ── suites that existed and that CI had never once invoked ───────────
      #
      # These two were among the thirteen `check-suites-run-in-ci.sh` found on
      # 2026-09-12: real assertion counts, landed, reviewed, and named in no
      # workflow. They are wired here rather than in `rust` because neither
      # needs a toolchain — one parses a static ruleset and one parses the
      # Containerfiles — and because the engine selector `^(files/|tests/|
      # Containerfile)` is exactly the set of files they are ABOUT, which is
      # the rule the six comments in the `changes` job were written to enforce.
      #
      # `!cancelled()` on each, so that a suite CI has never run cannot, by
      # going red on its first outing, skip the two coverage gates below it and
      # switch off the very checks that found it.
      - name: Install nftables for the ruleset parse
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables || echo "note: nftables unavailable"
          # `nft -c` applies nothing, but libnftables still opens a netlink
          # socket, so it needs CAP_NET_ADMIN — which this job does not have.
          # The suite's own fallback is a private user+network namespace, and
          # that is refused on Ubuntu 24.04 unless this knob is cleared. The
          # bubblewrap step near the top of this job already clears it; this is
          # the belt to that braces, so a reordering there cannot silently turn
          # every parse assertion below into a SKIP. The value is per-boot on
          # an ephemeral VM.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || \
            echo "note: apparmor userns knob unavailable"
          command -v nft >/dev/null && echo "have: $(nft --version)" || echo "MISSING: nft"

      # P1-044's default-drop policy, asserted rule by rule against the shipped
      # files/system/nftables/apex.nft. It never loads the ruleset — `nft -c`
      # parses — so it cannot disconnect the machine running it, which is why
      # it is safe here and why its live sibling is not.
      #
      # It degrades honestly rather than vacuously: with no nft, or with nft
      # unable to reach netlink even inside a private netns, the parse
      # assertion reports SKIP with the reason instead of passing. The step
      # above is what keeps that skip from being the normal outcome — and the
      # summary check below is what keeps it from being an outcome CI accepts.
      #
      # A SKIP here is a COULD NOT RUN, and a could-not-run must not report a
      # green tick: without this the whole point of wiring the suite in would
      # be lost the first time the runner image dropped nftables, and the step
      # would go on passing while inspecting the ruleset not at all. That is
      # the exact defect class this suite was found by. The pass floor is a
      # floor and not an equality so that adding an assertion does not require
      # editing this file, but a DROP in the count fails, which is the
      # direction that hides a deleted rule.
      - name: Run firewall policy assertions
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          out="$(./tests/test-apex-firewall.sh 2>&1)"
          printf '%s\n' "$out"
          summary="$(printf '%s' "$out" | grep -E '^apex-firewall: ' || true)"
          [ -n "$summary" ] || { echo "::error::the firewall suite printed no summary line"; exit 1; }
          read -r passed _ failed _ skipped _ <<<"$(printf '%s' "$summary" | sed 's/^apex-firewall: //')"
          echo "measured: passed=$passed failed=$failed skipped=$skipped"
          [ "$failed" = 0 ] || { echo "::error::$failed firewall assertions failed"; exit 1; }
          [ "$skipped" = 0 ] || {
              echo "::error::$skipped firewall assertions could not run on this runner ($summary); a could-not-run is not a pass"
              exit 1
          }
          [ "$passed" -ge 32 ] || {
              echo "::error::only $passed firewall assertions ran; 32 ran on 2026-09-12, so some no longer execute"
              exit 1
          }

      # P2-005's device packages, read out of the Containerfiles the way
      # BuildKit reads them — comments dropped, continuations joined, each RUN
      # body parsed with `bash -n` — rather than grepped. Every gap it guards
      # was a package that was present and enabled nothing, or absent behind a
      # name that looked like it covered the case: no gvfs-fuse, so a mounted
      # share existed only inside GTK; no bolt, so a Thunderbolt dock sat at
      # authorized=0 with nothing able to authorise it.
      #
      # `Containerfile` is in the engine selector, so a PR that deletes a
      # package name from an install list selects this job.
      #
      # The count floor is here for the same reason as the firewall one above:
      # every assertion in this suite is a `grep` over a parsed Containerfile,
      # so a checkout that put the Containerfiles somewhere else, or a parser
      # that returned nothing, would make the suite assert nothing and exit 0.
      # 39 assertions ran on this branch on 2026-09-13; a drop is a suite that
      # stopped looking, not a suite that got shorter.
      - name: Run device-image package assertions
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          out="$(./tests/test-device-image.sh 2>&1)"
          printf '%s\n' "$out"
          summary="$(printf '%s' "$out" | grep -E '^device image: ' || true)"
          [ -n "$summary" ] || { echo "::error::the device-image suite printed no summary line"; exit 1; }
          read -r passed _ failed _ <<<"$(printf '%s' "$summary" | sed 's/^device image: //')"
          echo "measured: passed=$passed failed=$failed"
          [ "$failed" = 0 ] || { echo "::error::$failed device-image assertions failed"; exit 1; }
          [ "$passed" -ge 39 ] || {
              echo "::error::only $passed device-image assertions ran; 39 ran on 2026-09-13, so some no longer execute"
              exit 1
          }

      # tests/test-apex-devices.sh — 108 assertions over six device areas, and
      # until this line no CI run had executed one of them. It was DEBT in
      # tests/suites-not-in-ci.txt, not a decision.
      #
      # The floor below is the point of the step as much as `failed = 0` is, and
      # it had rotted: it still read 55 while 76 assertions were running, so a
      # change that silently stopped half the suite executing would have passed
      # it. Raise it with the suite. It is meant to be a tripwire on a suite
      # that stopped looking, and a tripwire 21 assertions behind is not one.
      #
      # It is shell-only: it drives files/system/libexec/apex-devices against a
      # fixture tree under mktemp, with a $PATH of its own stubs, so it reaches
      # no device on the machine running it. Engine job, because the engine
      # selector is `^(files/|tests/|…)` and the helper it drives lives under
      # files/.
      #
      # The point of the suite is the EACCES sweep's finding — that a reader
      # which collapses "permission denied" into "there is none" is the same
      # bug in fourteen places — so its fixtures are deliberately unreadable in
      # places and it counts a `skipped` of its own. The step therefore fails on
      # skipped > 0 as well as on failed > 0, and separately on a bare `SKIP`
      # line, which would be an echo that bypassed the counter.
      - name: P1 devices — 108 assertions over six device areas
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          rc=0; out="$(./tests/test-apex-devices.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 0 ] || { echo "::error::the devices suite exited $rc"; exit 1; }
          summary="$(printf '%s\n' "$out" | grep -E '^apex-devices: [0-9]+ passed, [0-9]+ failed, [0-9]+ skipped$' || true)"
          [ -n "$summary" ] || { echo "::error::the devices suite printed no summary line"; exit 1; }
          [ "$(printf '%s\n' "$summary" | wc -l)" = 1 ] || { echo "::error::more than one line looked like the summary; the parse below would read the wrong one"; exit 1; }
          passed="$(printf '%s' "$summary" | awk '{print $2}')"
          failed="$(printf '%s' "$summary" | awk '{print $4}')"
          skipped="$(printf '%s' "$summary" | awk '{print $6}')"
          echo "measured: passed=$passed failed=$failed skipped=$skipped"
          [ "$failed" = 0 ] || { echo "::error::$failed device assertions failed"; exit 1; }
          [ "$skipped" = 0 ] || { echo "::error::$skipped device assertions could not run on this runner; a could-not-run is not a pass"; exit 1; }
          [ "$passed" -ge 108 ] || { echo "::error::only $passed device assertions ran; 108 ran on 2026-09-18, so some no longer execute"; exit 1; }
          if printf '%s\n' "$out" | grep -qE '^[[:space:]]*SKIP'; then
              echo "::error::the devices suite printed a SKIP line; the counter above is the same signal, and this catches an echo that bypasses the helper"
              exit 1
          fi

      - name: ShellCheck the privileged helpers
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # A hard gate, not advisory: these run as root, and the warning class
          # shellcheck catches here is exactly the class that is invisible in
          # review — unquoted expansions and recursive deletes that an empty
          # variable turns into a path on the live system. The file is clean at
          # this level today, so any finding is one this PR introduced.
          # tests/in-login-session.sh is here for the same reason the four
          # libexec helpers are: it is the only thing under tests/ that
          # invokes `sudo`, so an unquoted expansion in it is an unquoted
          # expansion in a command that runs as root.
          shellcheck -S warning files/system/libexec/apex-pkg \
            tests/in-login-session.sh \
            files/system/libexec/apex-boot-migrate \
            tests/test-boot-migrate.sh \
            files/system/libexec/apex-env \
            files/system/libexec/apex-plugin \
            files/system/libexec/apex-disposable \
            files/system/libexec/apex-vm \
            files/system/libexec/apex-screen-reader \
            tests/test-apex-recover.sh \
            tests/test-apex-pkg.sh tests/test-apex-firstrun.sh \
            tests/test-labwc-keybinds.sh tests/test-apex-env.sh \
            tests/test-apex-resolve.sh tests/test-apex-blueprint.sh \
            tests/test-apex-modes.sh tests/test-apex-plugin.sh \
            tests/test-apex-host.sh tests/test-apex-dispatch.sh \
            tests/test-apex-ai.sh tests/test-apex-env-devices-live.sh \
            tests/test-apex-greet-sessions.sh \
            tests/test-apex-session-watchdog.sh \
            files/system/libexec/apex-session-watchdog \
            tests/test-apex-greet-a11y.sh tests/test-apex-greet-layout.sh \
            tests/test-apex-greet-session-bus.sh tests/test-apex-a11y-stack.sh \
            tests/test-labwc-keybind-reload.sh \
            tests/test-apex-safe-graphics.sh \
            tests/test-apex-gaming-session.sh \
            files/system/libexec/apex-gaming-session \
            files/system/libexec/apex-safe-graphics \
            files/system/libexec/apex-safe-graphics-terminal \
            tests/test-apex-chaos.sh tests/test-apex-vm.sh
          # The chaos harness separately, with -x so the driver's `. lib.sh`
          # is followed, and the cases as bash fragments because they are
          # sourced rather than executed and have no shebang of their own.
          # It belongs under a HARD gate for the same reason the libexec
          # helpers do: these scripts run `mount`, `chmod 0000` and `rm` with
          # expansions, and an empty variable in one of those is a path on the
          # machine running it.
          shellcheck -S warning -x tests/chaos/run-chaos tests/chaos/chaos-loop \
            tests/chaos/lib.sh
          shellcheck -S warning -x tests/chaos/cases/*.sh
          # The VM lab, with -x for the same reason: it sources the chaos
          # library for the verdict record, and it runs `rm -rf` and `chown -R`
          # on paths built from variables inside a container it starts itself.
          shellcheck -S warning -x tests/vmlab/run-vmlab tests/vmlab/mk-guest

      # tests/test-device-services-netns.sh — 12 assertions about whether a
      # printer, a Windows share and an NFS export can actually be reached
      # through the shipped policy, and whether `apex firewall allow <name>`
      # opens the port the catalogue says it does. It asserts no RULE; P1-044
      # owns those. It was DEBT in tests/suites-not-in-ci.txt.
      #
      # It sends REAL packets, and it can do that here because it sends them
      # inside `unshare -rmn`: a private user, mount and network namespace with
      # a veth pair and a peer that is a sleeping process addressed by pid. The
      # machine running it has no interface added, no rule loaded and no port
      # opened. It needs unshare, nsenter, ip, nft and python3, and it needs the
      # apparmor userns knob the nftables step above already clears — that is
      # why it is placed after it and not earlier.
      #
      # Its own report() exits 0 when everything was SKIPPED, because it exits
      # on the failure count alone. So a runner that refused the namespace would
      # hand this step a green tick over nothing measured at all. The skipped
      # counter is read back and required to be zero for exactly that reason.
      - name: P1 device services — a printer, a share and an export through the real policy
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          rc=0; out="$(./tests/test-device-services-netns.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 0 ] || { echo "::error::the device-services netns suite exited $rc"; exit 1; }
          summary="$(printf '%s\n' "$out" | grep -E '^device services \(netns\): [0-9]+ passed, [0-9]+ failed, [0-9]+ skipped$' || true)"
          [ -n "$summary" ] || { echo "::error::the device-services netns suite printed no summary line"; exit 1; }
          [ "$(printf '%s\n' "$summary" | wc -l)" = 1 ] || { echo "::error::more than one line looked like the summary; the parse below would read the wrong one"; exit 1; }
          counts="$(printf '%s' "$summary" | sed 's/^device services (netns): //')"
          passed="$(printf '%s' "$counts" | awk '{print $1}')"
          failed="$(printf '%s' "$counts" | awk '{print $3}')"
          skipped="$(printf '%s' "$counts" | awk '{print $5}')"
          echo "measured: passed=$passed failed=$failed skipped=$skipped"
          [ "$failed" = 0 ] || { echo "::error::$failed device-services assertions failed"; exit 1; }
          [ "$skipped" = 0 ] || {
              echo "::error::$skipped device-services assertions could not run ($summary). This suite's own report() exits 0 on a skip-only run, so without this line a runner that refused the namespace would show a green tick over nothing measured at all"
              exit 1
          }
          [ "$passed" -ge 12 ] || { echo "::error::only $passed device-services assertions ran; 12 ran on 2026-09-13, so some no longer execute"; exit 1; }
          if printf '%s\n' "$out" | grep -qE '^[[:space:]]*SKIP'; then
              echo "::error::the device-services netns suite printed a SKIP line; the counter above is the same signal, and this catches an echo that bypasses the helper"
              exit 1
          fi

      # tests/test-apex-multilib.sh — the engine's multilib DECISIONS, judged
      # against packages Fedora actually ships. test-apex-pkg.sh asserts the
      # argv the engine builds, which is the right level for most of it and was
      # not enough here: `apex install steam` was broken by six defects and the
      # one that reached a user's screen produced correct argv and a wrong
      # result. It was DEBT in tests/suites-not-in-ci.txt, with the note "drives
      # apex-pkg; needs care about what it installs".
      #
      # That care is already in the suite's shape, and it was checked rather
      # than assumed: every rpm is downloaded and every decision is taken INSIDE
      # `podman run --rm`, against a Fedora image, with this repository mounted
      # read-only. The engine is sourced there and only `guard_rpms` is called —
      # a function that decides and deletes from a scratch destdir. Nothing is
      # installed on the runner, no sysext is built, and /var/lib/extensions is
      # never opened. (`source apex-pkg` does reach `main` with no arguments,
      # which prints usage.)
      #
      # This step also fails if podman is missing: the suite prints SKIP and
      # exits 0 in that case, and so does its "no repository reachable" path.
      # Either would otherwise be a green tick over three decisions nobody made.
      - name: P1 multilib — the engine's decisions over a real Fedora package set
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          command -v podman >/dev/null || { echo "::error::podman is not on this runner; the multilib suite would SKIP and exit 0, and a could-not-run is not a pass"; exit 1; }
          rc=0; out="$(./tests/test-apex-multilib.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 0 ] || { echo "::error::the multilib suite exited $rc"; exit 1; }
          summary="$(printf '%s\n' "$out" | grep -E '^apex-multilib: [0-9]+ passed, [0-9]+ failed$' || true)"
          [ -n "$summary" ] || { echo "::error::the multilib suite printed no summary line, which is what it does when podman is absent or no repository was reachable — it then exits 0, so this line is the only thing between that and a green tick"; exit 1; }
          [ "$(printf '%s\n' "$summary" | wc -l)" = 1 ] || { echo "::error::more than one line looked like the summary; the parse below would read the wrong one"; exit 1; }
          counts="$(printf '%s' "$summary" | sed 's/^apex-multilib: //')"
          passed="$(printf '%s' "$counts" | awk '{print $1}')"
          failed="$(printf '%s' "$counts" | awk '{print $3}')"
          echo "measured: passed=$passed failed=$failed"
          [ "$failed" = 0 ] || { echo "::error::$failed multilib decisions were wrong"; exit 1; }
          [ "$passed" -ge 3 ] || { echo "::error::only $passed multilib decisions were judged; 3 ran on 2026-09-13, so some no longer execute"; exit 1; }
          if printf '%s\n' "$out" | grep -qE '^[[:space:]]*SKIP'; then
              echo "::error::the multilib suite printed a SKIP; every one of its abstentions is now a failure by design, so a SKIP means a new one was added"
              exit 1
          fi

      # tests/test-apex-multilib-extract.sh — the same engine, one function
      # later. The suite above stops at guard_rpms on purpose and says why: a
      # full extraction through the install path needs the container's versions
      # to match the repository, and when they do not the guard correctly
      # refuses the whole transaction. So the decisions are the discriminating
      # step there. They were not enough either. On katana on 2026-09-19 every
      # decision was right and the machine still broke, TWICE, because
      # extract_rpms' 32-bit pass decided what to carry from a hand-written list
      # of directories. The list was too narrow: it named /usr/bin, /usr/sbin,
      # /usr/share and /etc and nothing else, while i686 packages also ship
      # helpers under /usr/libexec — 14 image binaries were shadowed and
      # GStreamer went from 1344 usable features to 2 (§3). And it was too
      # blunt: `--excludepath /usr/share` threw away every *_icd.i686.json while
      # keeping the .so files those manifests name, so 32-bit Vulkan had no
      # driver at all and Steam died with VK_ERROR_INCOMPATIBLE_DRIVER (§6.5).
      # The engine now merges the 32-bit tree file by file instead, carrying a
      # path only when neither the image nor the native pass already provides
      # it, and this suite judges the resulting tree from both directions.
      #
      # This one calls extract_rpms DIRECTLY, which is what lets it run where
      # the suite above would be refused: --nodeps --replacefiles into a
      # throwaway root does not care about version skew. Same containment —
      # everything happens inside `podman run --rm` with the repository mounted
      # read-only, nothing is installed on the runner, no sysext is built.
      #
      # The floor below is 11, and SIX of those eleven exist only to stop this
      # suite passing for free. That ratio is deliberate: the engine no longer
      # carries a list of excluded directories that a test could read back, so
      # every assertion here is a measurement of a real tree, and a measurement
      # of an empty tree passes every rule ever written.
      #
      #   * two fail if the download produced no 32-bit ELF and no i686-only
      #     paths at all, so "nothing is shadowed" cannot come from nothing;
      #   * one fails if the set ships no arch-tagged Vulkan manifest, which is
      #     the file class §6.5 was about;
      #   * control 1 re-extracts the same set with the PRE-FIX exclude list and
      #     is read twice — it must still produce a shadow (so §3 is visible on
      #     today's packages) and it must contain none of those manifests (so
      #     §6.5 is visible too, and "they all arrived" is not a free pass);
      #   * control 2 re-runs the merge with the rpmdb clause REMOVED and must
      #     let an image-owned 32-bit file through. Without it this suite would
      #     be proving the wrong leg of the rule: in fedora:43 the x86_64
      #     siblings of gstreamer1 and at-spi2-core are downloaded, so the
      #     "already placed by the native pass" clause hides most of the defect,
      #     while on a real APEX machine every 64-bit sibling is in the IMAGE
      #     and the rpmdb clause is the only thing doing the work.
      #
      # If Fedora ever stops shipping 32-bit helpers or arch-tagged manifests in
      # these packages, a control goes red and says the instrument has gone
      # blind — the opposite of what a coverage drop usually does here.
      #
      # The eleventh assertion is not about extraction at all: it calls
      # probe_rpm against the REAL dnf5 this container has. `apex resolve` lost
      # its entire rpm leg to `dnf5 repoquery -- <name>`, an invocation dnf5
      # refuses, and tests/test-apex-resolve.sh could not see it because it
      # fakes dnf5. This is the only suite in the tree with a real one.
      - name: P1 multilib — where the 32-bit pass actually puts files
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          command -v podman >/dev/null || { echo "::error::podman is not on this runner; the extract suite would SKIP and exit 0, and a could-not-run is not a pass"; exit 1; }
          rc=0; out="$(./tests/test-apex-multilib-extract.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 0 ] || { echo "::error::the multilib extract suite exited $rc"; exit 1; }
          summary="$(printf '%s\n' "$out" | grep -E '^apex-multilib-extract: [0-9]+ passed, [0-9]+ failed$' || true)"
          [ -n "$summary" ] || { echo "::error::the extract suite printed no summary line, which is what it does when podman is absent or no repository was reachable — it then exits 0, so this line is the only thing between that and a green tick"; exit 1; }
          [ "$(printf '%s\n' "$summary" | wc -l)" = 1 ] || { echo "::error::more than one line looked like the summary; the parse below would read the wrong one"; exit 1; }
          counts="$(printf '%s' "$summary" | sed 's/^apex-multilib-extract: //')"
          passed="$(printf '%s' "$counts" | awk '{print $1}')"
          failed="$(printf '%s' "$counts" | awk '{print $3}')"
          echo "measured: passed=$passed failed=$failed"
          [ "$failed" = 0 ] || { echo "::error::$failed extraction assertions failed"; exit 1; }
          [ "$passed" -ge 11 ] || { echo "::error::only $passed extraction assertions ran; 11 ran on 2026-09-19, so some no longer execute — and six of the eleven are the guards and controls that stop this suite passing for free"; exit 1; }
          if printf '%s\n' "$out" | grep -qE '^[[:space:]]*SKIP'; then
              echo "::error::the multilib extract suite printed a SKIP; its abstentions are failures by design, so a SKIP means a new one was added"
              exit 1
          fi

      # tests/test-apex-pkg-etc-label.sh — what LABEL the engine puts on the
      # files it writes into /etc. install_etc copies with `cp -a`, which
      # preserves the SOURCE label, and the source is an rpm extraction tree
      # under /var/lib — so every file `apex install` put in /etc arrived as
      # rpm_var_lib_t. On katana on 2026-09-20 that made /etc/.pwd.lock
      # rpm_var_lib_t where policy wants passwd_file_t, systemd could not take
      # the passwd lock, and all six DynamicUser=yes units on the machine —
      # capsule@.service and rpm-ostreed.service among them — failed at step
      # USER with 217/USER. No AVC was logged, `systemctl --failed` showed
      # nothing because those units are on-demand, and it took four rounds of
      # probing to find. It then recurred on the next rebuild with a DIFFERENT
      # wrong type, which is why the fix is in the engine.
      #
      # The suite asserts the property over EVERYTHING the pass writes, not
      # over .pwd.lock: the packages decide which paths exist and the
      # filesystem's own ctime decides which of them the pass touched, so a
      # file nobody has thought of is covered. Same containment as the two
      # steps above — podman, repository mounted read-only, nothing installed
      # on the runner, no sysext built.
      #
      # THE FLOOR IS THE COVERAGE-MODE COUNT, AND THAT IS NOT AN ACCIDENT.
      # Reading and setting a per-file SELinux label needs a host kernel with
      # SELinux; this runner is ubuntu-24.04 and has none, and podman's own
      # rootfs is mounted with a fixed `context=` where setxattr security.selinux
      # returns EOPNOTSUPP regardless. So on the runner the suite measures the
      # half that does not need labels: every path the pass wrote was handed to
      # the policy labeller, and matchpathcon — which works from the policy
      # files with SELinux switched off — wants a non-default type for a real
      # share of them, so the lookup cannot be a constant. 9 assertions ran
      # that way, measured on 2026-09-20 by forcing coverage mode on an SELinux
      # workstation (APEX_ETC_LABEL_FORCE_COVERAGE=1); the same suite runs 21
      # there without forcing, and the extra 12 are the ones that read labels
      # back, including the pre-fix control that reproduces the katana finding
      # exactly. Run it on an APEX machine to get those.
      #
      # Both halves are mutation-tested rather than assumed: deleting the
      # engine's relabel call turns 6 assertions red here and 2 in coverage
      # mode, and deleting the single line that records what the plain-write
      # branch wrote turns coverage red for the 44 paths that branch handles.
      - name: P0 pkg — the label on everything apex install writes into /etc
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          command -v podman >/dev/null || { echo "::error::podman is not on this runner; the etc-label suite would SKIP and exit 0, and a could-not-run is not a pass"; exit 1; }
          rc=0; out="$(./tests/test-apex-pkg-etc-label.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 0 ] || { echo "::error::the etc-label suite exited $rc"; exit 1; }
          summary="$(printf '%s\n' "$out" | grep -E '^apex-pkg-etc-label: [0-9]+ passed, [0-9]+ failed$' || true)"
          [ -n "$summary" ] || { echo "::error::the etc-label suite printed no summary line, which is what it does when podman is absent or no repository was reachable — it then exits 0, so this line is the only thing between that and a green tick"; exit 1; }
          [ "$(printf '%s\n' "$summary" | wc -l)" = 1 ] || { echo "::error::more than one line looked like the summary; the parse below would read the wrong one"; exit 1; }
          counts="$(printf '%s' "$summary" | sed 's/^apex-pkg-etc-label: //')"
          passed="$(printf '%s' "$counts" | awk '{print $1}')"
          failed="$(printf '%s' "$counts" | awk '{print $3}')"
          echo "measured: passed=$passed failed=$failed"
          [ "$failed" = 0 ] || { echo "::error::$failed /etc labelling assertions failed"; exit 1; }
          [ "$passed" -ge 9 ] || { echo "::error::only $passed labelling assertions ran; 9 is what coverage mode measured on 2026-09-20, and four of those nine exist purely to stop the other five passing over an empty population"; exit 1; }
          if printf '%s\n' "$out" | grep -qE '^[[:space:]]*SKIP'; then
              echo "::error::the etc-label suite printed a SKIP; that means podman, the repository or the SELinux policy rpm was unavailable, and none of the assertions ran"
              exit 1
          fi

      # tests/test-apex-pkg-update.sh — does a fix baked into an image ever
      # reach a machine that is already running one? On 2026-09-19 it did not.
      # katana was rebased onto the image carrying pkg-share, rebooted, and
      # apex-sysext-rebuild.service — the unit whose entire job is to notice
      # that the OS moved — started and finished in the SAME SECOND, reported
      # success, and re-merged a byte-identical old extension: 177 image paths
      # still shadowed, zero i686 Vulkan ICDs on a machine that had just taken
      # the update (evidence §0.2, §1.2).
      #
      # Two guards decide. `cmd_rebuild --if-needed` read os_version_id and
      # pkg_compat_level; `rebuild_extension`'s own short-circuit read
      # os_version_id and the resolved rpm set. Neither can see an APEX image
      # build: VERSION_ID is 43 before and after, and the resolved set comes
      # from Fedora's repositories. The level is the only signal, and the guard
      # every install, remove, upgrade and rebuild funnels through ignored it.
      #
      # The reason this is a suite and not a one-line diff is the trap in the
      # remedy. Bumping PKG_COMPAT_LEVEL ALONE looks like a fix: --if-needed
      # announces a rebuild, re-downloads every rpm, stops at "already up to
      # date" on the unchanged set, and write_state then stamps the new level —
      # marker consumed, nothing built, and every later boot matches. So
      # "the extension rebuilt after a bump" is worthless as an assertion: it
      # also passes against the broken engine whenever Fedora's repositories
      # have drifted, which is exactly how katana's rebuild eventually happened
      # (evidence §2.1: "luck, not design").
      #
      # Every case therefore HOLDS THE RESOLVED SET CONSTANT and varies only
      # the level, and the suite prints the stored set against the computed one
      # so that is measured rather than claimed. Two of its assertions are
      # mutants that delete the level clause from the live function body and
      # require the defect BACK — the container one must reproduce the whole
      # trap: "compatibility changed", then "already up to date", nothing
      # extracted, and the new level stamped anyway. Without them a bump with
      # no fix would read as green.
      #
      # Leg A needs nothing; leg B runs the service's exact ExecStart inside
      # `podman run --rm` because PKG_ROOT is a readonly /var/lib path and the
      # entrypoint needs root. Same containment as the two steps above: the
      # repository is mounted read-only, nothing is installed on the runner,
      # and no sysext is ever merged.
      - name: P0 packages — does an image fix reach a machine that updates?
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          command -v podman >/dev/null || { echo "::error::podman is not on this runner; leg B would SKIP and a could-not-run is not a pass"; exit 1; }
          rc=0; out="$(./tests/test-apex-pkg-update.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 0 ] || { echo "::error::the pkg-update suite exited $rc"; exit 1; }
          summary="$(printf '%s\n' "$out" | grep -E '^apex-pkg-update: [0-9]+ passed, [0-9]+ failed, [0-9]+ skipped$' || true)"
          [ -n "$summary" ] || { echo "::error::the pkg-update suite printed no summary line"; exit 1; }
          [ "$(printf '%s\n' "$summary" | wc -l)" = 1 ] || { echo "::error::more than one line looked like the summary; the parse below would read the wrong one"; exit 1; }
          counts="$(printf '%s' "$summary" | sed 's/^apex-pkg-update: //')"
          passed="$(printf '%s' "$counts" | awk '{print $1}')"
          failed="$(printf '%s' "$counts" | awk '{print $3}')"
          skipped="$(printf '%s' "$counts" | awk '{print $5}')"
          echo "measured: passed=$passed failed=$failed skipped=$skipped"
          [ "$failed" = 0 ] || { echo "::error::$failed pkg-update assertions failed"; exit 1; }
          [ "$skipped" = 0 ] || { echo "::error::$skipped assertions could not run; leg B is the one that runs the service's real entrypoint, so a skip here is a green tick over the defect this suite exists for"; exit 1; }
          [ "$passed" -ge 17 ] || { echo "::error::only $passed pkg-update assertions ran; 17 ran on 2026-09-19, so some no longer execute — and the two mutants among them are what stop a bare PKG_COMPAT_LEVEL bump reading as a fix"; exit 1; }
          if printf '%s\n' "$out" | grep -qE '^[[:space:]]*SKIP'; then
              echo "::error::the pkg-update suite printed a SKIP line; the counter above is the same signal, and this catches an echo that bypasses the helper"
              exit 1
          fi

      # tests/test-labwc-session.sh — the APEX Floating session, probed by real
      # clients against a real labwc running the SHIPPED config. It was the last
      # DEBT line in tests/suites-not-in-ci.txt, and its note asked the right
      # question: "check whether the harness now allows it".
      #
      # It does, because the suite gained a second way to render. Until today it
      # could only nest inside a parent display, which on the only machine that
      # ever ran it meant real windows on a developer's active workspace — a
      # blanket `tests/*.sh` sweep once launched compositors over somebody's
      # work, which is why the APEX_LABWC_SESSION_TESTS opt-in exists. wlroots'
      # headless backend needs no screen at all, and nobody had wired it up.
      #
      # The suite does not merely set WLR_BACKENDS=headless; it STRIPS
      # WAYLAND_DISPLAY and DISPLAY from the compositor's environment, because
      # with a parent still visible wlroots can pick the wayland backend anyway
      # and the first anyone would know is a window appearing. With no parent in
      # the environment there is nothing to nest into.
      #
      # The tools below are not optional and the install is not tolerant. A
      # missing wl-copy makes the clipboard probe report `fail`, not `skip` —
      # this suite turns a could-not-run into a failure by design — so a runner
      # that cannot host them should say so here rather than five minutes later
      # as a wrong-looking assertion.
      - name: Install the clients the labwc session matrix probes with
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            labwc wlr-randr wl-clipboard grim swaybg swaylock swayidle gammastep \
            xdg-desktop-portal-wlr xdg-desktop-portal-gtk
          # Named one by one, and the list is the suite's, not a guess. Run
          # 34717346972 installed everything except swaylock and swayidle and
          # the step went red with `16 passed, 0 failed, 2 skipped` — the two
          # protocol probes whose clients those are (ext-session-lock and
          # ext-idle-notify) reported "probe client not installed". That is the
          # step working: it refused to call a capability proven when the thing
          # that would have proven it was absent.
          for t in labwc wlr-randr wl-copy wl-paste grim swaybg swaylock swayidle gammastep; do
              command -v "$t" >/dev/null || { echo "::error::$t is missing after the install; the suite would report its probe as a SKIP and the step below refuses that"; exit 1; }
          done

      - name: P3 labwc — the shipped session, probed headless by real clients
        if: ${{ !cancelled() }}
        env:
          APEX_LABWC_SESSION_TESTS: "1"
          WLR_BACKENDS: headless
          WLR_LIBINPUT_NO_DEVICES: "1"
        run: |
          set -euo pipefail
          rc=0; out="$(./tests/test-labwc-session.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" = 0 ] || { echo "::error::the labwc session suite exited $rc"; exit 1; }
          summary="$(printf '%s\n' "$out" | grep -E '^labwc-session: [0-9]+ passed, [0-9]+ failed, [0-9]+ skipped$' || true)"
          [ -n "$summary" ] || { echo "::error::the labwc session suite printed no summary line"; exit 1; }
          [ "$(printf '%s\n' "$summary" | wc -l)" = 1 ] || { echo "::error::more than one line looked like the summary; the parse below would read the wrong one"; exit 1; }
          counts="$(printf '%s' "$summary" | sed 's/^labwc-session: //')"
          passed="$(printf '%s' "$counts" | awk '{print $1}')"
          failed="$(printf '%s' "$counts" | awk '{print $3}')"
          skipped="$(printf '%s' "$counts" | awk '{print $5}')"
          echo "measured: passed=$passed failed=$failed skipped=$skipped"
          [ "$failed" = 0 ] || { echo "::error::$failed labwc session assertions failed"; exit 1; }
          [ "$skipped" = 0 ] || {
              echo "::error::$skipped labwc session assertions could not run ($summary). Both of this suite's skip paths — the APEX_LABWC_SESSION_TESTS opt-in and 'nowhere to render' — exit 0, so without this line a step that started no compositor at all would show a green tick"
              exit 1
          }
          [ "$passed" -ge 18 ] || { echo "::error::only $passed labwc session assertions ran; 18 ran on 2026-09-13, so some no longer execute"; exit 1; }
          if printf '%s\n' "$out" | grep -qE '^[[:space:]]*SKIP'; then
              echo "::error::the labwc session suite printed a SKIP line; the counter above is the same signal, and this catches an echo that bypasses the helper"
              exit 1
          fi

      # A local build vendors apex-shell too, and it was vendoring the WRONG
      # ONE. build-local.sh asked the remote for `refs/heads/main`
      # unconditionally while this workflow and build-image.yml had both already
      # been changed to pin the MATCHING branch — the third appearance of one
      # defect. The bill is an hour per attempt: apex-os roadmap/v2.2 built
      # against apex-shell main dies at Containerfile.base STEP 157/180 in
      # check-labwc-keybinds, on W-A-s (screen reader) and W-A-v (voice).
      #
      # The suite runs the real build-local.sh against LOCAL fixture remotes, so
      # it needs no network and builds nothing: it drives all three rungs of the
      # chain, the detached-HEAD case, an unreachable remote, and an explicit
      # APEX_SHELL_REF. Proved in both directions before landing — 25 passed
      # against the fix, 8 passed / 17 failed against the block it replaced.
      - name: build-local.sh pins the matching apex-shell branch
        if: ${{ !cancelled() }}
        run: ./tests/test-build-local-shell-ref.sh

      - name: Every suite is actually run by CI
        # `if: !cancelled()` for the reason the comment block below gives
        # about placement, read in its other direction. That block is about a
        # known-red step ABOVE the gates; the same "a skipped check counts as
        # success" shape arrives from any red step above them, known or not.
        # On run 34714159369 it did: `Run virtualization assertions` went red
        # and BOTH of these gates reported `-`, so the branch that was wiring
        # suites into CI got no runner evidence that the suite gate passed.
        # A gate a defect elsewhere in the job can switch off is not a gate.
        if: ${{ !cancelled() }}
        run: |
          # The harder half of the same defect. CI invokes suites BY NAME, so
          # writing tests/test-foo.sh, landing it, and never adding a workflow
          # line leaves a file that looks like coverage and gates nothing.
          # Measured 2026-09-12: 70 suites, 13 named in no workflow at all —
          # including tests/test-apex-lid.sh, sixty assertions for a feature the
          # owner asked for by name, which no CI run had ever executed.
          ./tests/check-suites-run-in-ci.sh

      - name: No merge conflict markers reach the tip
        # Landed after a merge replay shipped `<<<<<<<`/`=======`/`>>>>>>>` into
        # apex-shell's src/state/IpcManager.qml and a smoke script. The QML one
        # is a PARSE ERROR, so IpcManager failed to load, so every singleton
        # importing src/ failed with it and the shell did not start at all —
        # nothing branched off the tip could be run. Seconds to check, and the
        # failure it prevents costs everyone on the branch their whole tree.
        #
        # It was landed and then named in no workflow for two weeks, because
        # check-suites-run-in-ci.sh discovered `test-*.sh` only and could not
        # see a `check-*.sh` at all — the gate written to stop that recurring
        # was itself never run. Discovery now covers both patterns, which is
        # what turned this step up.
        #
        # `if: !cancelled()` for the same reason as the two steps below it: a
        # red step ABOVE these gates makes them report `-`, and a skipped check
        # reads as success.
        if: ${{ !cancelled() }}
        run: ./tests/check-no-conflict-markers.sh

      - name: Every shell script is linted, by discovery
        # `if: !cancelled()` for the reason the comment block below gives
        # about placement, read in its other direction. That block is about a
        # known-red step ABOVE the gates; the same "a skipped check counts as
        # success" shape arrives from any red step above them, known or not.
        # On run 34714159369 it did: `Run virtualization assertions` went red
        # and BOTH of these gates reported `-`, so the branch that was wiring
        # suites into CI got no runner evidence that the suite gate passed.
        # A gate a defect elsewhere in the job can switch off is not a gate.
        if: ${{ !cancelled() }}
        run: |
          # The step above lints a hand-written LIST. A list cannot cover a file
          # nobody remembered to add, and on 2026-09-12 it did not: 140 shell
          # scripts under tests/ and files/, 38 named, 102 not — including four
          # suites landed in the previous two days and both of the checkers
          # written to catch exactly this species of gap. That is the same
          # defect as a path selector naming nothing: the step runs, reports
          # success, and inspects nothing.
          #
          # This one FINDS the scripts. It lives in the engine job because the
          # engine selector — `^(files/|tests/|Containerfile|\.github/workflows/)`
          # — covers every directory it walks, so no edit to a discovered script
          # can reach `main` without this step running. Putting it anywhere else
          # would make it another instance of the bug the comments above describe.
          ./tests/check-shellcheck-coverage.sh

      # ── LAST IN THIS JOB, AND THAT PLACEMENT IS THE POINT ──────────────────
      # §16's OS-side CLI. `apex plugin` owns NO plugin rules: every verdict
      # comes from apex-shell's own src/services/plugins/manifest.js, through
      # node, because two implementations of a permission model drift and the
      # failure mode is a CLI that tells a user their plugin is fine while the
      # shell refuses it. The suite proves that differentially — it asks
      # manifest.js directly for each fixture and compares the reason code —
      # which is only meaningful because the CLI really does call that file.
      #
      # It reuses the apex-shell tree vendored earlier in this job, and it must
      # never touch the real ~/.config/apex-shell: `disable` MOVES a directory,
      # so the suite points both plugin directories at a temp tree and
      # HARD-EXITS if either resolves outside it.
      #
      # EXPECT THIS RED UNTIL apex-shell PR #9 MERGES. manifest.js is on
      # apex-shell's `p1/plugin-platform` branch and not on `main`, which is
      # what the vendor step clones — the documented merge order (the shell
      # lands before or with the OS) doing its job, exactly as it did for 5.3's
      # keybind suite on PRs #27 and #28. The suite reports it as ONE labelled
      # assertion naming PR #9 and still runs its other 62, rather than
      # refusing at the top and reporting passed=0 with a red tick.
      #
      # WHY IT IS THE LAST STEP: a failed step skips every step BELOW it in the
      # same job. Placed mid-job — where it was first written — a known-red
      # step would silently disable the bubblewrap install, the
      # privilege-request, project-layout and secret-broker suites, and the
      # ShellCheck gate above, for every PR until the shell landed. That is the
      # "a skipped check counts as success" shape this repository has been
      # bitten by, and it would have switched off the shellcheck gate on the
      # very files this branch adds. Anything expected to be red belongs at the
      # bottom of its job.
      - name: Run plugin CLI assertions
        if: ${{ !cancelled() }}
        run: ./tests/test-apex-plugin.sh

  android:
    name: Android client
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 21, not the runner's default and not the newest. AGP refuses anything
      # above 21, and this laptop's `/usr/bin/java` is OpenJDK 27-ea — which is
      # exactly why the local build sets JAVA_HOME explicitly and why CI pins it
      # here rather than inheriting whatever the image happens to ship.
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The platform AGP compiles against, installed rather than assumed. The
      # runner image ships several, and which ones move between image releases;
      # a compileSdk the image happens not to carry fails the job at
      # `assembleDebug`, minutes in.
      #
      # The `android.jar` check is not belt and braces. On the laptop this app
      # was written on, `platforms;android-35` installed BROKEN: the unzip died
      # with a DirectoryNotEmptyException and left a directory containing only
      # `package.xml`, which every tool then reported as "installed" and AGP
      # rejected with "Build properties not found". A present directory is not
      # a present platform.
      - name: Android platform 36
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?no Android SDK on this runner}}"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null
          jar="$sdk/platforms/android-36/android.jar"
          test -f "$jar" || { echo "::error::$jar is missing; the platform unpacked badly"; exit 1; }
          echo "android-36: $(stat -c%s "$jar") bytes"

      # The protocol suite first, and on its own. `:core` is a plain Kotlin/JVM
      # module with no Android plugin in it, so this step needs no SDK, no
      # device and no emulator — which is the property that makes the protocol
      # testable at all under the project's headless rule. If the SDK half of
      # this job ever breaks, this step still reports.
      - name: Protocol tests
        run: ./gradlew --no-daemon --stacktrace :core:test

      # Gradle's `test` task exits 0 when it runs NOTHING — a misconfigured
      # source set, a renamed package, a JUnit platform that failed to load —
      # and this workflow already records four occasions where something
      # skipped and the run went green. So the count is asserted, not assumed.
      - name: The protocol suite actually ran
        run: |
          set -euo pipefail
          total=0
          for xml in core/build/test-results/test/*.xml; do
            n="$(sed -n 's/.*<testsuite [^>]*tests="\([0-9]*\)".*/\1/p' "$xml" | head -1)"
            total=$((total + ${n:-0}))
          done
          echo "core: $total tests"
          # The figure at the time this job was written. A drop means tests
          # stopped running, which is the failure this step exists to catch; a
          # rise is fine and the floor moves with it.
          #
          # Moved from 87 to 295 when P1-054 and P1-055 landed the terminal,
          # the Agent Center model and the low-bandwidth suite. A floor left
          # behind is a floor that no longer floors anything: at 87, two
          # hundred tests could have stopped running and this step would still
          # have passed, which is precisely the quiet pass it exists to stop.
          #
          # 295 -> 421 with P1-056/057/058's models, P1-059's handoff rules and
          # P1-060's help parity suite.
          #
          # 421 -> 526 with android-release's protocol version window
          # (VersionWindowTest, 10) and the in-app updater (UpdatesTest, 19).
          # Measured on 2026-09-20 by running the suite and reading the figure
          # out of `core/build/test-results/test/*.xml`, not by counting `@Test`
          # annotations — a test that does not RUN is exactly what this floor
          # exists to catch, and counting the source would count it anyway.
          test "$total" -ge 526 \
            || { echo "::error::only $total protocol tests ran; expected at least 526"; exit 1; }

      # The rule InsecureStorageTest rests on. That test walks a directory and
      # accounts for every byte in it, which is evidence about app storage only
      # while AppStorage really is the only thing that writes there. A
      # preferences file or a scrollback cache would be a second place for a key
      # to land and one the walk never looks at.
      - name: App storage has exactly one writer
        run: ./tools/no-second-write-path.sh

      # The Android half. `assembleDebug` is as far as a machine with no device
      # can go: it proves the app compiles, links against `:core`, resolves
      # every AndroidX dependency and packages. It proves nothing about how the
      # app behaves, and this job does not pretend otherwise.
      - name: Assemble the debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: An APK exists
        run: |
          set -euo pipefail
          # `assembleDebug` succeeding without producing an artefact is the same
          # class of quiet pass as a suite that ran nothing.
          ls -l app/build/outputs/apk/debug/app-debug.apk

      # The JVM-testable part of `:app`. Small, and it is where the address
      # parser lives — the one piece of the Android module whose bugs are
      # invisible on a network where IPv4 happens to work.
      - name: App unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: The app suite actually ran
        run: |
          set -euo pipefail
          total=0
          for xml in app/build/test-results/testDebugUnitTest/*.xml; do
            n="$(sed -n 's/.*<testsuite [^>]*tests="\([0-9]*\)".*/\1/p' "$xml" | head -1)"
            total=$((total + ${n:-0}))
          done
          echo "app: $total tests"
          # 6 -> 10 with P1-054's start screen, 10 -> 33 with P1-056/057/058's
          # screens and P1-059/060's manifest assertions. Same reasoning as the
          # core floor above: a floor that has been overtaken stops being one.
          #
          # 33 -> 53, measured on 2026-09-20 from this module's own results
          # XML after android-release added the install-status receiver
          # assertion and `roadmap/v2.2` brought the rest.
          test "$total" -ge 53 \
            || { echo "::error::only $total app tests ran; expected at least 53"; exit 1; }

      # The guide's prose, under the same stop-slop checker the desktop's help
      # passes. It reports NOT CHECKED and exits 0 when the skill is absent,
      # which on this runner it is — so this step proves the extractor still
      # finds the guide, and does NOT prove the prose was examined. Said here
      # rather than left to be assumed from a green tick.
      - name: The guide's prose is extractable
        run: ./tools/check-help-prose.sh

      # ── Release artefacts ────────────────────────────────────────────────
      #
      # The first release build this project ever attempted found a real
      # defect: `lintVitalRelease` runs only on a release target, and it caught
      # `androidx.fragment` resolving to 1.2.5 under a FragmentActivity that
      # uses `registerForActivityResult` — a combination that mishandles every
      # activity result the app takes, including the notification permission.
      # `assembleDebug` had never said a word about it. That is the reason this
      # runs on every android change and not only on a tag.
      # THIS JOB DOES NOT SIGN, and that is a decision rather than an accident
      # of which secrets a pull request can see.
      #
      # It used to decode `APEX_KEYSTORE_BASE64` into the WORKSPACE whenever the
      # secret was visible. Nothing consumed it and nothing published it, but
      # the arrangement meant that the day the production key is set as a
      # repository secret, it would begin appearing on a runner for every push
      # and every same-repo pull request — dozens of runs a week, in the
      # checkout directory, where one `upload-artifact` of `android/` would
      # publish it. `release-android.yml` is `workflow_dispatch`-only, main-only
      # and deliberate, materialises the key under `$RUNNER_TEMP` at 0600 and
      # shreds it in an `if: always()` step.
      #
      # Losing or leaking THIS key does not mean "future releases are unsigned"
      # the way the Secure Boot key does. It means every APEX Remote install in
      # the world can never be upgraded, because Android accepts an update only
      # from the key that signed what is installed, and the owner's only escape
      # is to uninstall — which destroys their paired device key. Same
      # mechanism as Secure Boot, far worse blast radius, so the key appears in
      # exactly one workflow. docs/android-signing.md.
      - name: Build the release APK and AAB
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Plainly not signed, and no key on this runner
        run: |
          set -euo pipefail
          apk="$(ls app/build/outputs/apk/release/*.apk)"
          aab="$(ls app/build/outputs/bundle/release/*.aab)"
          ls -l "$apk" "$aab"
          # The artefacts exist and cannot be installed, and this step says
          # exactly that rather than printing a tick a reader would take for a
          # shippable build.
          echo "::notice::release artefacts built UNSIGNED (this job never signs);"\
               "they are not installable and are not a release"
          case "$apk" in
            *unsigned*) : ;;
            *) echo "::error::$apk is not named unsigned, so something signed it on a runner that must not hold the signing key"; exit 1 ;;
          esac
          # Asserted, not assumed: a keystore anywhere in the checkout is the
          # failure this job was restructured to make impossible, and an
          # assertion that only inspects the APK's name would not see it.
          # No `| head`: under `pipefail` a closed pipe makes the writer exit
          # 141 and the step fails for a reason that has nothing to do with
          # what it checks. This repository has been mis-seeded by exactly that.
          found="$(find "$GITHUB_WORKSPACE" -name '*.jks' -o -name '*.keystore' -o -name '*.p12')"
          if [ -n "$found" ]; then
            echo "::error::a keystore is present in the workspace:"; printf '%s\n' "$found"
            exit 1
          fi

      # ── The release flow itself ──────────────────────────────────────────
      #
      # `release-version.sh` is the only thing standing between a dispatch and
      # a published APK whose versionCode went backwards, and that mistake is
      # not recoverable: Android refuses to install a lower code over a higher
      # one, and the user's only escape is to uninstall — which destroys this
      # app's paired device key. So the gate is exercised on every android
      # change rather than being discovered to be broken on the day somebody
      # cuts a release.
      #
      # It runs from the repository root, not `android/`, because it builds a
      # fixture repository and invokes `tests/` and `.github/` by path. The
      # suite counts its own assertions and exits 2 if it asserted nothing.
      - name: The release flow refuses what it must
        working-directory: ${{ github.workspace }}
        run: ./tests/test-android-release.sh

      # The signing suite reads release-android.yml as YAML rather than
      # grepping it — a grep is satisfied by a comment mentioning the thing it
      # forbids, which this repository has shipped. It FATALs without PyYAML
      # rather than skipping those assertions, so the module is made certain to
      # be there: it is the only suite in the tree that needs it, and "the
      # runner image probably has it" is not something to discover in a red
      # required check.
      - name: PyYAML, for the workflow assertions
        run: python3 -c 'import yaml' || sudo apt-get install -y -qq python3-yaml

      # The other half of the same refusal: no key, or the WRONG key. This
      # suite builds a throwaway keystore and a 700-byte APK signed with it,
      # and checks the published-fingerprint gate both ways — it must accept
      # the key it published and refuse one it did not. It shreds its own key
      # material. Nothing here touches a repository secret.
      - name: The signing gates refuse what they must
        working-directory: ${{ github.workspace }}
        run: ./tests/test-android-signing.sh

  result:
    name: PR validation
    if: always()
    needs: [changes, static, rust, installer, engine, android]
    runs-on: ubuntu-24.04
    steps:
      # `skipped` counts as success HERE and only here, and the distinction is
      # worth stating because the two meanings of "skipped" are not the same
      # thing.
      #
      # A job result of `skipped` comes from this workflow's own path filters:
      # `rust`, `installer`, `engine` and `android` each carry
      # `if: needs.changes.outputs.X == 'true'`, so a documentation-only PR
      # legitimately does not run them and must not be blocked by them.
      # `changes` itself is in `needs`, so a FAILURE there is caught rather than
      # cascading into skips that pass, and `cancelled` fails the `all` too.
      #
      # What must never reach this gate is a SUITE that skipped: a script that
      # printed "0 passed, 0 failed (skipped)" and exited 0 arrives here as a
      # successful step in a successful job, and no aggregate gate can see the
      # difference. That is why the fix for it belongs in the suites — a missing
      # prerequisite is a failure there, never a skip.
      - name: Require every applicable test
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$RESULTS" \
            || { echo "One or more PR validation jobs failed or were cancelled"; exit 1; }
