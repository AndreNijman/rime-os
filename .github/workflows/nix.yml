name: Nix

# The NixOS pivot's CI (feat/nixos and its nix/* branches): evaluate the flake, build Rime's packages, and run
# every flake check that can finish on a GitHub-hosted runner without a Rime binary cache.
#
# Which checks run is not written here. nix/ci/run-checks.sh plan takes every check in the flake and removes the
# ones in nix/ci/checks-not-in-ci.txt (each with its reason), so a new check runs the day it lands. The skipped ones
# are printed as "SKIPPED <check>: <reason>" and listed in the run summary next to the ones that ran: a skip never
# reads as a pass. Every command below is a run-checks.sh call, so a local run is the same command (nix/ci/README.md).
#
# Runners: GitHub-hosted ubuntu-24.04 ONLY. Never the self-hosted `katana` runner (Andre's laptop; it also builds
# the bootc kernel). This workflow runs fork pull requests, takes no secrets and reads the repository only.
# TODO(handover): once the per-job ephemeral runners in ci/runner/ are installed on katana (label `katana-nix`,
# ci/runner/runner.conf), they become the primary for the heavy legs (the kernel checks skipped below need them or
# the binary cache), with this hosted workflow kept as the fallback. Any job moved there must carry the fork guard
# ci/runner/check-workflows.py enforces.
#
# Build once, reuse everywhere (nix/ci/README.md "Dev cache and reuse", docs/nixos/ci.md):
# - The packages job builds what many legs would otherwise each compile (nix/ci/prebuild.txt: rimed with its cargo
#   test, Rime's other packages, the desktop's overridden stock packages, COSMIC's) ONCE, and keeps the paths it built
#   (never what cache.nixos.org serves) as a zstd file:// binary cache in the Actions cache, keyed by those
#   derivations. Every leg restores it and adds it as a substituter, so a leg substitutes rimed instead of compiling
#   it. The whole /nix store is NOT cached: the legs need 5-13 GB each against a 10 GB repository cap; the dev cache
#   is the few hundred MB nothing upstream serves.
# - A check that passed is kept, keyed by its output path (= its derivation = every input), in a small rolling
#   results cache (one per ISO week). The plan job proves a prior pass with `nix path-info` on the output path it
#   just evaluated, and does not build that check again: the summary shows it as REUSED, "PASSED EARLIER, same
#   inputs, run N", never as a pass of this run. A check that did not pass is never kept.
# - Fresh run (reuse nothing): push a branch named nix/fresh-*, put the trailer "Rime-CI: fresh" in the head commit's
#   message, or run it by hand with the `fresh` input.
# - Scope (GitHub's rule): a run restores caches saved on its own branch and on the default branch (main); a pull
#   request also restores its base branch's (feat/nixos). So a new nix/* branch starts cold; a PR to feat/nixos
#   starts from feat/nixos's caches. A pull request's saves stay in that PR's merge ref, so a fork can never write a
#   cache any other run reads.
# - NEVER in a release: nix-release.yml, nix-kernel-sign.yml and build-image.yml must not touch the dev cache, the
#   results cache, or cache Nix paths in the Actions cache at all (nix/ci/check-cache-isolation.py, run by
#   checks.ci). What ships is built from source or cache.nixos.org, never from a CI cache.
# The real binary cache is still the Rime one (TODO(handover) R2, docs/nixos/updates-and-release.md).

on:
  push:
    branches: [feat/nixos, 'nix/**']
  pull_request:
    branches: [feat/nixos]
  workflow_dispatch:
    inputs:
      fresh:
        description: Reuse nothing (build every check and package again)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  # The same flake reference a local run uses (a worktree whose .git points outside the tree needs path:).
  FLAKE: path:.
  # What `run-checks.sh fresh` reads: the branch, the head commit's message (a PR's head is HEAD^2 of the merge
  # commit, hence fetch-depth 2 where it is asked) and the dispatch input.
  RIME_REF: ${{ github.head_ref || github.ref_name }}
  RIME_FRESH_INPUT: ${{ inputs.fresh || false }}

jobs:
  plan:
    name: Evaluate and plan
    runs-on: ubuntu-24.04
    # Evaluation one attribute per process (nix/ci/eval-each.sh). Hosted runner 2026-11-04: 61 light attributes in
    # 12.5 min at 3 at a time; with ~115 attributes, 4 at a time, and the ~11 GB ones (nix/ci/eval-heavy.txt) one at a
    # time after them, the estimate is ~30 min. 45 leaves room for a slow runner.
    timeout-minutes: 45
    outputs:
      run: ${{ steps.plan.outputs.run }}
      week: ${{ steps.mode.outputs.week }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
      # Nix 2.35.4, the same as the build container the checks were proven in. It authenticates GitHub fetches
      # (the nixpkgs pin) with the job's own read-only github.token, for the rate limit; no other credential.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Fresh run? Which week?
        id: mode
        run: |
          RIME_COMMIT_MSG=$(git log -1 --format=%B "$(git rev-parse -q --verify HEAD^2 || echo HEAD)")
          export RIME_COMMIT_MSG
          mode=$(nix/ci/run-checks.sh fresh)
          echo "fresh: $mode"
          echo "fresh=${mode%% *}" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # The rolling results cache: the checks that passed before, by output path. Restored even on a fresh run, so a
      # fresh failure of a check that passed on the same inputs says so (flake signal). Never written here.
      - name: Restore the results cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/rime-results
          key: rime-check-results-v1-${{ steps.mode.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rime-check-results-v1-${{ steps.mode.outputs.week }}-
      - name: Evaluate every flake output, one process each
        # Every check (the skipped kernel ones included), package and configuration, so a broken expression fails
        # here. Not `nix flake check --no-build`: one evaluator for all checks peaked at 27.9 GB and the 16 GB
        # runner killed it (exit 143). One process per attribute: the light ones peak at ~3 GB, 4 at a time (the
        # runner's core count), each started only with 5 GB available; the ones in nix/ci/eval-heavy.txt (up to
        # ~12 GB) run alone afterwards. The runner's memory, disk and biggest processes are logged every 20 s: that
        # log is how run 41720602044's lost runner was traced to release-plan + release-unit (~11 GB each) side by side.
        run: |
          ( while sleep 20; do
              printf 'RES %s mem=%s disk=%s top=%s\n' "$(date +%T)" \
                "$(free -m | awk 'NR==2 {print $3"/"$2"M avail "$7"M"}')" \
                "$(df -m / | awk 'NR==2 {print $4"M free"}')" \
                "$(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%s:%dM ", $2, $1/1024}')"
            done ) &
          mon=$!
          rc=0; RIME_EVAL_JOBS=4 RIME_EVAL_OUT="$RUNNER_TEMP/drvs.tsv" nix/ci/eval-each.sh "$FLAKE" || rc=$?
          kill "$mon" 2>/dev/null || true
          exit "$rc"
      - name: Plan the checks
        id: plan
        env:
          RIME_CHECK_DRVS: ${{ runner.temp }}/drvs.tsv
          RIME_RESULTS: ${{ runner.temp }}/rime-results
          RIME_CI_FRESH: ${{ steps.mode.outputs.fresh }}
        run: |
          nix/ci/run-checks.sh plan "$RUNNER_TEMP/plan"
          echo "run=$(cat "$RUNNER_TEMP/plan/run.json")" >> "$GITHUB_OUTPUT"
          {
            echo "### Flake checks this run skips ($(wc -l < "$RUNNER_TEMP/plan/skipped.tsv" | tr -d ' ') of $(wc -l < "$RUNNER_TEMP/plan/checks.txt" | tr -d ' '))"
            echo
            while IFS=$'\t' read -r name reason; do echo "- SKIPPED \`$name\`: $reason"; done < "$RUNNER_TEMP/plan/skipped.tsv"
            echo
            echo "### Flake checks not built again: PASSED EARLIER on the same inputs ($(wc -l < "$RUNNER_TEMP/plan/reused.tsv" | tr -d ' '))"
            echo
            while IFS=$'\t' read -r name outp run; do echo "- REUSED \`$name\`: run $run, \`$outp\`"; done < "$RUNNER_TEMP/plan/reused.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Every suite and flake check has a CI home
        run: RIME_FLAKE_CHECKS_FILE="$RUNNER_TEMP/plan/checks.txt" ./tests/check-suites-run-in-ci.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan
          path: ${{ runner.temp }}/plan
          retention-days: 7

  packages:
    name: Packages (built once, reused by every leg)
    runs-on: ubuntu-24.04
    # Cold (nothing in the dev cache): rimed (~25 min with its cargo test) and COSMIC's initial setup (~35 min) build
    # side by side on 4 cores; measured on the hosted runner, nix/ci/README.md. Warm: a few minutes.
    timeout-minutes: 100
    outputs:
      key: ${{ steps.items.outputs.key }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
      - uses: ./.github/actions/free-disk-space
        with:
          required-gb: "40"
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor. rimed's checkPhase runs its tests under
      # bubblewrap INSIDE the Nix build sandbox (nix/pkgs/rimed.nix), which needs one. This is a throwaway hosted VM.
      - name: Allow user namespaces (bubblewrap in rimed's tests)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Who may add a substituter
        # The dev cache is passed per build as `--option extra-substituters file://...?trusted=1`, which Nix honours
        # only for a trusted user (install-nix-action's set_as_trusted_user). Printed, so a change there is visible.
        run: |
          echo "runner user: $(id -un)"
          nix config show trusted-users
          nix config show require-sigs
      - name: Prove bubblewrap works inside the build sandbox
        # Seconds, and a named failure, instead of a mystery twenty minutes into rimed's checkPhase.
        run: nix build "$FLAKE#checks.x86_64-linux.ci-userns" -L --no-link
      - name: Fresh run?
        id: mode
        run: |
          RIME_COMMIT_MSG=$(git log -1 --format=%B "$(git rev-parse -q --verify HEAD^2 || echo HEAD)")
          export RIME_COMMIT_MSG
          mode=$(nix/ci/run-checks.sh fresh)
          echo "fresh: $mode"
          echo "fresh=${mode%% *}" >> "$GITHUB_OUTPUT"
      - name: Evaluate what to build once (nix/ci/prebuild.txt)
        id: items
        run: |
          nix/ci/run-checks.sh prebuild-plan "$RUNNER_TEMP/pre"
          echo "key=$(cat "$RUNNER_TEMP/pre/key")" >> "$GITHUB_OUTPUT"
      - name: Restore the dev cache
        id: restore
        if: ${{ steps.mode.outputs.fresh != '1' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/rime-dev-cache
          key: ${{ steps.items.outputs.key }}
          restore-keys: rime-dev-pkgs-v1-
      - name: Build rimed (and run its cargo test), rime-shell, rime-libexec and the rest, once
        env:
          RIME_DEV_CACHE: ${{ runner.temp }}/rime-dev-cache
          # An exact hit has nothing new to keep: realise only rimed, for its test report.
          RIME_PREBUILD_ALL: ${{ steps.restore.outputs.cache-hit == 'true' && '0' || '1' }}
        run: nix/ci/run-checks.sh prebuild "$RUNNER_TEMP/pre"
      - name: cargo test total
        if: ${{ !cancelled() }}
        env:
          RIME_DEV_CACHE: ${{ runner.temp }}/rime-dev-cache
        run: |
          nix/ci/run-checks.sh prebuild-report "$RUNNER_TEMP/pre" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo; echo '| item | this job | derivation |'; echo '|---|---|---|'
            while IFS=$'\t' read -r name state drv _; do echo "| $name | $state | \`$drv\` |"; done < "$RUNNER_TEMP/pre/status.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep what this job built (dev cache)
        if: ${{ success() && steps.restore.outputs.cache-hit != 'true' }}
        env:
          RIME_DEV_CACHE: ${{ runner.temp }}/rime-dev-cache
          RIME_RUN: ${{ github.run_id }}
        run: |
          nix/ci/run-checks.sh dev-cache-export "$RUNNER_TEMP/pre" "$RUNNER_TEMP/rime-dev-cache.new"
          rm -rf "$RUNNER_TEMP/rime-dev-cache"
          mv "$RUNNER_TEMP/rime-dev-cache.new" "$RUNNER_TEMP/rime-dev-cache"
      - name: Save the dev cache
        if: ${{ success() && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/rime-dev-cache
          key: ${{ steps.items.outputs.key }}

  check:
    name: Check ${{ matrix.check }}
    # After the packages job, so its dev cache exists; but NOT only when it succeeded: a leg whose packages job
    # failed still runs and builds what it needs itself (as every leg did before the dev cache).
    needs: [plan, packages]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run != '[]' }}
    runs-on: ubuntu-24.04
    # The build itself is stopped at RIME_CHECK_TIMEOUT (below), inside this, so a check that runs too long is
    # recorded and shown as TIMED OUT with its time; this job limit only catches a hung setup step. Each leg starts
    # from an empty store plus the dev cache; without the dev cache (packages job failed) the rimed, gaming, security
    # and rimed-session legs compile the rimed workspace before their VM, so the budget still allows for that. The
    # slowest leg measured on the hosted runner took 54 min (terminal-look; docs/nixos/ci.md): the build limit is
    # twice that.
    timeout-minutes: 125
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.run) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/free-disk-space
        with:
          required-gb: "40"
      - name: Allow user namespaces (bubblewrap in rimed's tests)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # enable_kvm (the default) installs a udev rule that opens /dev/kvm to the runner user before the daemon
      # starts, and Nix then offers the `kvm` system feature the NixOS tests require.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          enable_kvm: true
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Prove KVM
        # A NixOS test without KVM fails with "a system with features {kvm, nixos-test} is required"; this names it
        # first, and refuses to let a VM test fall back to emulation.
        run: |
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm || { echo "::error::/dev/kvm is not usable by the runner"; exit 1; }
          features=$(nix config show system-features)
          echo "system-features: $features"
          for f in kvm nixos-test; do
            case " $features " in *" $f "*) ;; *) echo "::error::Nix does not offer the $f system feature"; exit 1 ;; esac
          done
      # The packages job's dev cache (exact key), else the newest older one (its matching paths still help).
      - name: Restore the dev cache
        id: devcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/rime-dev-cache
          key: ${{ needs.packages.outputs.key || 'rime-dev-pkgs-v1-none' }}
          restore-keys: rime-dev-pkgs-v1-
      - name: Build ${{ matrix.check }}
        timeout-minutes: 115
        env:
          # 110 min; with run-checks.sh's 60 s kill grace it ends inside the step limit, so a result is recorded.
          RIME_CHECK_TIMEOUT: "6600"
          CHECK: ${{ matrix.check }}
          RIME_DEV_CACHE: ${{ runner.temp }}/rime-dev-cache
          RIME_DEV_CACHE_STATE: ${{ steps.devcache.outputs.cache-hit == 'true' && 'exact' || (steps.devcache.outputs.cache-matched-key != '' && format('fallback {0}', steps.devcache.outputs.cache-matched-key)) || 'none' }}
        run: nix/ci/run-checks.sh build "$CHECK" "$RUNNER_TEMP/results"
      - name: Keep the pass for reuse
        # Only a pass: export-result refuses anything else, and the summary refuses it again.
        if: ${{ success() }}
        env:
          CHECK: ${{ matrix.check }}
          RIME_RUN: ${{ github.run_id }}
        run: nix/ci/run-checks.sh export-result "$CHECK" "$RUNNER_TEMP/results" "$RUNNER_TEMP/results/pass"
      - name: Record the result
        if: ${{ !cancelled() }}
        env:
          CHECK: ${{ matrix.check }}
        run: |
          # No result file: the build step never ran (a setup step failed). Said as that, not as a failed check.
          if [ ! -f "$RUNNER_TEMP/results/$CHECK.result" ]; then
            mkdir -p "$RUNNER_TEMP/results"
            printf 'setup\t0\n' > "$RUNNER_TEMP/results/$CHECK.result"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: result-${{ matrix.check }}
          path: |
            ${{ runner.temp }}/results/${{ matrix.check }}.result
            ${{ runner.temp }}/results/${{ matrix.check }}.metrics.json
            ${{ runner.temp }}/results/pass
          retention-days: 7

  summary:
    name: Nix summary
    needs: [plan, packages, check]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # A failed plan job leaves no plan, and a run whose checks all failed to start leaves no results: the summary
      # below must still run and say so, not vanish with a download error.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: result-*
          merge-multiple: true
          path: ${{ runner.temp }}/results
      - name: Restore the results cache
        if: ${{ needs.plan.result == 'success' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/rime-results
          key: rime-check-results-v1-${{ needs.plan.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rime-check-results-v1-${{ needs.plan.outputs.week }}-
      - name: Every flake check, RAN or SKIPPED
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/results"
          table=$(nix/ci/run-checks.sh summary "$RUNNER_TEMP/plan" "$RUNNER_TEMP/results" 2>&1)
          rc=$?
          set -e
          [ -s "$RUNNER_TEMP/plan/checks.txt" ] || table="No plan: the plan job did not produce one, so no check is known to have run. $table"
          {
            echo "### Nix: every flake check"
            echo
            echo "$table"
            echo
            echo "Packages job: **$PACKAGES_RESULT**. Plan job: **$PLAN_RESULT**."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$table"
          if [ -f "$RUNNER_TEMP/plan/skipped.tsv" ]; then
            while IFS=$'\t' read -r name reason; do echo "SKIPPED $name: $reason"; done < "$RUNNER_TEMP/plan/skipped.tsv"
          fi
          [ "$PLAN_RESULT" = success ] || { echo "::error::the plan job did not succeed"; rc=1; }
          [ "$PACKAGES_RESULT" = success ] || { echo "::error::the packages job did not succeed"; rc=1; }
          exit "$rc"
      - name: Where the time went (metrics)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/metrics"
          cp "$RUNNER_TEMP"/results/*.metrics.json "$RUNNER_TEMP"/plan/reused/*.metrics.json "$RUNNER_TEMP/metrics/" 2>/dev/null || true
          python3 nix/ci/cihelp.py metrics-table "$RUNNER_TEMP/metrics" > "$RUNNER_TEMP/metrics/table.md"
          { echo "### Nix: where each leg's time went"; echo; cat "$RUNNER_TEMP/metrics/table.md"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: metrics
          path: ${{ runner.temp }}/metrics
          retention-days: 30
      # Keep this run's passes: only checks whose result here is pass (results-merge refuses the rest), and drop a
      # prior pass whose check failed now on the same inputs. Saved under a new key each run (caches are immutable).
      - name: Merge this run's passes into the results cache
        id: merge
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/results/pass"
          nix/ci/run-checks.sh results-merge "$RUNNER_TEMP/plan" "$RUNNER_TEMP/results" "$RUNNER_TEMP/results/pass" "$RUNNER_TEMP/rime-results" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the results cache
        if: ${{ !cancelled() && steps.merge.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/rime-results
          key: rime-check-results-v1-${{ needs.plan.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}
