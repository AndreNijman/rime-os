name: build-image

# Build, sign (cosign keyless), and push the APEX-OS images to GHCR.
#
#   core            → ghcr.io/andrenijman/apex-os:core   (heavy, slow-moving)
#   base            → ghcr.io/andrenijman/apex-os:base   (thin, per-commit)
#   the image       → ghcr.io/andrenijman/apex-os:apex
#                     …and :daily, :gaming-mesa, :gaming-nvidia, which are the
#                     SAME MANIFEST DIGEST under their old names.
#
# ═══ ONE IMAGE, AND WHY THE OLD TAGS MUST NEVER STOP RESOLVING ═══
#
# APEX published three images that were one operating system with different
# payloads. That forced a choice at install time — pick Daily on a gaming laptop
# and you had no GPU driver — so it is now a single image: NVIDIA and the
# xone/xpadneo controller modules are built and SIGNED into it (a kernel module
# cannot be installed at runtime under Secure Boot, because signing needs the MOK
# private key that never leaves CI), while Steam, gamescope, MangoHud, Sunshine
# and OBS install on demand through `apex install`.
#
# Every machine already deployed has bootc pointed at ONE of `:daily`,
# `:gaming-mesa` or `:gaming-nvidia`. A tag that stops being updated does not
# error — `bootc upgrade` simply keeps reporting "no update available" forever,
# and the machine silently stops receiving security updates. So all three are
# promoted to the same digest on every run, and the `Assert every published tag
# resolves` step below fails the run if any of them does not. Retagging (rather
# than a manifest list or a redirect) is what GHCR actually supports, costs one
# manifest write each because the blobs are already there, and needs nothing
# from the installed machines.
#
# ═══ THE THREE-TIER SPLIT, AND WHY `apex update` USED TO PULL 5.3 GB ═══
#
# Everything used to live in one `base` image. That base was gated on a path
# filter covering files/**, apexd/** and config/** — i.e. essentially every
# commit — and it built with no layer cache, so every dnf/RUN layer got a fresh
# digest even when the installed bytes were identical. bootc reuses a layer only
# when it already holds that exact digest, so a one-line shell tweak invalidated
# all of them. Measured on the author's L16 against the live registry:
#
#     $ bootc upgrade --check
#     Total new layers: 153   Size: 5.3 GB
#     Removed layers:   152   Size: 5.4 GB
#
# 153 of 153 layers, every single update. The fix is the `core` tier: the
# slow-moving ~95% of the image is built once and consumed by the base as
# FROM apex-os-core@sha256:… . A digest-pinned FROM reuses those layer
# descriptors verbatim, so bootc already has the blobs and downloads none of
# them. A normal push now rebuilds only base + flavor — tens of MiB.
#
# It is also much faster to BUILD: a flavor- or base-only push skips the ~45 min
# core entirely.
#
# ── When each tier rebuilds ──
#   core    Containerfile.core / kernel/** changed · force_core · or the weekly
#           cron found a NEW fedora-bootc digest. That last condition matters:
#           an unconditional weekly rebuild would reissue ~5 GB of
#           byte-different, content-identical layers to the whole fleet every
#           Monday, which is the very cost this split exists to remove. The
#           digest core was built from is stamped on it as a label and compared.
#   base    Containerfile.base / apexd/** / config/** / files/** changed, or
#           core rebuilt.
#   image   every run (it is thin, and it must follow the base digest).
#
# The base's immutable digest is passed to the image build as
# --build-arg BASE=<base>@<digest>, and core's as --build-arg CORE=<core>@<digest>,
# so every tier is pinned to an exact parent. Signing is keyless
# (Sigstore/Fulcio) via the runner's OIDC token.

on:
  push:
    branches: [main]
    paths:
      - "Containerfile*"
      - "files/**"
      - "apexd/**"
      - "config/**"
      - "kernel/**"
      - ".github/**"
  # ═══ WHY THE INTEGRATION BRANCH IS BUILT BY DISPATCH, NOT BY A PUSH ═══
  #
  # `push` above is main-only, and stays that way. An image build is ~1 hour and
  # several GB of runner time; paying that on every landing of an integration
  # branch buys nothing a dispatch does not, and the roadmap program lands many
  # times a day. So the integration branch is built when somebody wants to know
  # whether it builds:
  #
  #     gh workflow run build-image.yml --ref roadmap/v2.2
  #
  # That was already possible — this dispatch trigger is not new. What was
  # missing, and what made using it a bad idea, is the PUBLISH guard below: a
  # dispatch from a non-main ref used to move `:apex`, `:daily`, `:gaming-mesa`,
  # `:gaming-nvidia`, every `platform-*`, `edge`, `:core` and `:base` — i.e. ship
  # an unreviewed branch to every deployed machine. It now builds, signs and
  # verifies without touching a name anything tracks.
  #
  # NOTE, because it is not obvious and it matters: a dispatch runs the workflow
  # file FROM THE REF DISPATCHED. Dispatching a branch that predates this guard
  # runs the unguarded file.
  workflow_dispatch:
    inputs:
      build_qcow2:
        description: "Also build a qcow2 disk image (bootc-image-builder)"
        type: boolean
        default: false
      build_iso:
        description: "Build the APEX-OS installer ISO (anaconda-iso)"
        type: boolean
        default: false
      force_core:
        description: "Force a full, cache-bypassing CORE rebuild (~45 min; makes the next update a full download for every user)"
        type: boolean
        default: false
  schedule:
    # Weekly (Mon 06:00 UTC) to pick up upstream fedora-bootc / COPR / RPMFusion
    # security updates. This only rebuilds core when the upstream base image has
    # actually moved — see the gate in job 0.
    - cron: "0 6 * * 1"

concurrency:
  group: apex-image-publish
  cancel-in-progress: false

# Least privilege. id-token:write is required for cosign keyless (OIDC) signing;
# packages:write is required to push to GHCR.
permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  # ONE repository for every tier, distinguished by tag (core and base used to be
  # separate repos: apex-os-core / apex-os-base).
  #
  # HONEST NOTE ON WHY: this was done expecting the registry to skip blobs it
  # already held — a registry dedups only WITHIN a repository, so pushing :daily
  # was re-uploading ~4.7 GB of layers inherited from core while identical blobs
  # sat in apex-os-core. That expectation was WRONG, and measuring it locally
  # against a throwaway registry:2 showed why:
  #
  #   push core (zstd:chunked) ................. 99 blobs copied,  0 skipped
  #   push base into the same repo ............ 159 blobs copied,  0 skipped
  #   push the IDENTICAL core ref again ........ 99 blobs copied,  0 skipped
  #   same with skopeo, and with no --compression-format at all: 0 skipped
  #
  # Nothing is ever reused, because compressing out of containers-storage only
  # yields the blob digest AFTER compression — there is no digest to check the
  # registry for beforehand. Only a registry-to-registry copy knows its digests
  # up front and can skip, which is exactly why the tag step below is fast and
  # the main push is not.
  #
  # The consolidation is kept anyway: it costs nothing, keeps every tier's tags
  # in one place, and the user-facing tags (:daily, :gaming-mesa, :gaming-nvidia)
  # are UNCHANGED so every installed machine keeps tracking the same reference —
  # which now matters far more than it did, because those three names are the
  # ONLY thing keeping already-deployed machines updating after the collapse to a
  # single image. But it is NOT a speed optimisation, and should not be cited as one.
  IMAGE: ghcr.io/andrenijman/apex-os
  # ═══ THE ONE THING THAT SEPARATES A BUILD FROM A RELEASE ═══
  #
  # Every floating tag this workflow writes — :core, :base, :apex, :daily,
  # :gaming-mesa, :gaming-nvidia, platform-*, edge — is a name somebody else's
  # machine is tracking, or that another workflow builds FROM. Moving one is a
  # release to the fleet, and it used to happen on EVERY run of this workflow
  # from ANY ref, guarded by nothing but "did the push produce a digest".
  #
  # A non-main run now pushes and signs its per-SHA tags, which nothing tracks,
  # and moves no floating name. That is what makes `gh workflow run
  # build-image.yml --ref <branch>` a safe way to ask "does this branch build".
  PUBLISH: ${{ github.ref == 'refs/heads/main' }}
  # No CACHE_PREFIX: nothing reads or writes a registry build cache any more.
  # `--cache-to` killed two builds outright (podman "image not known" mid-push)
  # and `--cache-from` became meaningless once base stopped producing
  # intermediate layers. The ghcr.io/andrenijman/apex-os-build-cache-base
  # repository is orphaned and can be deleted in the GHCR UI.
  TAG_CORE: core
  TAG_BASE: base
  # Transitional: where core/base lived before the consolidation. The base job
  # copies core across on the first run so this does NOT force a core rebuild —
  # which would have meant 55 minutes of CI and a full ~5 GB download for every
  # machine, to change a name.
  LEGACY_CORE: ghcr.io/andrenijman/apex-os-core
  UPSTREAM_BASE: quay.io/fedora/fedora-bootc:43

jobs:
  # ── Job 0: what has to rebuild ────────────────────────────────────────────
  changes:
    runs-on: ubuntu-24.04
    # Skip on an ISO-only dispatch (installer-iso pulls the published :daily).
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_iso && !inputs.build_qcow2) }}
    outputs:
      core: ${{ steps.gate.outputs.core }}
      base: ${{ steps.filter.outputs.base }}
      shell_sha: ${{ steps.shell.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Five assertions in the Containerfiles could never pass or never run, and
      # each was found by a `base` job dying at a later step than the last -- 50
      # minutes of core build apiece, and the branch produced no image for five
      # days. This resolves those assertions back to the files in this repo that
      # become them and runs them here, in seconds, before anything is built.
      - name: Containerfile assertions
        run: ./tests/check-containerfile-assertions.sh

      # Seconds, and it guards the one line whose failure costs EVERY image
      # build: `FROM ${APEX_KERNEL_IMAGE}`. It has already broken twice — once
      # pointing at a localhost image CI cannot have, once declared where the
      # ARG was invisible to its own FROM — and each time the symptom was
      # "determining starting point for build: no FROM statement found" after
      # the toolbuilder stage. Runs BEFORE anything is built, like the line
      # above it and for the same reason.
      - name: The kernel tier is pinned, and pinned to a digest
        run: ./tests/check-kernel-image-pin.sh

      # The build CONTEXT is an input to every image, and .containerignore can
      # remove source from it without failing any COPY. `**/target/` once hid
      # apexd/apex-backup-core/src/target/, a real module, and `base` died on
      # E0583 minutes later naming neither the context nor .containerignore
      # (run 35582968952). Milliseconds, and it reads git rather than building.
      - name: .containerignore does not hide tracked source
        run: ./tests/check-containerignore-keeps-sources.sh

      # A build failure you cannot read costs the same as a build failure you
      # can, plus every round spent guessing. `core` died three times at
      # `akmods … --kmod nvidia` with no compiler error anywhere in the log,
      # because the `sed` that dumps akmods' failure log sat behind a `||` on a
      # LATER command and `set -e` had already killed the RUN. This refuses
      # that shape in seconds, before the 45-minute core build earns the right
      # to be undiagnosable again.
      - name: Every silent build driver is guarded
        run: |
          set -euo pipefail
          ./files/scripts/check-run-recovery-reachable \
              Containerfile.base Containerfile.core Containerfile.kernel \
              Containerfile.apex Containerfile.release

      - name: Pin apex-shell
        id: shell
        run: |
          set -euo pipefail
          # Pin the MATCHING branch, not main.
          #
          # This program develops both repos on roadmap/v2.2 and is forbidden
          # from pushing main until the final integration, so pinning main
          # vendored an apex-shell months behind the apex-os being built. The
          # two halves then drift, and `base` dies in check-labwc-keybinds the
          # moment this repo's rc.xml gains a keybind the old shell's defaults
          # do not generate: W-A-s (the screen reader) and W-A-v (voice), both
          # added on roadmap/v2.2 by the accessibility round. The image was
          # being assembled from two repos at different ages and nothing said
          # so.
          #
          # pr-validation.yml learned exactly this once already — its parity
          # check cloned apex-shell's DEFAULT branch and reported drift between
          # apex-os roadmap/v2.2 and apex-shell main while the two INTEGRATION
          # branches agreed perfectly. It now clones the matching branch and
          # PRINTS which one it used; so does this.
          # The fallback is ORDERED, and main is last rather than first. The
          # comment above described this failure and the code still reached
          # straight for main: on 2026-09-19 build 35447611644 died in
          # check-labwc-keybinds on task/sbom-oom -- a branch that exists only
          # in apex-os -- because main's shell publishes 68 keybind defaults
          # where the integration branch publishes 70. roadmap/v2.2's own
          # halves agree perfectly (the checker PASSES against the two repo
          # trees); the build was comparing this repo's integration branch
          # against the other repo's release branch. Any apex-os branch with no
          # apex-shell counterpart hit this, which is most of them.
          want="${GITHUB_REF_NAME}"
          sha=""; used=""
          for cand in "$want" roadmap/v2.2 main; do
            sha="$(git ls-remote https://github.com/AndreNijman/apex-shell \
                     "refs/heads/${cand}" | awk '{print $1}')"
            if [ -n "$sha" ]; then
              if [ "$cand" = "$want" ]; then used="$cand"
              else used="$cand (apex-shell has no branch named ${want})"
              fi
              break
            fi
          done
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve apex-shell ${used}"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinned apex-shell ${used}: $sha"

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core:
              - 'Containerfile.core'
              - 'kernel/**'
              # DELIBERATELY NOT build-image.yml. It was here at first, and the
              # very next CI-only commit — adding a push retry — triggered a
              # 55-minute core rebuild and reissued the whole ~5 GB image to
              # every machine on the fleet, for a change that could not affect
              # core's CONTENT by even one byte. Rebuilding core is the single
              # most expensive thing this workflow can do, so it must be driven
              # by core's actual inputs, not by edits to the file that drives it.
              #
              # The trade: a workflow change that genuinely alters how core is
              # built (a new --build-arg, a different base tag) will NOT rebuild
              # it on its own. Run the workflow with force_core=true for that —
              # an explicit action for the rare case, instead of a multi-gigabyte
              # download for the common one.
            base:
              - 'Containerfile.base'
              - 'Containerfile.apex'
              - 'apexd/**'
              - 'config/**'
              - 'files/**'
              - '.github/workflows/build-image.yml'

      # The whole point of the core tier is that it does NOT move for no reason:
      # every core rebuild is a full multi-GB download for every machine on the
      # fleet. So the weekly cron asks whether upstream actually changed instead
      # of assuming it did.
      - name: Decide whether core must rebuild
        id: gate
        run: |
          set -euo pipefail

          decide() { echo "core=$1" >> "$GITHUB_OUTPUT"; echo "core rebuild: $1 ($2)"; exit 0; }

          [ "${{ inputs.force_core }}" = "true" ] && decide true "force_core requested"
          [ "${{ steps.filter.outputs.core }}" = "true" ] && decide true "core sources changed"

          # Not a scheduled run and nothing core-relevant changed → reuse.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            decide false "no core-relevant change"
          fi

          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }

          # What upstream is at right now.
          UP="$(skopeo inspect --no-creds --format '{{.Digest}}' "docker://$UPSTREAM_BASE")"
          echo "upstream $UPSTREAM_BASE = $UP"

          # What the published core was built from. Missing image, missing label
          # or an unreadable registry all fall through to "rebuild" — failing
          # towards a rebuild is the safe direction for a security refresh.
          label='{{ index .Labels "org.apexos.fedora-bootc.digest" }}'
          creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          HAVE="$(skopeo inspect --creds "$creds" --format "$label" \
                    "docker://$IMAGE:$TAG_CORE" 2>/dev/null || echo '')"
          # Transitional fallback: before the repo consolidation core lived at
          # $LEGACY_CORE:latest. Without this the first run after the rename would
          # see "no published core", rebuild it for 55 minutes, and hand every
          # machine a full ~5 GB download — to change a name.
          if [ -z "$HAVE" ]; then
            HAVE="$(skopeo inspect --creds "$creds" --format "$label" \
                      "docker://$LEGACY_CORE:latest" 2>/dev/null || echo '')"
            [ -n "$HAVE" ] && echo "(resolved from the legacy $LEGACY_CORE)"
          fi
          echo "published core was built from = ${HAVE:-<none>}"

          [ -n "$HAVE" ] || decide true "no published core to reuse"
          [ "$HAVE" = "$UP" ] && decide false "upstream fedora-bootc has not moved since the last core"
          decide true "upstream fedora-bootc moved"

  # ── Job 1: Rust — fast gate on the apexd/apex workspace ───────────────────
  # apexd and apex are compiled INSIDE the base build, so a compile error used
  # to surface ~10 minutes into a container build with no test coverage at all
  # (the workspace has 100+ tests and CI ran none of them). This job takes ~2
  # min and blocks the base, so a broken CLI can never be published.
  rust:
    runs-on: ubuntu-24.04
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_iso && !inputs.build_qcow2) }}
    defaults:
      run:
        working-directory: apexd
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        run: rustup component add clippy

      # The same setup pr-validation.yml needs, for the same six assertions,
      # in the second workflow that runs them. apex/tests/mcp_sidecar_live.rs
      # confines a real MCP server and checks the confinement holds; APEX ships
      # bubblewrap so they pass on any APEX machine, and the GitHub runner is
      # Ubuntu and does not. Without this the rust job fails, and because
      # `base` needs `rust` and `image` needs `base`, THE IMAGE NEVER BUILDS —
      # which is how this branch went from 2026-09-07 to 2026-09-12 without a
      # single image, behind two other defects that each looked like the cause.
      #
      # Ubuntu 24.04 also ships kernel.apparmor_restrict_unprivileged_userns=1,
      # so bwrap installs and then cannot create the namespace. Relaxed for the
      # ephemeral runner and PROVEN before any test runs, so a sandbox that
      # cannot start fails here, naming the reason, rather than later as five
      # assertion failures that read like product defects.
      - name: Sandbox tooling the confinement assertions need
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          bwrap --version
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --dev-bind / / --unshare-net --unshare-user true \
            || { echo "FATAL: bwrap cannot create a user namespace on this runner"; exit 1; }
          echo "bwrap can create a user namespace"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apexd/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apexd/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # NOTE: no `cargo fmt --all --check`. The workspace has never been
      # rustfmt'd — 24 of its source files differ — so adding that gate here
      # would fail on its first run and block every image build until someone
      # reformatted the whole tree. That reformat is a real change to code
      # unrelated to this release and belongs in its own commit, made
      # deliberately. Add the step back the same day `cargo fmt --all` lands.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # Through tests/in-login-session.sh, the same wrapper pr-validation.yml
      # runs its tests under, and for the same reason — this job never got it.
      #
      # `apex-agentd` decides whether a human is at this machine from the
      # CONNECTING PEER's cgroup (`origin::classify`). A GitHub-hosted runner
      # places its processes in `/system.slice/hosted-compute-agent.service`,
      # which is neither a login session nor a user service, so the daemon
      # cannot classify the connection at all and refuses before reaching the
      # behaviour under test. Six of `apex-agentd/tests/budget.rs`'s eight
      # assertions fail that way, `cargo test` exits 101, and because `base`
      # declares `needs: [changes, rust, core]` the failure SKIPS the whole
      # image build — so this one missing wrapper is why no image can be built
      # from any branch whose head is not already green here.
      #
      # Measured rather than argued, on 2026-09-12, by reproducing the runner's
      # placement locally with a transient system-slice service running as the
      # invoking uid:
      #
      #   /system.slice/…service, unwrapped   2 passed, 6 failed
      #       "…places this connection in "/system.slice/…", which is neither
      #        a login session nor a user service…"  — CI's message exactly
      #   /system.slice/…service, wrapped     8 passed, 0 failed
      #       (the helper minted session-7.scope and the tests ran in it)
      #
      # The helper runs the command in place when it cannot mint a session, so
      # this cannot turn a legible failure into a skipped one.
      - name: Test
        run: ../tests/in-login-session.sh cargo test --locked

  # ── Job 2: core (heavy, gated) ────────────────────────────────────────────
  core:
    needs: changes
    runs-on: ubuntu-24.04
    # A bad runner must not burn the full 6h default before failing. Core builds in ~36-42 min; 120 is generous headroom, not a target.
    timeout-minutes: 120
    # The push helper tags in-registry with skopeo, which needs its own
    # credentials: `sudo podman login` is root's, and cosign's is the user's
    # docker config, neither of which skopeo picks up here.
    env:
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: ${{ needs.changes.outputs.core == 'true' }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Rootful podman: the CachyOS kernel's %posttrans (rpm-ostree
      # kernel-install → dracut) needs device access (/dev/kmsg, loop) that
      # rootless podman on the runner denies. --isolation=chroot sidesteps
      # nested cgroup setup on the runner.
      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      # cosign runs as the normal user, not under sudo, so it cannot see the
      # rootful podman auth above. Give cosign its own GHCR credential so
      # `cosign sign` can pull the digest to sign it — the packages are private.
      - name: Log in cosign to GHCR
        run: |
          cosign login "$REGISTRY" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # Stamped onto the image as a label so job 0 can tell, next Monday,
      # whether upstream has actually moved. Without it the weekly cron would
      # reissue the whole image every week regardless.
      - name: Resolve upstream fedora-bootc digest
        id: upstream
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          # --no-creds: fedora-bootc is public, so ask anonymously. Without it
          # skopeo tries to resolve credentials and dies on
          # /run/user/<uid>/containers/auth.json, which the earlier
          # `sudo podman login` created ROOT-OWNED in this job's runtime dir —
          # the same rootful/rootless split the cosign login step above exists
          # for. It has nothing to log in to here anyway.
          # Retried, because this one call decides whether an hour of build
          # happens. On 2026-09-12 it failed on a fatal from quay's CDN —
          # cdn01.quay.io returning an error for the blob behind the manifest —
          # and took `core`, and therefore `base`, `image` and `qcow2`, with it.
          # Nothing was wrong with the tree: the previous run had built `core`
          # from the same base minutes earlier. A single transient read is not a
          # reason to discard a build.
          #
          # Five attempts with a widening gap, and the LAST failure is still
          # fatal: a genuinely unreachable base must stop the build, not be
          # retried into a silent skip. The attempt number is printed so a log
          # says whether it was flaky or dead.
          D=""
          for _try in 1 2 3 4 5; do
              if D="$(skopeo inspect --no-creds --format '{{.Digest}}' \
                        "docker://$UPSTREAM_BASE" 2>&1)" && [ -n "$D" ]; then
                  echo "resolved on attempt $_try"
                  break
              fi
              echo "attempt $_try failed: $D"
              D=""
              [ "$_try" -lt 5 ] && sleep $(( _try * 10 ))
          done
          test -n "$D" || { echo "::error::could not resolve $UPSTREAM_BASE after 5 attempts"; exit 1; }
          echo "digest=$D" >> "$GITHUB_OUTPUT"
          echo "fedora-bootc digest: $D"

      # ═══ THE KERNEL TIER — resolved and proven reachable BEFORE the build ═══
      #
      # `Containerfile.core` opens with `ARG APEX_KERNEL_IMAGE=<a ghcr digest>`
      # and consumes it as `FROM ${APEX_KERNEL_IMAGE} AS kernel-rpms`. If that
      # image cannot be pulled, podman fails — which is correct and loud, and
      # deliberately so: a core that fell back to the COPR kernel would ship the
      # BTF defect the kernel tier exists to fix, and nobody would find out until
      # a sched-ext scheduler failed to load on a user's machine. There is no
      # fallback, and `tests/check-kernel-image-pin.sh` is what keeps it that way.
      #
      # What this step adds is WHEN and HOW CLEARLY it fails. Without it the
      # failure arrives after the toolbuilder stage as a pull error mentioning
      # nothing about kernels, and with `--no-cache` that is minutes of build
      # thrown away. With it, an unpublished kernel is a named error in seconds.
      #
      # The reference is parsed out of the Containerfile rather than duplicated
      # here, because two places to change is one place to forget — and the regex
      # is strict, so a typo in that line fails HERE rather than in FROM.
      - name: Resolve the kernel tier and prove it is reachable
        id: kernel
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }

          ref="$(sed -nE 's|^ARG APEX_KERNEL_IMAGE=(ghcr\.io/andrenijman/apex-os@sha256:[0-9a-f]{64})$|\1|p' Containerfile.core | head -1)"
          if [ -z "$ref" ]; then
            echo "::error::Containerfile.core's ARG APEX_KERNEL_IMAGE default is not a"
            echo "::error::ghcr.io/andrenijman/apex-os@sha256:<64 hex> digest reference."
            grep -n '^ARG APEX_KERNEL_IMAGE=' Containerfile.core || true
            exit 1
          fi
          echo "kernel tier: $ref"

          # The same five-attempt shape the fedora-bootc resolve below uses, and
          # for the same reason: one transient registry read must not discard an
          # hour of build, and the LAST failure must still be fatal.
          #
          # `sudo podman login` has already run above, but skopeo does not see
          # root's auth, so pass credentials explicitly — the package is private.
          creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          got=""
          for _try in 1 2 3 4 5; do
              if got="$(skopeo inspect --creds "$creds" --format '{{.Digest}}' \
                          "docker://$ref" 2>&1)" && [ -n "$got" ]; then
                  echo "resolved on attempt $_try"
                  break
              fi
              echo "attempt $_try failed: $got"
              got=""
              [ "$_try" -lt 5 ] && sleep $(( _try * 10 ))
          done
          if [ -z "$got" ]; then
            echo "::error::the kernel tier $ref cannot be pulled."
            echo "::error::core installs its kernel from that image and has NO fallback —"
            echo "::error::a COPR kernel would carry the BTF defect the tier exists to fix."
            echo "::error::Publish one: gh workflow run kernel-build.yml --ref <this ref>,"
            echo "::error::then paste the digest its summary prints into Containerfile.core."
            exit 1
          fi
          echo "kernel tier is reachable: $got"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Build core
        env:
          APEX_SB_KEY_B64: ${{ secrets.APEX_SB_KEY_B64 }}
          APEX_SB_CRT_B64: ${{ secrets.APEX_SB_CRT_B64 }}
          APEX_KERNEL_IMAGE: ${{ steps.kernel.outputs.ref }}
        run: |
          # ── Secure Boot signing key ──────────────────────────────────────
          # Containerfile.core signs the CachyOS kernel with the APEX MOK only
          # when these build secrets are present, and otherwise stamps the image
          # `unsigned` and carries on. CI used to pass nothing, so every image
          # ever PUBLISHED to GHCR was unsigned: anyone installing from the
          # registry could not use Secure Boot at all, and enrolling the APEX
          # key would not have helped them, because their kernel did not carry
          # its signature. Only locally-built images were signed.
          #
          # The key lives only in $RUNNER_TEMP for the length of the build,
          # 0600, and is shredded afterwards. It is never in the repo, never in
          # a build ARG (those are visible in image history), and never in the
          # image — the Containerfile takes it as --secret, which is a tmpfs
          # mount that leaves no layer behind.
          #
          # Secrets are NOT exposed to workflows triggered by pull requests from
          # forks, which is what makes this safe on a public repo. It does mean
          # the key's security is the GitHub account's security: anyone able to
          # push to main or run workflow_dispatch can use it.
          #
          # NOTE: signing now happens once here, in core, and every tier
          # inherits the signed vmlinuz. The base and flavor jobs re-verify it
          # on the artefact users actually pull.
          SECDIR="$RUNNER_TEMP/apex-sb"
          mkdir -p "$SECDIR"; chmod 700 "$SECDIR"
          SECRET_ARGS=""
          if [ -n "${APEX_SB_KEY_B64:-}" ] && [ -n "${APEX_SB_CRT_B64:-}" ]; then
            printf '%s' "$APEX_SB_KEY_B64" | base64 -d > "$SECDIR/apex-mok.key"
            printf '%s' "$APEX_SB_CRT_B64" | base64 -d > "$SECDIR/apex-mok.crt"
            chmod 600 "$SECDIR"/apex-mok.*
            # Fail now rather than ship an unsigned image because a secret was
            # pasted in mangled. Silent degradation is how this shipped unsigned
            # for weeks in the first place.
            openssl rsa  -in "$SECDIR/apex-mok.key" -noout -check >/dev/null
            openssl x509 -in "$SECDIR/apex-mok.crt" -noout        >/dev/null
            k=$(openssl rsa  -in "$SECDIR/apex-mok.key" -noout -modulus | sha256sum)
            c=$(openssl x509 -in "$SECDIR/apex-mok.crt" -noout -modulus | sha256sum)
            [ "$k" = "$c" ] || { echo "FATAL: APEX_SB_KEY_B64 and APEX_SB_CRT_B64 are not a pair"; exit 1; }
            SECRET_ARGS="--secret id=apex_sb_key,src=$SECDIR/apex-mok.key --secret id=apex_sb_crt,src=$SECDIR/apex-mok.crt"
            echo "Secure Boot: signing key present — the kernel will be signed"
          else
            echo "Secure Boot: NO signing secret configured — the kernel will be UNSIGNED"
          fi

          # --no-cache on a forced or scheduled rebuild: those are exactly the
          # runs whose purpose is to pick up new upstream content.
          NOCACHE=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.force_core }}" = "true" ]; then
            NOCACHE="--no-cache"
          fi

          # Passed explicitly even though it is also the Containerfile's default,
          # so the build log records which kernel this core actually installed
          # and the value the step above PROVED reachable is the value used.
          #
          # Asserted non-empty first, because an empty --build-arg OVERRIDES the
          # default with nothing and reproduces the exact failure this whole
          # change exists to remove: `FROM ${APEX_KERNEL_IMAGE}` expands empty
          # and podman dies with "determining starting point for build: no FROM
          # statement found".
          case "${APEX_KERNEL_IMAGE:-}" in
            ghcr.io/andrenijman/apex-os@sha256:*) : ;;
            *) echo "::error::APEX_KERNEL_IMAGE is '${APEX_KERNEL_IMAGE:-}' — the resolve step did not produce a digest"; exit 1 ;;
          esac

          sudo podman build --isolation=chroot $NOCACHE \
            --build-arg APEX_REVISION="${{ github.sha }}" \
            --build-arg FEDORA_BOOTC_DIGEST="${{ steps.upstream.outputs.digest }}" \
            --build-arg APEX_KERNEL_IMAGE="$APEX_KERNEL_IMAGE" \
            $SECRET_ARGS \
            -f Containerfile.core \
            -t "$IMAGE:$TAG_CORE-${{ github.sha }}" \
            .

          shred -u "$SECDIR"/apex-mok.* 2>/dev/null || rm -f "$SECDIR"/apex-mok.*
          rmdir "$SECDIR" 2>/dev/null || true

      # Gate the push on the core actually being usable. Everything asserted
      # here has silently shipped broken at least once: hyprland-qtutils was
      # absent for weeks because dnf dropped an unsatisfiable weak dep without
      # failing the build (apex-logs 47), and the Fedora de-branding regressed
      # the same way. A green `podman build` is not evidence the image is right.
      - name: Verify core image
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          run() { sudo podman run --rm --entrypoint /bin/sh "$IMAGE:$TAG_CORE-${{ github.sha }}" -c "$1"; }

          # hyprland-qtutils, built from source against Qt 6.10 (the packaged
          # build links Qt 6.9 private API and cannot install here).
          for b in hyprland-dialog hyprland-donate-screen hyprland-update-screen; do
            run "command -v $b >/dev/null" || fail "$b missing from core image"
          done
          run 'test -d /usr/lib64/qt6/qml/org/hyprland/style' \
            || fail "hyprland QML style not installed"
          run '! ldd /usr/bin/hyprland-dialog | grep -q "not found"' \
            || fail "hyprland-dialog has unresolved libraries"

          # De-branding: ID=fedora is deliberate (dnf copr chroots derive from it);
          # it must be the ONLY Fedora string left in os-release.
          N=$(run 'grep -ci fedora /usr/lib/os-release')
          [ "$N" = "1" ] || fail "expected exactly 1 Fedora string in os-release, found $N"
          run 'grep -q "^PRETTY_NAME=\"APEX-OS\"" /usr/lib/os-release' \
            || fail "os-release not branded"
          run 'grep -q "^APEX-OS release" /etc/system-release' \
            || fail "/etc/system-release not branded (bootupd derives the EFI label from it)"

          # Things the BASE tier can no longer install for itself, because it
          # runs no dnf at all. If any of these regress, the base build fails
          # far less legibly than this does.
          run 'test -x /usr/sbin/efibootmgr -o -x /usr/bin/efibootmgr' \
            || fail "efibootmgr missing — the Windows-boot button cannot work"
          run 'command -v plymouth-set-default-theme >/dev/null' \
            || fail "plymouth engine missing — both flavors set a theme against it"
          run 'command -v setpriv >/dev/null' \
            || fail "setpriv missing — the greeter-wallpaper helper drops privileges with it"
          run 'command -v starship >/dev/null && command -v zsh >/dev/null' \
            || fail "zsh/starship missing"
          run 'command -v matugen >/dev/null' \
            || fail "matugen missing — the shell cannot theme without it"
          run 'command -v cargo >/dev/null' \
            || fail "cargo missing — Containerfile.base compiles apexd in a stage FROM this image"

          # Secure Boot: if a signing key is configured, the published kernel
          # MUST actually carry the signature. Containerfile.core degrades to
          # "unsigned" and keeps going when signing fails or the secret is
          # absent — good for local builds, unacceptable for the artefact other
          # people install. Assert both the marker and the real PE certificate
          # table, because the marker is only a claim.
          if [ -n "${{ secrets.APEX_SB_KEY_B64 }}" ]; then
            state=$(run 'cat /usr/share/apex-os/secureboot/kernel-signed 2>/dev/null || echo missing')
            [ "$state" = signed ] \
              || fail "signing key is configured but the image is stamped '$state' — refusing to publish an unsigned kernel"
            run 'test -s /usr/share/apex-os/secureboot/apex-mok.der' \
              || fail "kernel-signed=signed but apex-mok.der is missing — users would have nothing to enrol"
            sudo podman run --rm --entrypoint /bin/sh "$IMAGE:$TAG_CORE-${{ github.sha }}" -c \
              'dnf5 -y install -q sbsigntools >/dev/null 2>&1; sbverify --list /usr/lib/modules/$(cat /usr/lib/apex-kver)/vmlinuz' \
              | grep -qi 'signature certificates\|image signature issuers\|APEX' \
              || fail "sbverify found no signature on the shipped vmlinuz"
            echo "Secure Boot: verified — the published kernel is signed and apex-mok.der ships with it"
          else
            echo "::warning::No APEX_SB_KEY_B64 secret — this image ships an UNSIGNED kernel and cannot be used with Secure Boot"
          fi

          echo "core image verified"

      # ── Push once, then tag in-registry ──────────────────────────────────
      # Two problems this solves, both measured on run 30775672845.
      #
      # 1. Every image was uploaded TWICE. `podman push :x-<sha>` followed by
      #    `podman push :x` re-sent the whole thing: 166 blobs, then 166 more,
      #    with ZERO reported as already present. ~7 minutes per image thrown
      #    away. So the friendly tag is now made with an in-registry copy, which
      #    finds every blob already there and writes only a manifest.
      # 2. Pushes fail transiently. Run 30771778274 lost a green 50-minute
      #    gaming-nvidia build to `502 Bad Gateway` eight minutes into the
      #    upload, with nothing retrying.
      - name: Push helper
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          cat > /tmp/push-retry.sh <<'SH'
          #!/usr/bin/env bash
          # push-and-tag <repo> <sha-tag> <friendly-tag> <digestfile>
          set -uo pipefail
          repo="$1"; sha_tag="$2"; friendly="$3"; digestfile="$4"
          for attempt in 1 2 3; do
            sudo podman push --compression-format zstd:chunked \
              "$repo:$sha_tag" --digestfile="$digestfile" && break
            echo "::warning::push of $repo:$sha_tag failed (attempt $attempt/3)"
            [ "$attempt" = 3 ] && { echo "::error::push failed after 3 attempts"; exit 1; }
            sleep $(( attempt * 30 ))
          done
          digest="$(cat "$digestfile")"
          # A build is not a release. The per-SHA tag above is pushed from any
          # ref; the friendly name below is what installed machines and other
          # workflows resolve, so only main may move it. See PUBLISH at the top.
          if [ "${PUBLISH:-false}" != "true" ]; then
            echo "not publishing from ${GITHUB_REF:-unknown}: pushed $repo:$sha_tag, left :$friendly where it was"
            exit 0
          fi
          # skopeo, not `podman push` again: same repository, so every blob is
          # already present and this is a manifest write. `podman push` does not
          # take that shortcut — it re-uploads.
          #
          # --creds explicitly, and REGISTRY_AUTH_FILE pointed somewhere we own:
          # `sudo podman login` leaves a root-owned auth.json in this user's
          # runtime dir, and skopeo reads it before honouring anything else.
          export REGISTRY_AUTH_FILE="${RUNNER_TEMP}/skopeo-auth.json"
          [ -f "$REGISTRY_AUTH_FILE" ] || echo '{}' > "$REGISTRY_AUTH_FILE"
          for attempt in 1 2 3; do
            skopeo copy --retry-times 3 \
              --src-creds "$GHCR_USER:$GHCR_TOKEN" \
              --dest-creds "$GHCR_USER:$GHCR_TOKEN" \
              "docker://$repo@$digest" "docker://$repo:$friendly" && exit 0
            echo "::warning::tagging $repo:$friendly failed (attempt $attempt/3)"
            [ "$attempt" = 3 ] && break
            sleep $(( attempt * 15 ))
          done
          echo "::error::could not tag $repo:$friendly"
          exit 1
          SH
          chmod +x /tmp/push-retry.sh

      - name: Push core + capture digest
        id: push
        run: |
          # zstd:chunked instead of the default gzip (apex-logs 16). Two effects,
          # neither of which changes image CONTENT — only how it is packed:
          #   - zstd compresses this tree meaningfully smaller than gzip, and
          #     decompresses several times faster, so `apex update` spends less
          #     time both downloading and unpacking.
          #   - :chunked publishes a per-layer chunk manifest.
          # Requires an OCI manifest (podman already produces one here) and a
          # client that understands zstd; the fleet is bootc 1.16+/ostree 2026.2,
          # which does. `apex rollback` remains the escape hatch.
          /tmp/push-retry.sh "$IMAGE" "$TAG_CORE-${{ github.sha }}" "$TAG_CORE" /tmp/core.digest
          DIGEST="$(cat /tmp/core.digest)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Core digest: $DIGEST"

      - name: Sign core (cosign keyless)
        run: |
          cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

  # ── Job 3: base (thin) ────────────────────────────────────────────────────
  # Runs whenever core did not FAIL, so a base-only push (core skipped) still
  # builds, resolving the last-good core digest from GHCR.
  base:
    needs: [changes, rust, core]
    if: >-
      ${{
        always() && !cancelled()
        && needs.rust.result == 'success'
        && needs.core.result != 'failure'
        && !(github.event_name == 'workflow_dispatch' && inputs.build_iso && !inputs.build_qcow2)
      }}
    runs-on: ubuntu-24.04
    # Base builds in ~3 min and pushes in ~7. 60 catches a pathological runner in ten minutes of wasted time rather than six hours of it.
    timeout-minutes: 60
    env:
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Log in cosign to GHCR
        run: |
          cosign login "$REGISTRY" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # Resolve the core digest to build FROM. If the core job ran in this
      # workflow use its output; otherwise resolve the last-good published core.
      # Failing here is FATAL and says so: on the very first run after this
      # split there is no apex-os-core:latest yet, and silently falling through
      # to an unpinned tag (or to fedora-bootc) would produce a wrong image.
      - name: Resolve core digest
        id: core
        run: |
          set -euo pipefail
          D="${{ needs.core.outputs.digest }}"
          if [ -z "$D" ]; then
            command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
            creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
            export REGISTRY_AUTH_FILE="$RUNNER_TEMP/skopeo-auth.json"
            [ -f "$REGISTRY_AUTH_FILE" ] || echo '{}' > "$REGISTRY_AUTH_FILE"

            # ONE-TIME MIGRATION. core used to live at $LEGACY_CORE:latest. Copy
            # it to $IMAGE:$TAG_CORE rather than rebuilding: a rebuild is 55
            # minutes of CI and a full ~5 GB download for every machine, to change
            # a name. Both refs are on the same registry, so this is a blob mount,
            # not a transfer.
            if ! skopeo inspect --creds "$creds" --format '{{.Digest}}' \
                   "docker://$IMAGE:$TAG_CORE" >/dev/null 2>&1; then
              echo "$IMAGE:$TAG_CORE absent — migrating from $LEGACY_CORE:latest"
              skopeo copy --retry-times 3 --src-creds "$creds" --dest-creds "$creds" \
                "docker://$LEGACY_CORE:latest" "docker://$IMAGE:$TAG_CORE" \
                || { echo "::error::No core image at $IMAGE:$TAG_CORE and none to migrate from."
                     echo "::error::Re-run this workflow with force_core=true to build one."
                     exit 1; }
            fi

            echo "Core job skipped — resolving last-good $IMAGE:$TAG_CORE"
            if ! sudo podman pull "$IMAGE:$TAG_CORE"; then
              echo "::error::Cannot pull $IMAGE:$TAG_CORE and the core job did not run."
              echo "::error::Re-run this workflow with force_core=true to build one."
              exit 1
            fi
            D="$(sudo podman image inspect "$IMAGE:$TAG_CORE" \
                  --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"
          fi
          if [ -z "$D" ]; then
            echo "::error::Resolved an empty core digest — refusing to build against an unpinned parent."
            exit 1
          fi
          echo "digest=$D" >> "$GITHUB_OUTPUT"
          echo "Using core digest: $D"

      # ── One cheap question the logs have never answered ─────────────────
      # `base` spends ~90s-4m per layer on layers whose commands take seconds,
      # and nothing has ever recorded WHY. The first suspect is the storage
      # driver: `vfs` copies the whole rootfs for every layer, which for a
      # multi-GB core parent is exactly the observed constant cost, whereas
      # `overlay` writes a diff. Two seconds to print it, and it turns the next
      # round of this investigation from inference into a reading.
      - name: Report podman storage driver
        run: |
          sudo podman info --format 'graph driver: {{.Store.GraphDriverName}}'
          sudo podman info --format 'graph root:   {{.Store.GraphRoot}}'
          sudo podman info --format 'backing fs:   {{.Store.GraphStatus.Backing_Filesystem}}'
          sudo podman info --format 'native overlay diff: {{.Store.GraphStatus.Native_Overlay_Diff}}'
          df -h /var/lib/containers 2>/dev/null || df -h /

      - name: Build base
        run: |
          # ── ONE COMMIT, NOT 102. This is what makes base finishable. ──
          #
          # `--layers=true` commits an image layer per Containerfile step, and a
          # commit on this runner costs a dead-constant 3m28s regardless of what
          # the step changed. Measured on run 33866516076, one line per layer:
          #
          #   STEP  3/120 12:09:42    STEP  7/120 12:23:30
          #   STEP  4/120 12:13:07    STEP  8/120 12:27:00
          #   STEP  5/120 12:16:33    ...
          #   STEP  6/120 12:20:00    STEP 15/120 12:51:56
          #
          # base produces 102 of its own layers, so 102 x 3m28s = 5h54m and the
          # job dies on GitHub's 6h ceiling. It did exactly that: `base`
          # cancelled at 6h01m having never reached the end of the build.
          #
          # WHY that per-commit cost is so high is NOT established. It was 22s
          # against the previous core and 3m28s against this one, for an image
          # only 11% larger (101 layers/4.73 GiB -> 107/5.26 GiB), which neither
          # size nor layer count explains, and the two figures come from
          # different runners hours apart so runner variability is not ruled
          # out. Three theories have already been wrong here; this fix
          # deliberately does not depend on a fourth. It removes 101 of the 102
          # commits, which helps whatever the cause turns out to be.
          #
          # THE PRICE, measured rather than assumed: base's own 102 layers total
          # 14.9 MiB (largest 7.0 MiB). Squashing them into one means a change
          # to any base file redownloads all ~15 MiB instead of just the layers
          # that moved. That is noise next to the 5.26 GiB core those machines
          # already have and do not re-fetch — the core/base split, which is
          # what actually keeps `apex update` small, is untouched.
          #
          # `--cache-from` goes with it: with no intermediate layers there is
          # nothing to look up, so it would be a registry round-trip per build
          # returning nothing. That retires CACHE_PREFIX too.
          #
          # ── A cache-push failure must not fail a build that made an image ──
          #
          # `--cache-to` writes intermediate layers to ghcr so the NEXT build is
          # fast. It is an optimisation, not the deliverable. podman runs it
          # inside the build command, so its failure exits 125 and takes the
          # build with it — which happened twice in a row on the final image
          # build, both times AFTER apexd, apex, apex-agentd and apex-aid had
          # compiled and been installed:
          #
          #   Error: failed pushing cache ... reading blob sha256:3c29356a...:
          #   locating image with ID "e2dd7f77...": image not known
          #
          # Measured rather than assumed: `podman build --cache-to <unreachable
          # repo>` exits 125 AND leaves the image tagged and present. So a 125
          # can be forgiven — but only after checking the image exists, never by
          # inferring it.
          #
          # This is the narrow exception AGENTS.md allows for a tolerated
          # upstream defect, with the hard postcondition it requires.
          set +e
          sudo podman build --isolation=chroot --layers=false \
            --build-arg CORE="$IMAGE@${{ steps.core.outputs.digest }}" \
            --build-arg APEX_REVISION="${{ github.sha }}" \
            --build-arg APEX_SHELL_REF="${{ needs.changes.outputs.shell_sha }}" \
            --build-arg APEX_SHELL_STRICT=1 \
            -f Containerfile.base \
            -t "$IMAGE:$TAG_BASE-${{ github.sha }}" \
            .
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            if sudo podman image exists "$IMAGE:$TAG_BASE-${{ github.sha }}"; then
              echo "::warning::podman exited $rc but the base image exists — treating it as a cache-push failure. The next build will be slower; this image is unaffected."
            else
              echo "::error::base build failed with $rc and produced no image"
              exit "$rc"
            fi
          fi

          # Unconditional: whatever podman reported, this job may not succeed
          # without the image it exists to produce.
          sudo podman image exists "$IMAGE:$TAG_BASE-${{ github.sha }}" \
            || { echo "::error::no base image after build"; exit 1; }

      - name: Verify base image
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          run() { sudo podman run --rm --entrypoint /bin/sh "$IMAGE:$TAG_BASE-${{ github.sha }}" -c "$1"; }

          # M6 + the per-user provisioner race fix.
          run 'test -x /usr/bin/apexd && test -x /usr/bin/apex' || fail "apexd/apex missing"
          run 'test -s /usr/share/apex/hypr/hyprland.lua' || fail "APEX hyprland template missing"
          run 'test -d /usr/share/apex/hypr/apex' || fail "APEX hyprland modules missing"
          run 'test -x /usr/libexec/apex-hypr-migrate' \
            || fail "apex-hypr-migrate missing; an upgraded machine would keep its hyprlang config"
          run 'grep -q CRITICAL /usr/libexec/apex-shell-firstrun' \
            || fail "provisioner is missing the config-seeding race fix"

          # ── no hyprlang compositor config, anywhere ────────────────────
          # Hyprland 0.55 deprecated hyprlang with "1-2 releases" of life left
          # and this image ships 0.56.2, so a .conf that comes back is a config
          # that stops loading on the next Hyprland bump — and comes back
          # SILENTLY, because 0.56.2 prefers hyprland.lua when both exist and
          # never reports the one it ignored.
          #
          # Scoped to the compositor. hypridle, hyprlock and the other hypr*
          # tools keep hyprlang; upstream said so, and src/config/hyprlock.conf
          # is deliberately untouched.
          run 'test ! -e /usr/share/apex/hypr/hyprland.conf' \
            || fail "a hyprlang hyprland.conf is back in the image"
          # The generators must not write one either. Their output paths are
          # read out of the scripts rather than assumed, so a rename that
          # skipped this check cannot pass it.
          run 'grep -q "hypr/apex/input.lua" /usr/libexec/apex-input-apply' \
            || fail "apex-input-apply no longer writes apex/input.lua"
          run 'grep -q "hypr/apex/monitors.lua" /usr/libexec/apex-display-apply' \
            || fail "apex-display-apply no longer writes apex/monitors.lua"
          run '! grep -qE "hypr/apex-(input|display)\.conf" \
                 /usr/libexec/apex-input-apply /usr/libexec/apex-display-apply' \
            || fail "a settings generator still writes a legacy hyprlang .conf"
          run 'test ! -e /usr/share/wayland-sessions/hyprland-uwsm.desktop' \
            || fail "hyprland-uwsm.desktop present; it sorts first and bounce-loops"

          # ── labwc as a third user session ──────────────────────────────
          # The stock labwc.desktop must stay deleted: it launches labwc bare,
          # with no APEX Shell and no config, and labwc is simultaneously the
          # greeter's fallback HOST compositor, so offering the stock entry is a
          # login hazard. Ours is a separate file.
          run 'test -e /usr/share/wayland-sessions/apex-labwc.desktop' \
            || fail "apex-labwc.desktop missing; labwc session not offered"
          run 'test ! -e /usr/share/wayland-sessions/labwc.desktop' \
            || fail "stock labwc.desktop present; it starts labwc with no shell"
          run 'command -v labwc >/dev/null' \
            || fail "labwc binary missing but a labwc session is offered"
          # labwc has no IPC socket, so zwlr-output-power-management-v1 (wlopm)
          # is the only way the idle timer can turn the display off there. The
          # listener used to fire into nothing and report success.
          run 'command -v wlopm >/dev/null' \
            || fail "wlopm missing; idle screen-off is a silent no-op on the labwc session"

          # The session is worthless without its config: labwc has no IPC, so
          # everything the compositor does for the shell is declared in rc.xml
          # up front, and a missing or malformed file yields a bare grey screen.
          for f in rc.xml menu.xml autostart environment; do
            run "test -s /usr/share/apex/labwc/$f" \
              || fail "labwc template $f missing from the image"
          done
          run 'xmllint --noout /usr/share/apex/labwc/rc.xml' \
            || fail "labwc rc.xml is not well-formed; labwc would silently use defaults"
          run 'grep -q apex-shell-autostart /usr/share/apex/labwc/autostart' \
            || fail "labwc autostart does not start APEX Shell"
          run 'grep -q "^XDG_CURRENT_DESKTOP=labwc" /usr/share/apex/labwc/environment' \
            || fail "labwc environment does not identify the compositor to the shell"

          # ── apex shell wrapper ─────────────────────────────────────────
          # The labwc keybinds and root menu invoke `apex shell <verb>`. If that
          # verb is missing, or qs is not installed, every popup binding in the
          # session is a silent no-op that looks like a broken keyboard.
          run 'apex shell list >/dev/null' \
            || fail "apex shell is missing; labwc keybinds would silently do nothing"
          run 'command -v qs >/dev/null' \
            || fail "qs missing; apex shell has nothing to call"
          run 'grep -q "apex shell" /usr/share/apex/labwc/rc.xml' \
            || fail "labwc rc.xml no longer uses apex shell"
          # A read-only session verb must not have become root-only.
          run 'apex shell list >/dev/null' \
            || fail "apex shell list requires privileges it should not need"
          # labwc is the only authority on whether an action name and its
          # arguments are real: xmllint cannot know that `Focus` takes no
          # `direction`, and labwc answers a bad action by logging it and
          # carrying on with that binding silently dropped.
          #
          # It parses rc.xml BEFORE trying to open a backend, so this works in a
          # container with no seat and no display — verified: an invalid action
          # still reports, and a valid config prints nothing at all. The
          # non-zero exit from failing to start a compositor is expected and
          # deliberately ignored; only config diagnostics are inspected.
          run 'out=$(labwc -C /usr/share/apex/labwc 2>&1 || true); \
               ! printf "%s\n" "$out" | grep -qiE "invalid argument for action|invalid action|unexpected element"' \
            || fail "labwc rejected something in rc.xml; that binding would be silently dropped"

          # ── portal backends, per session, BY NAME ──────────────────────
          # Screen sharing, file pickers and screenshots all route through
          # portals, so a session whose backends are decided by resolution order
          # is a user-visible failure that looks like flakiness. niri shipped for
          # three releases with no APEX configuration at all — its packaged
          # `default=gnome;gtk` handed FileChooser to the GNOME implementation
          # while labwc and Hyprland both reached gtk — and no assertion here
          # could see it, because nothing enumerated the other sessions.
          #
          # portals.conf(5) looks up xdg-desktop-portal/<desktop>-portals.conf
          # for each name in XDG_CURRENT_DESKTOP, lower-cased, /etc before
          # /usr/share. So the check is per DESKTOP NAME, not per file.
          for d in hyprland niri labwc; do
            out=$(run "c=; for p in /etc/xdg-desktop-portal/$d-portals.conf /usr/share/xdg-desktop-portal/$d-portals.conf; do if [ -s \"\$p\" ]; then c=\$p; break; fi; done; [ -n \"\$c\" ] || exit 1; echo \"\$c\"; grep -qE '^[[:space:]]*default=.*[*]' \"\$c\" && exit 2; exit 0") \
              || fail "$d has no portals.conf, or resolves its backends through a wildcard (got: $out)"
            echo "portals: $d -> $out"
          done
          # The two APEX pins specifically, so a silent revert to the packaged
          # file fails rather than passing the loop above.
          run 'grep -qE "^default=gtk$" /etc/xdg-desktop-portal/labwc-portals.conf' \
            || fail "labwc portal config lost its gtk pin"
          run 'grep -qE "^default=gtk;gnome$" /etc/xdg-desktop-portal/niri-portals.conf' \
            || fail "niri portal config lost its gtk-first ordering"
          # niri drives capture through the Mutter API, so the gnome backend is
          # not interchangeable with the wlroots one labwc uses.
          run 'grep -qE "^org\.freedesktop\.impl\.portal\.ScreenCast=gnome$" /etc/xdg-desktop-portal/niri-portals.conf' \
            || fail "niri ScreenCast is no longer pinned to the gnome backend"
          run 'test -x /usr/libexec/xdg-desktop-portal-gnome' \
            || fail "xdg-desktop-portal-gnome missing; the niri session would have no screen sharing"
          # The filename is only matched because the session announces this name.
          run 'grep -q "^DesktopNames=niri$" /usr/share/wayland-sessions/niri.desktop' \
            || fail "niri.desktop no longer announces DesktopNames=niri; niri-portals.conf is inert"

          # The power menu and the idle timer both source apex-shell's
          # src/scripts/compositor.sh and run every action through its
          # apex_run(). A vendored tree that has the source line but not the
          # file is a power menu where nothing works at all — worse than the
          # labwc no-ops the adapter exists to fix, and silent.
          run 'P=/usr/share/apex-shell/src/scripts/PowerControl.sh;
               grep -qE "^[[:space:]]*\.[[:space:]].*compositor\.sh" "$P" || exit 0;
               test -s /usr/share/apex-shell/src/scripts/compositor.sh' \
            || fail "apex-shell sources compositor.sh but the vendored tree has no such file"

          # The greeter must tolerate NVIDIA: sway exits(1) on nvidia-drm without
          # this flag, which means no login at all on a hybrid-graphics machine.
          run 'grep -q -- --unsupported-gpu /etc/greetd/config.toml' \
            || fail "greeter missing --unsupported-gpu"

          # `apex update` must refuse to run unprivileged, with a message that
          # names sudo. The container runs as root, so assert the refusal by
          # dropping to a non-root uid — testing it as root would prove nothing.
          out=$(sudo podman run --rm --user 1000:1000 --entrypoint /bin/sh \
                  "$IMAGE:$TAG_BASE-${{ github.sha }}" -c 'apex update --check 2>&1' || true)
          echo "$out" | grep -q 'sudo apex update --check' \
            || fail "apex update does not tell an unprivileged caller to use sudo (got: $out)"
          # …and the verbs the desktop drives as the session user must NOT be gated.
          run 'apex tier >/dev/null' \
            || fail "apex tier broke — APEX Shell's power tab calls it as the session user"

          # The package engine is a shell script, so a broken code path shows up
          # only when a user runs it. These assert, in the image that will
          # actually ship, that `apex install` advertises the local-.rpm form and
          # enforces it — the advertisement matters because a feature nobody can
          # discover is not shipped, and the refusal matters because it is the
          # step that runs before anything is copied into /var.
          run 'apex install --help | grep -q "\.rpm"' \
            || fail "apex install --help does not mention installing a local .rpm file"
          run 'apex install --help | grep -q allow-unsigned' \
            || fail "apex install --help does not offer the unverified-RPM opt-in"
          run '/usr/libexec/apex-pkg --help | grep -q allow-unsigned' \
            || fail "apex-pkg --help does not mention --allow-unsigned"
          # The container is root, so this reaches the engine's real argument
          # handling. It must refuse by name and exit non-zero without creating
          # any state — a silent success here would mean a rebuild later failing
          # on a cached file that was never written.
          out=$(run '/usr/libexec/apex-pkg install /nonexistent/apex-ci.rpm 2>&1; echo "rc=$?"')
          grep -q 'no such file: /nonexistent/apex-ci.rpm' <<<"$out" \
            || fail "apex-pkg does not refuse a missing .rpm path by name (got: $out)"
          grep -q 'rc=1' <<<"$out" \
            || fail "apex-pkg exits 0 on a missing .rpm path (got: $out)"
          # A reverse-DNS id ending in .rpm is a FILE, not a Flatpak. Getting this
          # order wrong sends a file the user pointed at to Flathub.
          run '/usr/libexec/apex-pkg install org.foo.Bar.rpm 2>&1 | grep -q "no such file"' \
            || fail "apex-pkg routes org.foo.Bar.rpm to Flatpak instead of treating it as a file"
          run 'test ! -e /var/lib/apex/pkg/requested' \
            || fail "a refused install wrote to the requested list"
          # The dependency resolution for a local file is the one thing that is
          # neither rpm nor a shell builtin; losing it would break only that path.
          run 'dnf5 repoquery --installed --whatprovides bash --qf "%{name}\n" | grep -q bash' \
            || fail "dnf5 repoquery --installed --whatprovides is unavailable — local .rpm dependency resolution would fail"

          # Greeter wallpaper: the helper, its sudoers rule, and both ends of the
          # wiring. This is the fix for "the lock screen keeps the default
          # wallpaper", and every part of it is silently skippable at runtime,
          # so it is asserted at build time instead.
          run 'test -x /usr/libexec/apex-greet-wallpaper' \
            || fail "greeter wallpaper helper missing"
          run 'test -f /etc/sudoers.d/030-apex-greet-wallpaper' \
            || fail "greeter wallpaper sudoers rule missing"
          run 'visudo -cf /etc/sudoers.d/030-apex-greet-wallpaper >/dev/null' \
            || fail "greeter wallpaper sudoers rule does not parse — sudo would refuse it at runtime"
          run 'grep -q "apex-greet/wallpapers" /usr/share/apex-greet/GreetContext.qml' \
            || fail "greeter no longer reads the published wallpaper"
          run '! grep -q "file:///usr/share/backgrounds/apex/default.jpg" /usr/share/apex-greet/GreetSurface.qml' \
            || fail "GreetSurface has gone back to the hardcoded default wallpaper"
          run 'grep -q apex-greet-wallpaper /usr/share/apex-shell/src/services/WallpaperService.qml' \
            || fail "vendored apex-shell does not publish the wallpaper on change"
          run 'grep -q apex-greet-wallpaper /usr/libexec/apex-shell-autostart' \
            || fail "session launcher does not publish the wallpaper on login"

          # Secure Boot, re-asserted on the tier that inherits it. The core job
          # is gated, so a push touching only files/** rebuilds this image FROM
          # THE LAST PUBLISHED CORE — if that core were unsigned, an unsigned
          # base would ship and core's assertion would never have run.
          if [ -n "${{ secrets.APEX_SB_KEY_B64 }}" ]; then
            state=$(run 'cat /usr/share/apex-os/secureboot/kernel-signed 2>/dev/null || echo missing')
            [ "$state" = signed ] \
              || fail "base is stamped '$state' — the core it was built from is not signed. Re-run with force_core=true."
          fi

          echo "base image verified"

      # ── Push once, then tag in-registry ──────────────────────────────────
      # Two problems this solves, both measured on run 30775672845.
      #
      # 1. Every image was uploaded TWICE. `podman push :x-<sha>` followed by
      #    `podman push :x` re-sent the whole thing: 166 blobs, then 166 more,
      #    with ZERO reported as already present. ~7 minutes per image thrown
      #    away. So the friendly tag is now made with an in-registry copy, which
      #    finds every blob already there and writes only a manifest.
      # 2. Pushes fail transiently. Run 30771778274 lost a green 50-minute
      #    gaming-nvidia build to `502 Bad Gateway` eight minutes into the
      #    upload, with nothing retrying.
      - name: Push helper
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          cat > /tmp/push-retry.sh <<'SH'
          #!/usr/bin/env bash
          # push-and-tag <repo> <sha-tag> <friendly-tag> <digestfile>
          set -uo pipefail
          repo="$1"; sha_tag="$2"; friendly="$3"; digestfile="$4"
          for attempt in 1 2 3; do
            sudo podman push --compression-format zstd:chunked \
              "$repo:$sha_tag" --digestfile="$digestfile" && break
            echo "::warning::push of $repo:$sha_tag failed (attempt $attempt/3)"
            [ "$attempt" = 3 ] && { echo "::error::push failed after 3 attempts"; exit 1; }
            sleep $(( attempt * 30 ))
          done
          digest="$(cat "$digestfile")"
          # A build is not a release. The per-SHA tag above is pushed from any
          # ref; the friendly name below is what installed machines and other
          # workflows resolve, so only main may move it. See PUBLISH at the top.
          if [ "${PUBLISH:-false}" != "true" ]; then
            echo "not publishing from ${GITHUB_REF:-unknown}: pushed $repo:$sha_tag, left :$friendly where it was"
            exit 0
          fi
          # skopeo, not `podman push` again: same repository, so every blob is
          # already present and this is a manifest write. `podman push` does not
          # take that shortcut — it re-uploads.
          #
          # --creds explicitly, and REGISTRY_AUTH_FILE pointed somewhere we own:
          # `sudo podman login` leaves a root-owned auth.json in this user's
          # runtime dir, and skopeo reads it before honouring anything else.
          export REGISTRY_AUTH_FILE="${RUNNER_TEMP}/skopeo-auth.json"
          [ -f "$REGISTRY_AUTH_FILE" ] || echo '{}' > "$REGISTRY_AUTH_FILE"
          for attempt in 1 2 3; do
            skopeo copy --retry-times 3 \
              --src-creds "$GHCR_USER:$GHCR_TOKEN" \
              --dest-creds "$GHCR_USER:$GHCR_TOKEN" \
              "docker://$repo@$digest" "docker://$repo:$friendly" && exit 0
            echo "::warning::tagging $repo:$friendly failed (attempt $attempt/3)"
            [ "$attempt" = 3 ] && break
            sleep $(( attempt * 15 ))
          done
          echo "::error::could not tag $repo:$friendly"
          exit 1
          SH
          chmod +x /tmp/push-retry.sh

      - name: Push base + capture digest
        id: push
        run: |
          /tmp/push-retry.sh "$IMAGE" "$TAG_BASE-${{ github.sha }}" "$TAG_BASE" /tmp/base.digest
          DIGEST="$(cat /tmp/base.digest)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Base digest: $DIGEST"

      - name: Sign base (cosign keyless)
        run: |
          cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

  # ── Job 4: flavors ────────────────────────────────────────────────────────
  # ── Job 4: THE image ──────────────────────────────────────────────────────
  # Was a three-leg matrix (daily / gaming-mesa / gaming-nvidia). There is one
  # image now, so there is one job, and the three old names are applied to its
  # digest as tags in the promotion step below.
  image:
    needs: [base]
    if: >-
      ${{
        always() && !cancelled()
        && needs.base.result == 'success'
        && !(github.event_name == 'workflow_dispatch' && inputs.build_iso && !inputs.build_qcow2)
      }}
    runs-on: ubuntu-24.04
    # Image build + push + four-tag promotion. Same reasoning as base: fail fast on a bad runner instead of at the 6h ceiling.
    timeout-minutes: 90
    # The `secrets` context is NOT available in a step-level `if:` — only in
    # job-level env — so surface "is signing configured?" as a plain boolean
    # here and let the verify step below branch on it. Without this the step
    # would silently evaluate to false and never run, which is precisely the
    # class of quietly-skipped check it exists to prevent.
    env:
      APEX_SB_CONFIGURED: ${{ secrets.APEX_SB_KEY_B64 != '' }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Log in cosign to GHCR
        run: |
          cosign login "$REGISTRY" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # FROM the base pinned by digest — the exact base job 3 pushed and signed.
      - name: Build the image
        run: |
          # --layers=false for the same reason as the base job: a per-step
          # commit costs minutes on this runner regardless of what the step
          # changed. Containerfile.apex is only 12 steps so it was survivable
          # rather than fatal, but it is still minutes of nothing.
          sudo podman build --isolation=chroot --layers=false \
            --build-arg BASE="$IMAGE@${{ needs.base.outputs.digest }}" \
            --build-arg APEX_REVISION="${{ github.sha }}" \
            -f Containerfile.apex \
            -t "$IMAGE:apex" \
            -t "$IMAGE:apex-${{ github.sha }}" \
            .

      # Gate the PUSH on the image actually carrying a signed kernel AND signed
      # out-of-tree modules.
      #
      # The module half is new, and it closes a real hole: the NVIDIA akmod used
      # to be built in Containerfile.gaming, i.e. in the FLAVOR job — which is
      # never passed `--secret id=apex_sb_key`, so nothing could have signed it
      # there and nothing did. This check ran `sbverify` against vmlinuz only, so
      # nothing caught it either. Both halves are now measured against the built
      # artifact: the marker file is read, and then ignored in favour of the
      # signature actually present in the kernel image and in every module.
      - name: Verify the Secure Boot chain (kernel AND modules)
        if: ${{ env.APEX_SB_CONFIGURED == 'true' }}
        run: |
          set -euo pipefail
          state=$(sudo podman run --rm --entrypoint /bin/sh "$IMAGE:apex" \
                    -c 'cat /usr/share/apex-os/secureboot/kernel-signed 2>/dev/null || echo missing')
          if [ "$state" != signed ]; then
            echo "::error::the image is stamped '$state' — refusing to publish an unsigned kernel."
            echo "::error::The core it was built from is not signed. Re-run with force_core=true."
            exit 1
          fi
          sudo podman run --rm --entrypoint /bin/sh "$IMAGE:apex" -c \
            'dnf5 -y install -q sbsigntools >/dev/null 2>&1; sbverify --list /usr/lib/modules/$(cat /usr/lib/apex-kver)/vmlinuz' \
            | grep -qi 'signature certificates\|image signature issuers\|APEX' \
            || { echo "::error::sbverify found no signature on the shipped vmlinuz"; exit 1; }
          sudo podman run --rm --entrypoint /bin/sh "$IMAGE:apex" \
            -c 'test -s /usr/share/apex-os/secureboot/apex-mok.der' \
            || { echo "::error::no apex-mok.der — users would have nothing to enrol"; exit 1; }

          # Out-of-tree modules. Written so it CANNOT pass on an empty set: a
          # loop over zero modules succeeds, and "there were no modules" is the
          # exact failure this exists to catch.
          sudo podman run --rm --entrypoint /bin/sh "$IMAGE:apex" -c '
            set -eu
            KVER=$(cat /usr/lib/apex-kver)
            MODDIR=/usr/lib/modules/$KVER
            [ "$(cat /usr/share/apex-os/secureboot/modules-signed 2>/dev/null || echo missing)" = signed ] \
              || { echo "modules-signed marker is not \"signed\""; exit 1; }
            SIGNER=$(cat /usr/share/apex-os/secureboot/module-signer)
            OOT=""
            for d in extra updates; do [ -d "$MODDIR/$d" ] && OOT="$OOT $MODDIR/$d"; done
            [ -n "$OOT" ] || { echo "no out-of-tree module directory"; exit 1; }
            n=0
            for m in $(find $OOT -type f -name "*.ko*"); do
              got=$(modinfo -F signer "$m" 2>/dev/null || true)
              [ "$got" = "$SIGNER" ] || { echo "$m signer=\"$got\" expected=\"$SIGNER\""; exit 1; }
              n=$((n + 1))
            done
            [ "$n" -gt 0 ] || { echo "zero out-of-tree modules found — vacuous pass"; exit 1; }
            for pat in nvidia xone xpadneo; do
              [ "$(find $OOT -type f -name "*$pat*.ko*" | wc -l)" -gt 0 ] \
                || { echo "no $pat module in the image"; exit 1; }
            done
            echo "modules: $n out-of-tree, all signed by \"$SIGNER\""
          ' || { echo "::error::out-of-tree kernel modules are unsigned, missing, or signed by the wrong key"; exit 1; }
          echo "kernel and modules signed; apex-mok.der present"

      # The payload split is a product promise, so it is checked rather than
      # assumed: the drivers a user cannot install themselves must be present,
      # and the userspace they can install must NOT be baked in (baking it would
      # quietly undo the whole point of collapsing the editions).
      - name: Verify the payload split
        run: |
          set -euo pipefail
          sudo podman run --rm --entrypoint /bin/sh "$IMAGE:apex" -c '
            set -eu
            for b in gamescope steam mangohud sunshine obs; do
              ! command -v "$b" >/dev/null 2>&1 || { echo "$b is baked in; it must be on-demand"; exit 1; }
            done
            test -e /usr/lib64/libGLX_nvidia.so.0 || { echo "nvidia userspace missing"; exit 1; }
            test -e /usr/lib64/libGLX_mesa.so.0   || { echo "mesa GLX missing"; exit 1; }
            test -e /usr/lib64/libEGL_mesa.so.0   || { echo "mesa EGL missing"; exit 1; }
            owner=$(rpm -qf --qf "%{NAME}" /usr/lib64/libGL.so.1)
            case "$owner" in libglvnd*) ;; *) echo "libGL.so.1 owned by $owner, not libglvnd"; exit 1 ;; esac
            grep -q "^VARIANT_ID=apex$" /usr/lib/os-release || { echo "VARIANT_ID is not apex"; exit 1; }
            echo "payload split OK: drivers in, gaming userspace out, glvnd intact"
          '

      # ── Push once, then tag in-registry ──────────────────────────────────
      # Two problems this solves, both measured on run 30775672845.
      #
      # 1. Every image was uploaded TWICE. `podman push :x-<sha>` followed by
      #    `podman push :x` re-sent the whole thing: 166 blobs, then 166 more,
      #    with ZERO reported as already present. ~7 minutes per image thrown
      #    away. So the friendly tag is now made with an in-registry copy, which
      #    finds every blob already there and writes only a manifest.
      # 2. Pushes fail transiently. Run 30771778274 lost a green 50-minute
      #    gaming-nvidia build to `502 Bad Gateway` eight minutes into the
      #    upload, with nothing retrying.
      - name: Push helper
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          cat > /tmp/push-retry.sh <<'SH'
          #!/usr/bin/env bash
          # push-image <repo> <sha-tag> <digestfile>
          set -euo pipefail
          repo="$1"; sha_tag="$2"; digestfile="$3"
          rm -f "$digestfile"
          for attempt in 1 2 3; do
            sudo podman push --compression-format zstd:chunked \
              "$repo:$sha_tag" --digestfile="$digestfile" && break
            echo "::warning::push of $repo:$sha_tag failed (attempt $attempt/3)"
            [ "$attempt" = 3 ] && { echo "::error::push failed after 3 attempts"; exit 1; }
            sleep $(( attempt * 30 ))
          done
          test -s "$digestfile"
          SH
          chmod +x /tmp/push-retry.sh

      - name: Push the image + capture digest
        id: push
        run: |
          # zstd:chunked — see the note on the core push. This is the one users
          # actually pull, so it is where the download saving lands.
          /tmp/push-retry.sh "$IMAGE" "apex-${{ github.sha }}" /tmp/image.digest
          DIGEST="$(cat /tmp/image.digest)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image digest: $DIGEST"

      - name: Sign the image (cosign keyless)
        if: ${{ steps.push.outputs.digest != '' }}
        run: |
          cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

      # ── SBOM, and why only on this image ────────────────────────────────────
      # A signature says the bytes came from this pipeline. It says nothing
      # about what is inside them, which is the question anyone asks after a CVE
      # lands: is this machine affected. Until now there was no answer that did
      # not involve booting the image and running rpm.
      #
      # Attached to `apex` alone rather than to core and base as well. This is
      # the digest every machine actually pulls; core and base are build tiers
      # nobody boots, and their contents are a strict subset of this one, so two
      # more SBOMs would be two more things to keep honest for no extra answer.
      #
      # `cosign attest` rather than `cosign attach sbom`: attach is deprecated
      # upstream and produces an unsigned blob, which is the wrong shape for a
      # provenance claim. An attestation is signed by the same keyless identity
      # as the image, so one `cosign verify-attestation` answers both "who built
      # it" and "what is in it".
      # ══════════════════════════════════════════════════════════════════════
      # The rationale for the step below lives here rather than inside its
      # `run:` script: GitHub caps a run block at 21,000 characters and this
      # one hit the cap on 2026-09-20, which shows up as a workflow that will
      # not parse and a dispatch refused with HTTP 422, not as a failing step.
      # ══════════════════════════════════════════════════════════════════════
      #
      # PINNED, and it has to stay pinned. The GOMEMLIMIT below is not a
      # guess: it is the one variable that separated success from failure
      # across seven probe arms, all run against syft 1.52.0. Floating this
      # to whatever `main` installs today would leave a measured fix
      # protecting an unmeasured binary — syft's memory profile is the
      # thing being controlled here, and it moves between releases.
      # Bumping the version means re-running the probe, not hoping.
      #
      # This step died twice on the first build this branch ever completed:
      # once as "the runner has received a shutdown signal" and once as a
      # bare exit 143, four and a half minutes after syft printed its
      # version and with no output of its own. Everything before it —
      # build, Secure Boot chain, payload split, push, cosign signature —
      # was green both times.
      #
      # By this point the runner holds core, base and the final image in
      # local podman storage, and syft is about to pull the whole image out
      # of the registry AGAIN into its own cache. The local copies are dead
      # weight: the image is pushed and signed, and the promote step below
      # is skopeo registry-to-registry and never reads local storage. So
      # they go, and the numbers are printed either side — if this fails a
      # third time, the log will say whether it was disk or memory instead
      # of leaving the next person to guess.
      #
      # Read the image out of the registry rather than local storage: the
      # push above is the artefact users get, and a local-storage read could
      # describe something the registry does not have.
      #
      # Under `timeout` so a hang is reported as a hang. A bare 143 from a
      # killed process reads as "something went wrong somewhere", which is
      # exactly how this cost two builds.
      # 45 minutes, raised from 15 on 2026-09-12 after a run that was NOT
      # short of resources: 86 GB free and 14.8 GB of memory available at
      # the prune, and syft still ran the full fifteen and was killed.
      #
      # ═══ GOMEMLIMIT IS THE FIX, AND EVERY OTHER THEORY HERE WAS WRONG ═══
      #
      # Measured 2026-09-19, probe run 35437908023 (.github/workflows/
      # sbom-probe.yml): seven arms, same syft 1.52.0, same runner class,
      # all against the digest a failing build had already pushed. One
      # variable separated every success from every failure.
      #
      #   no GOMEMLIMIT, registry:, par 4   died — 15866M used, swap full
      #   no GOMEMLIMIT, registry:, par 1   died — 15918M used, swap full
      #   no GOMEMLIMIT, oci-dir:,  par 4   died — 15967M used, swap full
      #   no GOMEMLIMIT, oci-dir: decompressed   died — rc 143
      #   GOMEMLIMIT=10GiB, registry:       rc=0, 904s, 9830 packages
      #   GOMEMLIMIT=10GiB, oci-dir:        rc=0, 735s, 9830 packages
      #
      # So, stated because each of these was believed here and each is
      # false:
      #
      #  - It is NOT the registry source. Reading from an OCI layout
      #    already on local disk died identically. The layers are on disk
      #    either way — /tmp grows to 14.7 GB and THEN memory climbs another
      #    4 GB. The cost tracks the file count through the filetree squash
      #    and MIME pass (anchore/syft#2159), not where the bytes came from.
      #  - It is NOT compression. The `--dest-decompress` arm died too.
      #  - It is NOT parallelism, and this is the one that cost real time:
      #    par 1 died the same way, so the "ran the full fifteen minutes and
      #    was killed by the timeout" run that justified raising the timeout
      #    to 45 was ALSO a memory death. The raise fixed nothing. It stays
      #    only because 904s is now the measured figure and 15 min is too
      #    close to it; it is not, and never was, the guard against this.
      #
      # Why a soft limit works when the box has 16 GB: Go's default GOGC=100
      # lets the heap reach ~2x live before collecting, so the peak here is
      # largely garbage. GOMEMLIMIT trades CPU for it and restricts no
      # cataloguer — the SBOM is byte-for-byte the same 9830 packages, both
      # Electron trees included.
      #
      # HONEST ABOUT THE MARGIN: the limit is SOFT. In the probes peak RSS
      # was 14.65 GiB with it set to 10GiB on a 16 GB runner, surviving with
      # 188 MB to spare. VERIFIED IN A REAL BUILD (run 35450175806,
      # 2026-09-19): syft catalogued the image in 742 s, peak RSS
      # 15,303,652 KB, 9830 packages, and mem_avail never fell below about
      # 4.7 GiB — a far wider margin than the probes suggested, because a
      # probe job carries the probe harness as well.
      #
      # A SWAPFILE IS NOT THE ANSWER, and that is measured rather than
      # assumed: with the limit set, 32 GB of swap bought 16 MB of headroom
      # and only 1 GB was ever touched. Swap WITHOUT the limit does work and
      # works badly — 1958 s against 904 s, 8.7M major faults, 14.3 GB
      # swapped, 72% of the timeout. It is a fallback, not a fix. A smaller
      # GOMEMLIMIT is not a lever either: 4, 6 and 10 GiB all peak at
      # 14.65-14.80 GiB, so the overshoot is not heap the limit can reach.
      #
      # THE LEVER THAT PARAGRAPH POINTED AT HAS NOW BEEN PULLED, and it took
      # three attempts to find which lever it actually was — see the blocks
      # below. It is NOT `SYFT_FILE_METADATA_SELECTION=none`, which drops file
      # digests and 13%. It is `SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP=false`
      # for the bulk of the file rows, and then a `jq` trim for the rest. And
      # none of it touches the RSS, which is measured and stated below.
      #
      # Restricting the *cataloguers* is still refused, and that is a
      # different thing from dropping the file inventory: the two Electron
      # trees are precisely where a CVE question lands, and an RPM-only SBOM
      # would answer it with silence while looking authoritative. Every
      # package stays. Only the per-file rows go.
      #
      # SYFT_PARALLELISM because the default is one worker; this image has
      # thousands of packages across two app bundles. Kept at 4 because the
      # probe measured it as irrelevant to survival, and it is faster.
      #
      # ═══ WHY THE PER-FILE INVENTORY IS NOT IN THIS SBOM ═══════════════
      #
      # With the memory death fixed, run 35450175806 got one line further
      # and died in `cosign attest`:
      #
      #   Post "https://rekor.sigstore.dev/api/v1/log/entries":
      #   giving up after 4 attempt(s)
      #
      # That string is go-retryablehttp's generic retries-exhausted message.
      # It names no status and no cause, and it is the shape of a network
      # fault, which is how three rounds read it. It is not one. Measured
      # 2026-09-20, sixteen direct POSTs to that endpoint at ascending
      # sizes, each re-tested:
      #
      #   body <= 25,000,092 B   400, body uploaded and PROCESSED by Rekor
      #   body >= 25,165,916 B   502, size_upload=0, ~0.43 s, deterministic
      #
      # The boundary brackets 25,165,824 B — exactly 24 MiB — and the
      # refusal comes from the fronting proxy at header time, on
      # Content-Length, before a single body byte is sent. Two things follow
      # and both matter:
      #
      #  - 502 is in go-retryablehttp's RETRYABLE class (>= 500), unlike the
      #    413 this was assumed to be. cosign therefore retried a refusal
      #    that can never succeed, four times, and reported the retries
      #    rather than the reason.
      #  - size_upload=0 means no body ever went out. All four attempts fit
      #    in 3.86 s of that run's log; posting a ~222 MB body four times
      #    would have taken minutes. The timing in the real log is
      #    independent confirmation of a header-time refusal.
      #
      # The full document was 166 MB, which cosign base64s into a ~222 MB
      # DSSE body: about 9x the ceiling. No retry setting, no timeout and no
      # runner size can move that.
      #
      # What is actually big is the FILE inventory, not the packages: syft
      # emits a row per file for an image with roughly 200k of them, plus a
      # CONTAINS relationship edge from each to its owning package.
      #
      # ═══ WHICH KNOB ACTUALLY DROPS THEM — MEASURED, AND NOT THE OBVIOUS
      # ONE ═══
      #
      # Run locally against docker.io/library/alpine:3.20 with this same
      # syft 1.52.0, because a small image gives the same answer in seconds:
      #
      #   default                            packages=15 files=77 rels=125  87,692 B
      #   FILE_METADATA_SELECTION=none       packages=15 files=77 rels=125  76,227 B
      #   RELATIONSHIPS_..._OWNERSHIP=false  packages=15 files=2  rels=48   31,767 B
      #   both of the above                  packages=15 files=1  rels=48   31,130 B
      #
      # `SYFT_FILE_METADATA_SELECTION=none` is NOT the lever, which is the
      # reading a plain description of it invites: it drops each file's
      # DIGESTS, not the file rows, and saves 13%. The rows and their
      # ownership edges go with
      # `SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP=false`, which is 64%.
      # Both are set: the second is the size, the first also stops syft
      # sha1/sha256-hashing every file, which is work this step does not
      # need to do.
      #
      # THE PACKAGE SETS ARE IDENTICAL. Checked, not assumed — the sorted
      # `name@version` list of all 15 alpine packages `diff`s clean between
      # the default run and the stripped one. This drops files, not packages.
      #
      # THE THIRD SWITCH IS DELIBERATELY NOT SET.
      # `SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP_OVERLAP=false` makes syft
      # 1.52.0 exit 1 before it catalogues anything:
      #
      #   invalid application config: cannot enable
      #   exclude-binary-overlap-by-ownership without enabling
      #   package-file-ownership-overlap
      #
      # and the knob it demands you flip in exchange is the one that decides
      # whether a binary syft found and the RPM that owns it are one package
      # or two — i.e. it changes the PACKAGE set. That is the one thing this
      # step must not quietly do, so the switch stays on and the overlap
      # relationships stay in. They are a rounding error next to the file
      # rows.
      #
      # A MISTYPED VALUE CANNOT SILENTLY SHRINK THE SBOM: syft exits 1 on a
      # selection value it does not recognise (verified with `=nonsense`).
      # The package-count floor below is the second line of defence, not the
      # first.
      #
      # The cost, stated rather than buried: this SBOM answers "which
      # packages, at which versions, are in this image" — the CVE question —
      # and NOT "which files does this image contain, with what digests", nor
      # "why is this package here". It is a flat list of packages.
      # Anyone who needs the second can run syft against the published
      # digest themselves; the image is public and the digest is in the
      # signature. docs/trust-enforcement.md says so in those words.
      #
      # WHAT THE TWO SWITCHES BUY, AND WHAT THEY DO NOT.
      # Probe run 35456401012 against the same digest: 335 s with them
      # against 915 s without — a 63% cut, and that is the reason to keep
      # them. They do NOT buy memory: peak RSS was 15,547,064 KB with the
      # file inventory off against 15,449,996 KB with it on. An earlier
      # revision of this comment claimed the file pass drove the RSS. It
      # was measured and it is false, and it is corrected here rather than
      # left for the next person to inherit. GOMEMLIMIT therefore STAYS —
      # it is the measured fix for a measured death, and dropping it on the
      # theory that these switches replace it is exactly the kind of
      # unmeasured change this step's history is a monument to.
      #
      # THE SWITCHES ARE ALSO NOT ENOUGH ON THEIR OWN. With both set the
      # document is still 28,259,405 B — 1.5x the ceiling — and Rekor
      # refused it for real in that probe, with the same 3-second,
      # four-attempt failure. The trim below is what makes it fit.
      #
      # ═══ VERIFIED END TO END — build 35457162588, 2026-09-19 ═══
      #
      #   syft catalogued the image in 314s
      #   Maximum resident set size (kbytes): 14913824
      #   SBOM packages: 9830   file rows: 7049
      #   after the trim: packages 9830, cpe refs 55652, DESCRIBES 1
      #   predicate 14087745B compact -> ~18783660B DSSE body; ceiling
      #     25165824B, at 74%
      #   tlog entry created with index: 2893110210
      #   signature and SBOM attestation both verify against
      #     …/build-image.yml@refs/heads/task/sbom-attest
      #
      # Every step of that `image` job was green, including `Promote to every
      # published tag` and `Assert every published tag resolves to this digest`,
      # which had been SKIPPED — i.e. unproved, not passing — in every run since
      # this step started failing.
      #
      # The predicate was byte-identical to the one measured locally off the
      # probe's artefact (14,087,745 B both times), so the candidate table above
      # describes this document and not an approximation of it.
      #
      # The elapsed time is printed on SUCCESS too. Fifteen minutes was
      # picked without measurement and cost three builds to disprove; the
      # real figure is 904 s for the registry source on a 16 GB runner.
      # ── SAY WHICH RESOURCE RAN OUT ─────────────────────────────────
      # Run 35433705393 printed `syft exited 137 after 209s` and the error
      # text guessed "143 = killed". 137 is not 143: 143 is SIGTERM, a
      # process asked to stop, and 137 is SIGKILL, a process the kernel
      # removed. That difference is the entire diagnosis, and the step spent
      # three builds not making it. So: the signal is NAMED, the OOM
      # counter is read either side, and dmesg and the journal are dumped —
      # the journal because a systemd-oomd kill leaves nothing in dmesg at
      # all and is also a SIGKILL.
      #
      # An SBOM that describes nothing is worse than none: it answers the
      # CVE question with silence and looks authoritative doing it. The
      # image carries thousands of packages, so a hundred is a floor no
      # healthy build can fall below and any broken one will.
      #
      # This floor is load-bearing in a NEW way now that the file inventory
      # is off. syft does exit 1 on a selection value it does not recognise,
      # but the count is what proves the shrink came out of the file rows
      # and not out of the packages — the failure this step must never ship
      # quietly.
      #
      # ── THE SIZE GUARD, AND WHY IT FAILS THE BUILD RATHER THAN COPING ──
      #
      # cosign marshals the predicate with Go's json.Marshal — compact — and
      # base64s it into the DSSE envelope, so the body Rekor sees is about
      # 4/3 of the COMPACT document. Measure that, not the pretty one syft
      # wrote, or the guard checks a number nobody sends.
      #
      # The ceiling is 25,165,824 B (24 MiB), measured, not assumed, and the
      # 4/3 is measured too: cosign v2.5.2 was run offline against a
      # synthetic 4,824,532 B predicate and produced a 6,433,196 B envelope,
      # factor 1.3334, with every package carried through intact. (The
      # BUNDLE file base64s the envelope a second time, factor 1.7778. That
      # is not what goes on the wire, and confusing the two would put this
      # guard 33% out.)
      #
      # TWO THRESHOLDS, because they answer different questions.
      #
      # At the CEILING the upload cannot succeed, so the build fails. It
      # does NOT quietly drop --tlog-upload and carry on: a build that
      # silently stops transparency-logging its SBOM while the docs still
      # promise a public log is worse than a red step, because nobody finds
      # out. If this fires, the options and what each costs are in
      # ROADMAP/state/agents/sbom-attest.md; the decision is a person's.
      #
      # At the BUDGET (80% of the ceiling) the upload still works and the
      # build stays green — it just says so, while there is still room to do
      # something about it. Failing here instead would turn "the image grew"
      # into a red build for something that demonstrably still works.
      # ── WHAT IS PUBLISHED: THE PACKAGE INVENTORY, AND NOT THE GRAPH ──
      #
      # Measured on the real 28,259,405 B document (probe 35456401012's own
      # artefact), every figure below built from it rather than estimated:
      #
      #   packages   9,830        14,076,102 B   49%
      #     externalRefs             9,108,268 B  (cpe23Type 7,634,382)
      #     sourceInfo               1,357,597 B
      #   relationships  43,801   10,872,960 B   38%
      #     OTHER           17,508  5,883,495 B
      #     DEPENDENCY_OF   16,463  3,085,431 B
      #     CONTAINS         9,829  1,860,087 B
      #     DESCRIBES            1        145 B
      #   files      7,049         3,298,838 B   12%
      #
      # Candidates, each measured, against the 25,165,824 B ceiling:
      #
      #   drop files + file-anchored edges        29,523,132  117%  OVER
      #   + drop OTHER                            25,414,052  100%  OVER by 248 KB
      #   + drop sourceInfo                       23,603,924   93%  fits
      #   drop files + all edges but DESCRIBES    18,784,972   74%  fits  ← this
      #   that, + drop cpe23Type                   8,531,592   33%  fits
      #
      # TWO OPTIONS WERE MEASURED AND REFUSED, so nobody re-derives them:
      #
      #  - Keeping the dependency graph and paying for it with `sourceInfo`
      #    lands at 93% of the ceiling. Seven points of headroom on an image
      #    that gains packages every release is not headroom; its failure
      #    mode is the next Electron bump turning the build red.
      #  - Dropping `cpe23Type` would be the cheapest 27% in the document,
      #    and it is refused: CPEs are the matching key a vulnerability
      #    scanner uses. Cutting them to save space would shrink the artefact
      #    by making it worse at the single question it exists to answer.
      #
      # So the rule is: this document carries the complete package
      # inventory — every package, every version, every purl and every CPE —
      # and does NOT carry the file inventory or the relationship graph. The
      # dropped parts are structure, and structure is reproducible from the
      # image: `syft registry:<digest> -o spdx-json` regenerates all of it
      # from the same bytes. Identity is not reproducible from anything
      # smaller, so identity is what gets signed and logged.
      #
      # ── THE TRIM IS NOW LOAD-BEARING, SO IT IS CHECKED ────────────────
      # A jq expression that silently ate packages would produce a smaller
      # document that still looked like an SBOM, attested cleanly, and
      # answered a CVE question with a confident absence. So the packages
      # array is compared BEFORE and AFTER, canonically sorted and hashed:
      # byte-identical or the build stops. Comparing counts would miss a
      # substitution; comparing the trimmed document with itself would pass
      # for free.
      #
      # ── ATTEST, AND PROVE THE TRANSPARENCY LOG ACTUALLY TOOK IT ────────
      #
      # `cosign attest` exits 0 on a path that never reaches Rekor if
      # --tlog-upload is ever turned off by accident, and this project's
      # docs claim a publicly verifiable log. So the claim is checked here,
      # against cosign's own output, rather than assumed from an exit code.
      #
      # `if ! cmd` and not `cmd || ...`: set -e does not apply to an
      # inverted command, and a bare `!` here would swallow a real failure.
      - name: Generate and attest the SBOM
        if: ${{ steps.push.outputs.digest != '' }}
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.52.0
          syft --version

          REF="$IMAGE@${{ steps.push.outputs.digest }}"

          echo "── before prune ──"; df -h / /mnt 2>/dev/null || true; free -m || true
          sudo podman image prune -af  >/dev/null 2>&1 || true
          sudo podman system prune -af >/dev/null 2>&1 || true
          echo "── after prune ──";  df -h / /mnt 2>/dev/null || true; free -m || true

          _oom0="$(awk '/oom_kill/{print $2}' /proc/vmstat 2>/dev/null || echo 0)"
          ( while true; do
              echo "[sbom sample $(date +%T)] $(free -m | awk '/^Mem:/{printf "mem_used=%sM mem_avail=%sM", $3, $7} /^Swap:/{printf " swap_used=%sM", $3}') root_avail=$(df -BM --output=avail / | tail -1 | tr -d ' ')"
              sleep 15
            done ) & _sampler=$!
          _timer=(); [ -x /usr/bin/time ] && _timer=(/usr/bin/time -v -o /tmp/syft.time)

          _t0=$(date +%s)
          # 10GiB and `registry:` are inlined deliberately: these are the exact
          # values the probe measured, and a variable that can drift from what
          # was measured is how this step ends up "fixed" and still dying.
          timeout 2700 "${_timer[@]}" env SYFT_PARALLELISM=4 GOMEMLIMIT=10GiB \
            SYFT_FILE_METADATA_SELECTION=none \
            SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP=false \
            syft "registry:$REF" -o spdx-json > /tmp/sbom.spdx.json || {
            rc=$?
            _el=$(( $(date +%s) - _t0 ))
            kill $_sampler 2>/dev/null || true
            _oom1="$(awk '/oom_kill/{print $2}' /proc/vmstat 2>/dev/null || echo 0)"
            echo "── how it died ──"
            [ -f /tmp/syft.time ] && grep -E 'Maximum resident|Command terminated|Elapsed \(wall' /tmp/syft.time || true
            echo "kernel oom_kill counter: $_oom0 -> $_oom1  (delta $(( _oom1 - _oom0 )))"
            sudo dmesg -T 2>/dev/null | grep -iE 'out of memory|killed process|oom-kill' | tail -10 \
              || echo "(no OOM lines in dmesg)"
            sudo journalctl --since '-60 min' --no-pager 2>/dev/null \
              | grep -iE 'oomd|killed.*memory|memory pressure' | tail -10 \
              || echo "(no OOM lines in the journal)"
            free -m; df -h /
            if [ "$rc" = 124 ]; then
              echo "::error::syft did not finish cataloguing the image in 45 minutes (${_el}s)"
            elif [ "$rc" -gt 128 ] 2>/dev/null; then
              echo "::error::syft was killed by SIG$(kill -l $(( rc - 128 )) 2>/dev/null || echo "?($(( rc - 128 )))") after ${_el}s — read the oom_kill delta and the memory samples above"
            else
              echo "::error::syft exited $rc after ${_el}s"
            fi
            exit 1
          }
          kill $_sampler 2>/dev/null || true
          echo "syft catalogued the image in $(( $(date +%s) - _t0 ))s"
          [ -f /tmp/syft.time ] && grep -E 'Maximum resident|Elapsed \(wall' /tmp/syft.time || true

          COUNT="$(jq '.packages | length' /tmp/sbom.spdx.json)"
          FILES="$(jq '(.files // []) | length' /tmp/sbom.spdx.json)"
          echo "SBOM packages: $COUNT   file rows: $FILES"
          test "$COUNT" -gt 100

          jq -c 'del(.files)
                 | .relationships = [ (.relationships // [])[]
                                      | select(.relationshipType == "DESCRIBES") ]' \
            /tmp/sbom.spdx.json > /tmp/sbom.min.json

          PRE="$(jq -S -c '.packages' /tmp/sbom.spdx.json | sha256sum | cut -d' ' -f1)"
          POST="$(jq -S -c '.packages' /tmp/sbom.min.json | sha256sum | cut -d' ' -f1)"
          KEPT="$(jq '.packages | length' /tmp/sbom.min.json)"
          DESC="$(jq '[.relationships[] | select(.relationshipType == "DESCRIBES")] | length' /tmp/sbom.min.json)"
          CPES="$(jq '[.packages[].externalRefs // [] | .[] | select(.referenceType == "cpe23Type")] | length' /tmp/sbom.min.json)"
          echo "after the trim: packages ${KEPT}, cpe refs ${CPES}, DESCRIBES ${DESC}"
          if [ "$PRE" != "$POST" ]; then
            echo "::error::the trim altered the packages array (${PRE} -> ${POST}). It must remove files and"
            echo "::error::  relationships and nothing else — the package inventory is the whole artefact."
            exit 1
          fi
          if jq -e 'has("files")' /tmp/sbom.min.json > /dev/null; then
            echo "::error::the trim left a files array behind; the size figures above no longer apply"
            exit 1
          fi
          if [ "$DESC" != 1 ]; then
            echo "::error::expected exactly one DESCRIBES relationship after the trim, got ${DESC}"
            exit 1
          fi

          PRED=$(stat -c%s /tmp/sbom.min.json)
          DSSE=$(( (PRED + 2) / 3 * 4 ))
          REKOR_CEILING=25165824
          REKOR_BUDGET=20132659
          echo "predicate ${PRED}B compact -> ~${DSSE}B DSSE body; ceiling ${REKOR_CEILING}B, at $(( DSSE * 100 / REKOR_CEILING ))%"
          if [ "$DSSE" -ge "$REKOR_CEILING" ]; then
            echo "::error::the SBOM predicate is ${PRED}B compact, ~${DSSE}B once base64'd into the DSSE envelope."
            echo "::error::rekor.sigstore.dev refuses any request body at or above ${REKOR_CEILING}B (24 MiB) with an"
            echo "::error::  immediate HTTP 502 from its fronting proxy, before any body is sent. cosign retries that"
            echo "::error::  four times and reports 'giving up after 4 attempt(s)', which names neither size nor status."
            echo "::error::This is NOT a network fault and retrying will not help. The image has outgrown the"
            echo "::error::  package-level SBOM. See ROADMAP/state/agents/sbom-attest.md for the options and their costs."
            exit 1
          elif [ "$DSSE" -ge "$REKOR_BUDGET" ]; then
            echo "::warning::the SBOM attestation is at $(( DSSE * 100 / REKOR_CEILING ))% of Rekor's 24 MiB request ceiling"
            echo "::warning::  (~${DSSE}B of ${REKOR_CEILING}B). It still uploads. When it stops, the step fails with the"
            echo "::warning::  explanation above, and the remaining levers are in ROADMAP/state/agents/sbom-attest.md."
          fi

          if ! cosign attest --yes --predicate /tmp/sbom.min.json \
               --type spdxjson "$REF" > /tmp/attest.log 2>&1; then
            cat /tmp/attest.log
            echo "::error::cosign attest failed. If the message is 'giving up after N attempt(s)' against"
            echo "::error::  rekor.sigstore.dev, read the size guard above: a 502 at header time is indistinguishable"
            echo "::error::  from a network fault in that message, and the predicate was ${PRED}B compact."
            exit 1
          fi
          cat /tmp/attest.log
          # No pipeline: `printf ... | grep -q` returns 141 on a match under
          # pipefail, which has mis-seeded suites in this repo before.
          if ! grep -F 'tlog entry created' /tmp/attest.log > /dev/null; then
            echo "::error::the SBOM attestation was signed but no transparency-log entry was created."
            echo "::error::  docs/trust-enforcement.md claims a publicly verifiable log; this build did not produce one."
            exit 1
          fi
      - name: Verify the image and its SBOM are both retrievable
        if: ${{ steps.push.outputs.digest != '' }}
        run: |
          set -euo pipefail
          REF="$IMAGE@${{ steps.push.outputs.digest }}"
          IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/build-image.yml@${{ github.ref }}"
          # Verifying here, in the job that produced them, is what makes the
          # claim testable at all. A signature nobody checks is a signature that
          # can quietly stop being produced, and the failure would surface for
          # the first time on a user's machine.
          cosign verify "$REF" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          cosign verify-attestation "$REF" --type spdxjson \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "signature and SBOM attestation both verify against $IDENTITY"

      # EVERY published name, all pointing at the one digest.
      #
      #   apex / apex-<sha>              the canonical name going forward
      #   daily / gaming-mesa / gaming-nvidia   MIGRATION. Machines in the field
      #       have bootc pointed at these. If one stops moving, `bootc upgrade`
      #       reports "no update" forever and that machine silently stops getting
      #       security updates. They are not deprecated aliases, they are live
      #       references owned by other people's laptops.
      #   platform-*                     stable inputs for shell-only releases
      #       (release-shell.yml builds Containerfile.release FROM a platform tag,
      #       and its own dispatch still offers the three flavor names).
      #   daily-<sha>                    consumed by the qcow2 job.
      - name: Promote to every published tag
        if: ${{ steps.push.outputs.digest != '' }}
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/skopeo-auth.json"
          echo '{}' > "$REGISTRY_AUTH_FILE"
          creds="$GHCR_USER:$GHCR_TOKEN"
          digest="${{ steps.push.outputs.digest }}"
          promote() {
            skopeo copy --retry-times 3 --src-creds "$creds" --dest-creds "$creds" \
              "docker://$IMAGE@$digest" "docker://$IMAGE:$1"
          }
          # Per-SHA names first. Nothing tracks these, so they are written from
          # any ref: they are what makes a non-main build a real, complete,
          # inspectable build rather than a dry run.
          for f in apex daily gaming-mesa gaming-nvidia; do
            promote "$f-${{ github.sha }}"
          done
          if [ "${PUBLISH:-false}" != "true" ]; then
            echo "not publishing from ${GITHUB_REF:-unknown}: per-SHA tags written;"
            echo "  :apex :daily :gaming-mesa :gaming-nvidia :platform-* :edge NOT moved."
            echo "  This build is complete; it is simply not a release."
            exit 0
          fi
          # The floating names, and the ones installed machines actually track
          # are moved LAST, so any earlier registry failure leaves the fleet on
          # the previous signed release rather than half-migrated.
          for f in apex daily gaming-mesa gaming-nvidia; do
            promote "platform-$f-${{ github.sha }}"
            promote "platform-$f"
          done
          for f in apex daily gaming-mesa gaming-nvidia; do
            promote "$f"
          done
          # §26. `edge` is a NAME for what those four already are: every
          # successful build of main, as soon as it is published. It is moved
          # here, with them, because a channel that lagged its own definition
          # would be a lie the first time somebody switched onto it.
          #
          # stable, candidate and beta are deliberately NOT moved here. A
          # channel that advanced on every build is edge with a different
          # spelling, and three of those would be worse than none — a user who
          # chose `stable` would be taking the same risk while believing they
          # had opted out of it. They move only through promote-channel.yml,
          # which is a dispatch a person runs, and which refuses a digest that
          # is not already on the channel above the one being moved.
          promote edge

      # The migration promise, measured. Reading the digest back out of the
      # registry is the only thing that proves a machine tracking `:gaming-mesa`
      # will actually receive this build; the promotion step succeeding only
      # proves skopeo exited zero.
      - name: Assert every published tag resolves to this digest
        if: ${{ steps.push.outputs.digest != '' }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/skopeo-auth.json"
          echo '{}' > "$REGISTRY_AUTH_FILE"
          creds="$GHCR_USER:$GHCR_TOKEN"
          want="${{ steps.push.outputs.digest }}"
          fail=0
          # A non-main run moved no floating name, so asserting they point here
          # would fail for a reason that is not the build — and a red run whose
          # redness means nothing is worse than no run. It checks what it did
          # write instead, so the step still proves something on every ref.
          if [ "${PUBLISH:-false}" = "true" ]; then
            TAGS="apex daily gaming-mesa gaming-nvidia edge
                  platform-apex platform-daily platform-gaming-mesa platform-gaming-nvidia
                  daily-${{ github.sha }}"
          else
            TAGS="apex-${{ github.sha }} daily-${{ github.sha }}"
          fi
          for t in $TAGS; do
            got="$(skopeo inspect --creds "$creds" --format '{{.Digest}}' "docker://$IMAGE:$t" 2>/dev/null || echo MISSING)"
            if [ "$got" = "$want" ]; then
              echo "  ok   :$t -> $got"
            else
              echo "::error::tag :$t resolves to '$got', expected '$want' — machines tracking it would stop updating"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1

      # How much this push actually costs the fleet. The point of the core tier
      # is that this number is small; printing it into the run summary is what
      # turns "it should be small" into something anyone can check at a glance,
      # and what will make a regression obvious the week it happens.
      - name: Report update cost
        if: ${{ steps.push.outputs.digest != '' }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          # Same trap as the core job: `sudo podman login` above left a
          # root-owned auth.json in this user's runtime dir, and skopeo reads it
          # before honouring --creds. Point it at one we own.
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/skopeo-auth.json"
          echo '{}' > "$REGISTRY_AUTH_FILE"
          creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          # Via FILES, not argv. A manifest is one argument, Linux caps a
          # single argument at MAX_ARG_STRLEN (128 KiB), and an image that
          # inherits every core layer lists enough of them to exceed it. Passing
          # them inline is what made run 33861012269 die with
          # "/usr/bin/python3: Argument list too long" on both gaming flavors
          # AFTER their images had already been pushed and promoted — a red run
          # for a summary table. Daily squeaked under the limit, which is why it
          # passed and looked like a flavor-specific defect.
          new_f="$RUNNER_TEMP/manifest-new.json"
          core_f="$RUNNER_TEMP/manifest-core.json"
          skopeo inspect --raw --creds "$creds" \
                  "docker://$IMAGE@${{ steps.push.outputs.digest }}" > "$new_f"
          # Layers shared with the parent core are the ones bootc will NOT
          # download; anything else is new bytes on every machine.
          skopeo inspect --raw --creds "$creds" \
                  "docker://$IMAGE:$TAG_CORE" > "$core_f" 2>/dev/null \
                  || echo '{}' > "$core_f"
          python3 - "$new_f" "$core_f" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys

          def load(path):
              text = open(path).read().strip()
              return json.loads(text) if text else {}

          new, core = load(sys.argv[1]), load(sys.argv[2])
          nl = new.get('layers', [])
          shared = {l['digest'] for l in core.get('layers', [])}
          fresh = [l for l in nl if l['digest'] not in shared]
          mib = lambda b: b / 2**20
          print("### `apex` update cost")
          print()
          print(f"- total image: **{len(nl)} layers, {mib(sum(l['size'] for l in nl)):.0f} MiB**")
          print(f"- inherited from core (not re-downloaded): "
                f"**{len(nl) - len(fresh)} layers, {mib(sum(l['size'] for l in nl) - sum(l['size'] for l in fresh)):.0f} MiB**")
          print(f"- NOT inherited from core: "
                f"**{len(fresh)} layers, {mib(sum(l['size'] for l in fresh)):.0f} MiB**")
          print()
          print("The last figure is an UPPER BOUND on what `apex update` downloads: "
                "base/image layers that happen to be unchanged since the previous "
                "push are also reused, but are counted as new here. Before the "
                "core/base split this number was the whole image (153 layers, 5.3 GB). "
                "The NVIDIA driver and the controller modules are in `core`, so they "
                "are inside the inherited figure and are downloaded once, ever.")
          PY

  # ── Job 5: qcow2 (stretch, dispatch-gated, non-blocking) ─────────────────
  # Proves bootc-image-builder produces a bootable disk from the published image.
  # GitHub runners have NO /dev/kvm, so the disk is NOT booted here — producing
  # the qcow2 is the check. Gated on manual dispatch (build_qcow2=true) and
  # continue-on-error so bib flakiness never fails the image pipeline.
  qcow2:
    needs: image
    runs-on: ubuntu-24.04
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.build_qcow2 }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build the qcow2 via bootc-image-builder
        run: |
          mkdir -p output
          sudo podman pull "$IMAGE:apex-${{ github.sha }}"
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output":/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs xfs --local \
            "$IMAGE:apex-${{ github.sha }}"
          ls -lh output/qcow2 || ls -lhR output

      - name: Upload qcow2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-os-qcow2
          path: output/qcow2/*.qcow2
          if-no-files-found: warn
          retention-days: 7

  # ── Job 6: installer ISO (dispatch-gated) ─────────────────────────────────
  # Builds the APEX-OS installer as an Anaconda ISO (bootc-image-builder --type
  # anaconda-iso) — a bootable USB that installs the signed image to a target
  # disk. The image is pulled into local storage first (each job is a fresh
  # runner; --local needs it present). Uploaded as an artifact for the maintainer
  # to write to a USB stick. Independent of core/base/image: it pulls the
  # already-published tag, so it runs on an ISO-only dispatch. There is one ISO
  # now, because there is one image.
  installer-iso:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.build_iso
    steps:
      # Needed for installer/bib-config.toml (the interactive kickstart).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Log in to GHCR (rootful podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Pull the latest green image into local storage
        run: sudo podman pull "$IMAGE:apex"

      # The installer config (installer/bib-config.toml) is mounted at
      # /config.toml so bootc-image-builder applies our INTERACTIVE kickstart
      # instead of its destructive default (clearpart --all + locked root). See
      # that file's header and docs. Without it the ISO wipes the target disk
      # unattended and locks the user out — the two bugs this fixes.
      - name: Build the installer ISO via bootc-image-builder
        run: |
          mkdir -p output
          test -f installer/bib-config.toml  # fail loudly if the config is missing
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output":/output \
            -v "$(pwd)/installer/bib-config.toml":/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs --local \
            "$IMAGE:apex"
          ls -lhR output/bootiso || ls -lhR output

      # Guard: extract the embedded kickstart from the built ISO and FAIL the
      # build if the destructive defaults ever reappear (clearpart/autopart) or
      # a root password / user got baked in. Cheap insurance against a future
      # bib change silently restoring the unattended wipe. Uses the runner's own
      # xorriso (no mount) to pull the kickstart files from the ISO root.
      - name: Verify embedded kickstart is non-destructive
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xorriso
          iso=$(ls output/bootiso/*.iso | head -1)
          echo "Inspecting $iso"
          rm -rf ksdump && mkdir ksdump
          # Extract EVERY kickstart on the ISO (not just the two known names) so a
          # renamed/extra ks carrying a destructive directive can't slip past. List
          # the ISO tree, pull each *.ks. (apex-logs 36 — hardened after Fable review.)
          xorriso -osirrox on -indev "$iso" -find / -name '*.ks' 2>/dev/null \
            | sed -n "s/^'\(.*\)'.*/\1/p" > ks.list || true
          # Fallback to the known names if -find gave nothing.
          if [ ! -s ks.list ]; then printf '/osbuild.ks\n/osbuild-base.ks\n' > ks.list; fi
          while read -r k; do
            [ -n "$k" ] || continue
            out="ksdump/$(echo "$k" | tr '/' '_')"
            xorriso -osirrox on -indev "$iso" -extract "$k" "$out" 2>/dev/null || true
          done < ks.list
          cat ksdump/* > extracted.ks 2>/dev/null || true
          echo "----- kickstart files on ISO -----"; cat ks.list
          echo "----- embedded kickstart -----"; cat extracted.ks; echo "------------------------------"
          if [ ! -s extracted.ks ]; then
            echo "::error::Could not extract any kickstart from the ISO — cannot verify"; exit 1
          fi
          # Storage: nothing that can partition/format/mount without the operator.
          if grep -Eiq '^[[:space:]]*(clearpart|autopart|part|reqpart|ignoredisk|zerombr|raid|volgroup|logvol|btrfs)([[:space:]]|$)' extracted.ks; then
            echo "::error::A storage directive was found in the kickstart (must be interactive)"; exit 1
          fi
          # Accounts: no baked user/root credential.
          if grep -Eiq '^[[:space:]]*(rootpw|user[[:space:]]+--|sshkey)([[:space:]]|$)' extracted.ks; then
            echo "::error::A baked user/rootpw/sshkey was found (must be interactive)"; exit 1
          fi
          # No unattended-completion or auto-reboot, and no %pre that could wipe.
          if grep -Eiq '^[[:space:]]*(autostep|reboot|poweroff|halt|shutdown)([[:space:]]|$)|^%pre\b' extracted.ks; then
            echo "::error::An unattended/%pre directive was found in the kickstart"; exit 1
          fi
          # Bootloader cmdline must not force a non-interactive install.
          rm -rf grubdump && mkdir grubdump
          for g in /EFI/BOOT/grub.cfg /boot/grub2/grub.cfg /isolinux/isolinux.cfg /EFI/fedora/grub.cfg; do
            xorriso -osirrox on -indev "$iso" -extract "$g" "grubdump/$(echo "$g" | tr '/' '_')" 2>/dev/null || true
          done
          if grep -Eiq 'inst\.(text|cmdline|noninteractive|ks\.all)' grubdump/* 2>/dev/null; then
            echo "::error::Boot cmdline forces a non-interactive/auto install"; exit 1
          fi
          echo "OK: kickstart has no storage/account/unattended directives; install is interactive."

      - name: Upload installer ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-os-installer-iso
          path: output/bootiso/*.iso
          if-no-files-found: warn
          retention-days: 7
