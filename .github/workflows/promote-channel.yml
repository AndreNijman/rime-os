# ──────────────────────────────────────────────────────────────────────────────
#  Promote a digest onto stable, candidate or beta, and move the staged-rollout
#  ramp. Roadmap §26.
#
#  `edge` is not promoted here. It is moved by build-image.yml with `rime`,
#  `daily`, `gaming-mesa` and `gaming-nvidia`, because edge IS every successful
#  build of main and a channel that lagged its own definition would be a lie the
#  first time somebody switched onto it. It CAN be halted here — see `mode`.
#
#  The other three exist to be slower, so they move only when a person says so.
#  Two things are checked before anything is written, and both are the kind of
#  mistake that is invisible until somebody's laptop will not boot:
#
#   1. The digest must be cosign-signed under this repository's build-image.yml
#      identity on refs/heads/main. A channel tag is what a machine's bootc
#      origin points at; pointing one at an unsigned image, or at a fork's, is
#      the whole supply chain undone by one dispatch with a pasted digest.
#      release-shell.yml already refuses to build on an unverified platform for
#      the same reason.
#
#   2. The digest must ALREADY be on the channel above the target. `rime channel
#      list` promises stable is "only builds that have run on the other channels
#      first"; without this check that sentence is a hope, and the first
#      violation of it is a stable user taking a build nobody ran. edge is above
#      beta, beta above candidate, candidate above stable.
#
#  ── The staged rollout, and why it lives in this file ───────────────────────
#
#  §26's second half needs a percentage that CHANGES between builds — 1, then 5,
#  then 25 — and an OCI label is baked once per image, so a label cannot hold
#  it. The pointer is a small signed JSON document published at `:rollout` in
#  this same repository and re-published whenever the number moves. Every step
#  below that touches it is in this workflow rather than a new one for a reason
#  that reaches into the client: `trust::expected_rollout_signer` derives the
#  Sigstore identity a machine will accept for that document by taking the image
#  signer and swapping `build-image.yml` for `promote-channel.yml`. Rename this
#  file and every machine silently stops believing the ramp.
#
#  A ramp is therefore a re-dispatch of this workflow with a higher `percent`,
#  and a stop-ship is one with `halt`. There is no service to run: the machine
#  GETs an object from the registry it already contacts on every update, and
#  what makes the object trustworthy is the signature over it rather than the
#  transport. What that costs is written down in docs/update-channels.md —
#  chiefly that a registry object is a BROADCAST, so a ramp is per-channel and
#  never per-machine, and no operator learns who took what.
#
#  Nothing here fires on a push. It is workflow_dispatch only, and it shares
#  build-image.yml's concurrency group so a promotion cannot interleave with a
#  publish.
#
#  NOT VERIFIED: no run of this workflow has ever published a rollout document.
#  It has been reviewed and never executed. The client half — fetch, verify,
#  decide, hold — is exercised end to end against real cryptography by
#  tests/test-rime-rollout.sh, and the shape this workflow writes is asserted
#  against the client's parser by the same suite.
# ──────────────────────────────────────────────────────────────────────────────
name: Promote a channel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "promote: move the tag and set its ramp. rollout-only: change the ramp or halt a release, moving no tag"
        type: choice
        options: [promote, rollout-only]
        default: promote
        required: true
      channel:
        description: "Which channel. edge is valid for rollout-only, never for promote"
        type: choice
        options: [candidate, beta, stable, edge]
        required: true
      digest:
        description: "The image digest (sha256:...)"
        type: string
        required: true
      percent:
        description: "How many machines this release may reach, 0-100"
        type: string
        default: "100"
        required: true
      halt:
        description: "Stop this digest reaching any further machines"
        type: boolean
        default: false
      reason:
        description: "Why, in your own words. Required for a halt; printed to the user verbatim"
        type: string
        default: ""

concurrency:
  group: apex-image-publish  # rime-rename: keep (build-image.yml's group; see there)
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  promote:
    name: ${{ inputs.mode }} ${{ inputs.channel }} (${{ matrix.image }})
    runs-on: ubuntu-24.04
    # ═══ BOTH NAMES, ONE AFTER THE OTHER ═══
    #
    # The rebrand (2026-09-28). build-image.yml publishes every build under the
    # new name AND the pre-rebrand one, because GHCR does not redirect a
    # renamed package and a machine keeps following the name in its origin
    # until `rime update` moves it. A channel tag is what such a machine
    # follows, so every promotion is made under both, each leg complete: the
    # signature checked under that name, the ladder checked under that name,
    # the tag moved and read back, and a rollout document of that name's own
    # (the client refuses a document whose `repository` is not the one it
    # follows, so one document cannot serve both).
    #
    # max-parallel 1 with fail-fast runs the new name first and never starts
    # the old one if the new one failed, so a half-done promotion is always
    # "the new name moved, the old one did not": machines on the old name stay
    # on the previous channel build, and a re-run finishes the job.
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        image:
          - ghcr.io/andrenijman/rime-os
          - ghcr.io/andrenijman/apex-os  # rime-rename: keep (machines that have not moved follow this name)
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install skopeo
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }

      - name: Check the inputs
        env:
          DIGEST: ${{ inputs.digest }}
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.channel }}
          PERCENT: ${{ inputs.percent }}
          HALT: ${{ inputs.halt }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          # Before anything reaches a registry command. A malformed digest here
          # becomes a confusing skopeo error three steps later, and a digest
          # with a shell metacharacter in it becomes something worse.
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::digest must start with sha256:"; exit 1 ;;
          esac
          hex="${DIGEST#sha256:}"
          if [ "${#hex}" -ne 64 ] || ! printf '%s' "$hex" | grep -E '^[0-9a-f]{64}$' >/dev/null; then
            echo "::error::'$DIGEST' is not a sha256 digest"
            exit 1
          fi
          if ! printf '%s' "$PERCENT" | grep -E '^(100|[0-9]{1,2})$' >/dev/null; then
            echo "::error::percent must be a whole number 0-100, got '$PERCENT'"
            exit 1
          fi
          # A halt with no reason is a machine telling its user "no" and nothing
          # else. The client prints this string verbatim; there has to be one.
          if [ "$HALT" = true ] && [ -z "${REASON// }" ]; then
            echo "::error::a halt must carry a reason. It is what the user reads."
            exit 1
          fi
          # edge moves on every build of main, by build-image.yml. Promoting it
          # here would write a tag that the next build overwrites within the
          # hour, which is worse than refusing: the operator would believe a
          # promotion happened.
          if [ "$MODE" = promote ] && [ "$TARGET" = edge ]; then
            echo "::error::edge is moved by build-image.yml on every successful build of main."
            echo "::error::Use mode=rollout-only to halt or ramp it."
            exit 1
          fi

      - name: Log in to the registry
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | cosign login "$REGISTRY" -u "$GHCR_USER" --password-stdin

      - name: The digest must be signed by this repository's build workflow
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          # This repository under either name: a build signed before the GitHub
          # rename names apex-os, one signed after it rime-os. Anchored both (rime-rename: keep)
          # ends, so no other repository, workflow or ref matches.
          IDENTITY_RE='^https://github\.com/AndreNijman/(apex|rime)-os/\.github/workflows/build-image\.yml@refs/heads/main$'  # rime-rename: keep (accepts the pre-rename repository)
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_RE" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST" > /dev/null
          echo "$IMAGE@$DIGEST is signed by build-image.yml on main"

      - name: The digest must already be on the channel above this one
        if: inputs.mode == 'promote'
        env:
          DIGEST: ${{ inputs.digest }}
          TARGET: ${{ inputs.channel }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          creds="$GHCR_USER:$GHCR_TOKEN"
          case "$TARGET" in
            beta)      above=edge ;;
            candidate) above=beta ;;
            stable)    above=candidate ;;
            *) echo "::error::unknown channel '$TARGET'"; exit 1 ;;
          esac
          got="$(skopeo inspect --creds "$creds" --format '{{.Digest}}' "docker://$IMAGE:$above" 2>/dev/null || echo MISSING)"
          if [ "$got" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$above is at '$got', not '$DIGEST'. A build reaches $TARGET only after it has been on $above — promote $above first."
            exit 1
          fi
          echo "  ok   :$above is already at this digest"

      - name: Move the tag
        if: inputs.mode == 'promote'
        env:
          DIGEST: ${{ inputs.digest }}
          TARGET: ${{ inputs.channel }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          creds="$GHCR_USER:$GHCR_TOKEN"
          skopeo copy --retry-times 3 --src-creds "$creds" --dest-creds "$creds" \
            "docker://$IMAGE@$DIGEST" "docker://$IMAGE:$TARGET"

      - name: Read the tag back out of the registry
        env:
          DIGEST: ${{ inputs.digest }}
          TARGET: ${{ inputs.channel }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # skopeo exiting zero proves skopeo exited zero. What a machine
          # following this channel will actually receive is what the registry
          # answers, so that is what is asserted — the same rule build-image.yml
          # applies to the migration tags.
          #
          # In rollout-only mode nothing moved, and this is the check that keeps
          # the ramp honest instead: a rollout entry names a digest, and the
          # client ignores an entry whose digest is not what the channel
          # currently resolves to. Writing an entry for a digest this channel is
          # not serving would publish a ramp that does nothing, and the operator
          # would have no way to see that from the run.
          creds="$GHCR_USER:$GHCR_TOKEN"
          got="$(skopeo inspect --creds "$creds" --format '{{.Digest}}' "docker://$IMAGE:$TARGET" 2>/dev/null || echo MISSING)"
          if [ "$got" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$TARGET resolves to '$got', expected '$DIGEST'"
            exit 1
          fi
          echo "  ok   :$TARGET -> $got"

      # ── the mutable pointer ────────────────────────────────────────────────
      - name: Read the rollout document that is already published
        id: current
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          creds="$GHCR_USER:$GHCR_TOKEN"
          # Redirectable, and defaulted to what a runner has. tests/test-rime-
          # rollout.sh lifts the python below out of this file and RUNS it, so
          # that the document a machine parses is the document this workflow
          # writes rather than a copy of it that drifts.
          D="${ROLLOUT_DIR:-/tmp}"; export ROLLOUT_DIR="$D"
          rm -rf "$D/rollout-old"
          if skopeo copy --quiet --src-creds "$creds" \
               "docker://$IMAGE:rollout" "dir:$D/rollout-old" 2>"$D/rollout-old.err"; then
            python3 - <<'PY'
          import json, os, shutil, sys
          D = os.environ.get("ROLLOUT_DIR", "/tmp")
          m = json.load(open(f"{D}/rollout-old/manifest.json"))
          # The pre-rebrand media type, KEPT: every client in the field looks
          # for exactly this string (rimed-core's ROLLOUT_MEDIA_TYPE).
          want = "application/vnd.apexos.rollout.v1+json"  # rime-rename: keep (a wire format fielded clients parse)
          # The layer the manifest NAMES, never "the first file in the
          # directory": `skopeo copy … dir:` writes the config blob beside it,
          # and taking the wrong one would reset the serial to zero — the one
          # field a client refuses to go backwards on, so the next document
          # would be refused by every machine as a replay.
          hit = [l for l in m.get("layers", []) if l.get("mediaType") == want]
          if not hit:
              sys.exit("::error::the published :rollout carries no rollout layer. Refusing to "
                       "replace an object of a shape this workflow did not write.")
          shutil.copyfile(f"{D}/rollout-old/" + hit[0]["digest"].split(":", 1)[1],
                          f"{D}/rollout-current.json")
          PY
            echo "found=yes" >> "$GITHUB_OUTPUT"
            echo "the published document is:"; cat "$D/rollout-current.json"
          else
            # No document yet. Normal exactly once, and distinguished from a
            # registry that would not answer — replacing serial 12 with serial 1
            # because ghcr.io returned 503 is a replay this workflow published
            # itself, and every machine would then refuse the real next one.
            if grep -qiE 'manifest unknown|name unknown|not found' "$D/rollout-old.err"; then
              echo "found=no" >> "$GITHUB_OUTPUT"
              echo "no rollout document is published yet; this will be serial 1"
            else
              echo "::error::could not read $IMAGE:rollout:"; cat "$D/rollout-old.err"
              exit 1
            fi
          fi

      - name: Write the new rollout document
        env:
          DIGEST: ${{ inputs.digest }}
          TARGET: ${{ inputs.channel }}
          PERCENT: ${{ inputs.percent }}
          HALT: ${{ inputs.halt }}
          REASON: ${{ inputs.reason }}
          FOUND: ${{ steps.current.outputs.found }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time

          now = int(time.time())
          D = os.environ.get("ROLLOUT_DIR", "/tmp")
          old = json.load(open(f"{D}/rollout-current.json")) if os.environ["FOUND"] == "yes" else {}

          entry = {
              "channel": os.environ["TARGET"],
              "digest": os.environ["DIGEST"],
              "percent": int(os.environ["PERCENT"]),
              "halt": os.environ["HALT"] == "true",
          }
          reason = os.environ.get("REASON", "").strip()
          if reason:
              entry["reason"] = reason

          # Every other channel's entry is carried forward untouched. A
          # promotion of candidate must not silently clear a halt on beta.
          others = [e for e in old.get("channels", []) if e.get("channel") != entry["channel"]]

          doc = {
              "schema": 1,
              # Monotonic, and never reset: the client refuses to go backwards
              # on it, because an old validly-signed "everybody takes this"
              # re-served after a halt is a downgrade attack that needs no key.
              "serial": int(old.get("serial", 0)) + 1,
              "issued": now,
              # Fourteen days. The client caps the age at thirty whatever this
              # says, so this is the publisher promising to re-publish sooner
              # than it has to — and a ramp that has not moved in a fortnight is
              # not a ramp any more.
              "expires": now + 14 * 24 * 3600,
              "repository": os.environ["IMAGE"],
              "channels": others + [entry],
          }
          json.dump(doc, open(f"{D}/rollout.json", "w"), indent=2, sort_keys=True)
          print(json.dumps(doc, indent=2, sort_keys=True))
          PY

      - name: Publish and sign it
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          creds="$GHCR_USER:$GHCR_TOKEN"
          D="${ROLLOUT_DIR:-/tmp}"; export ROLLOUT_DIR="$D"
          rm -rf "$D/rollout-new" && mkdir -p "$D/rollout-new"
          # An OCI image manifest with one layer, assembled by hand. `oras` would
          # do this and is one more tool to install and pin; skopeo is already
          # here for the tag move above, and `dir:` is the transport the client's
          # own fetch path reads — `rimed/rime/src/verify.rs::fetch` copies to
          # `dir:` and parses exactly this manifest.
          python3 - <<'PY'
          import hashlib, json, os, shutil

          D = os.environ.get("ROLLOUT_DIR", "/tmp")
          body = open(f"{D}/rollout.json", "rb").read()
          bh = hashlib.sha256(body).hexdigest()
          shutil.copyfile(f"{D}/rollout.json", f"{D}/rollout-new/{bh}")
          cfg = b"{}"
          ch = hashlib.sha256(cfg).hexdigest()
          open(f"{D}/rollout-new/{ch}", "wb").write(cfg)
          json.dump({
              "schemaVersion": 2,
              "mediaType": "application/vnd.oci.image.manifest.v1+json",
              # KEPT under its pre-rebrand name: every client in the field
              # finds the document by this media type (ROLLOUT_MEDIA_TYPE).
              "artifactType": "application/vnd.apexos.rollout.v1+json",  # rime-rename: keep (wire format)
              "config": {
                  "mediaType": "application/vnd.oci.empty.v1+json",
                  "digest": "sha256:" + ch,
                  "size": len(cfg),
              },
              "layers": [{
                  "mediaType": "application/vnd.apexos.rollout.v1+json",  # rime-rename: keep (wire format)
                  "digest": "sha256:" + bh,
                  "size": len(body),
              }],
          }, open(f"{D}/rollout-new/manifest.json", "w"))
          PY
          skopeo copy --retry-times 3 --dest-creds "$creds" \
            "dir:$D/rollout-new" "docker://$IMAGE:rollout"
          got="$(skopeo inspect --creds "$creds" --format '{{.Digest}}' "docker://$IMAGE:rollout")"
          # Signed under THIS workflow's Sigstore identity, which is not
          # build-image.yml's. See the header: the client derives the identity it
          # expects by swapping the workflow filename, so this file's name is
          # part of the trust chain.
          cosign sign --yes "$IMAGE@$got"
          echo "  ok   :rollout -> $got, signed"
          {
            echo "### Rollout document"
            echo ""
            echo '```json'
            cat "$D/rollout.json"
            echo '```'
            echo ""
            echo "\`$IMAGE:rollout\` is \`$got\`. Machines read it on their next \`rime update\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Say what happened
        env:
          TARGET: ${{ inputs.channel }}
          DIGEST: ${{ inputs.digest }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          {
            echo "### ${MODE}: ${TARGET}"
            echo ""
            if [ "$MODE" = promote ]; then
              echo "\`$IMAGE:$TARGET\` now resolves to \`$DIGEST\`."
            else
              echo "No tag was moved. \`$IMAGE:$TARGET\` was already \`$DIGEST\`."
            fi
            echo ""
            echo "Machines following it take it on their next \`rime update\`, subject to the"
            echo "rollout document above."
          } >> "$GITHUB_STEP_SUMMARY"
