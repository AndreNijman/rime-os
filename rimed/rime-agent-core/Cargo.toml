[package]
name = "rime-agent-core"
description = "Rime OS agent runtime library: session protocol, adapters, sandbox policy, projects and checkpoints"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "rime_agent_core"
path = "src/lib.rs"

# `test-support` compiles `webauthn::test_support`, whose `Signer` is the only
# thing in this repository that can mint a valid assertion. It is off by
# default and must stay a DEV-dependency feature everywhere: the workspace is
# on resolver 2, so a feature asked for in `[dev-dependencies]` is not unified
# into a `cargo build` of the shipped binaries. It exposes a private key, never
# a `SecondFactor` constructor — see the module's own doc comment.
[features]
test-support = []

[dependencies]
rime-paths = { path = "../rime-paths" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
