[workspace]
resolver = "2"
members = ["rimed-core", "rimed", "rime", "rime-agent-core", "rime-agentd", "rime-aid", "rime-secret-core", "rime-secretd", "rime-backup-core", "rime-perm-core", "rime-remote-core", "rime-remoted", "rime-paths"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["AndreNijman"]
repository = "https://github.com/AndreNijman/rime-os"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
toml = "0.8"
zbus = { version = "4", default-features = false, features = ["tokio"] }
zvariant = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "signal", "sync"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
